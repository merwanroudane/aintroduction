      - {n: 5, "title": "الفرق بين Artificial Intelligence وMachine Learning وDeep Learning", modules: [4], kind: نظري, level: 1,
         applied: "ارسم المخطط الهرمي، وضع فيه خمسة أنظمة حقيقية في مواضعها الصحيحة مع التبرير.",
         fits: [الكل]}
      - {n: 6, title: الفرق بين التعلّم الآلي التقليدي والذكاء الاصطناعي التوليدي, modules: [4, 9], kind: نظري, level: 2,
