         fits: [الكل]}
      - {n: 2, title: تاريخ الذكاء الاصطناعي ومراحل تطوره, modules: [2], kind: نظري, level: 1,
         applied: "ابنِ خطًا زمنيًا يربط كل محطة بـ**العامل الذي أتاحها** (بيانات، أو عتاد، أو فكرة)، وبيّن سبب الشتاءين.",
