      - {n: 3, "title": "أنواع الذكاء الاصطناعي: Narrow AI وGeneral AI وSuper AI", modules: [3], kind: نظري, level: 1,
         applied: "صنّف عشرة أنظمة تستعملها فعلًا، وبرّر تصنيف كل واحد. ثم ناقش: ما الذي يمنع عدّ أي منها ذكاءً عامًا؟",
         fits: [الكل]}
      - {n: 4, title: مجالات الذكاء الاصطناعي الرئيسية, modules: [1], kind: نظري, level: 1,
         applied: "اختر مجالًا واحدًا وتتبّع مثالًا واقعيًا فيه من المدخلات إلى المخرجات إلى القرار.",
