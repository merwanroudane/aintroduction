# بنك مواضيع البحوث القصيرة لحصص الأعمال الموجّهة (TD).
#
# كل موضوع مرتبط بمحاور المقرر التي تغطيه (modules)، حتى يذهب الطالب إلى المحاضرة مباشرة
# بدل أن يبدأ من محرك بحث. ولكل موضوع:
#   kind      نظري | تطبيقي | مختلط  — لتوزيع متوازن على المجموعات
#   level     1 مبتدئ | 2 متوسط | 3 متقدم  — الترتيب الزمني في السداسي يتبعه
#   applied   الجزء التطبيقي المطلوب تحديدًا (لا "ابحث في الإنترنت")
#   fits      التخصصات التي يناسبها الموضوع أكثر
intro: |
  خمسة وستون موضوعًا مرتّبة في سبعة محاور تتبع **ترتيب المقرر نفسه**: من المفاهيم الأساسية،
  إلى التعلّم الآلي والعميق، إلى الذكاء الاصطناعي التوليدي والنماذج اللغوية، إلى هندسة
  الأوامر، ثم التطبيقات، ثم الأخلاقيات، ثم المجتمع والمستقبل.

  وكل موضوع هنا **مرتبط بمحاضرات المقرر التي تغطيه**، ومعه **الجزء التطبيقي المطلوب منه
  تحديدًا** — لأن البحث الذي يكتفي بجمع المعلومات لا يعلّم الطالب شيئًا عن الأدوات نفسها.

levels:
  1: مبتدئ — يصلح من الأسابيع الأولى
  2: متوسط — بعد تغطية المحاور 4 إلى 7
  3: متقدم — في النصف الثاني من السداسي

axes:
  - id: ax1
