# Course-level assessments. The pre-test is diagnostic (not graded); the post-test measures the
# official objectives with questions beyond memorisation. `topic` feeds the diagnostic profile.

pretest:
  intro: >-
    اختبار تشخيصي قصير (18 سؤالًا) يُجرى قبل بدء المقرر. لا يُحتسب في التقييم ولا يُقصد به الحكم على الطالب،
    بل تحديد نقطة الانطلاق: ما الذي تعرفه مسبقًا، وما التصورات التي تحتاج إلى مراجعة. أجب بصدق دون بحث.
  how_to_use:
    - "للطالب: الملف التشخيصي في آخر الاختبار يبين المجالات التي تحتاج فيها إلى عناية أكبر؛ ستجد في كل محور اختبار دخول قصيرًا يعود إليها."
    - "للأستاذ: متوسط نتائج القسم في كل مجال يقترح أين يتوسع وأين يختصر؛ قارن النتائج بالاختبار البعدي لقياس التقدم."
    - "الاختبار البعدي العام يغطي المجالات نفسها بأسئلة أعمق (تطبيق وتحليل وتقييم)."
  topics:
    concepts: المفاهيم الأساسية
    ai_ml: AI والتعلم الآلي والتعلم العميق
    history_types: التاريخ والأنواع
    genai: الذكاء الاصطناعي التوليدي
    llm: النماذج اللغوية الكبيرة
    prompting: هندسة الأوامر
    ethics: الأخلاقيات والتحيز
    privacy: الخصوصية والأمان
    oversight: الرقابة البشرية
  questions:
    - {id: pre-01, topic: concepts, type: tf, bloom: remember, prompt: "كل برنامج حاسوبي يعمل تلقائيًا هو نظام ذكاء اصطناعي.", answer: false,
       explanation: "البرنامج الذي يطبق قواعد ثابتة مكتوبة صراحة ليس ذكاءً اصطناعيًا بالضرورة؛ نظام الذكاء الاصطناعي يستنتج من المدخلات كيف يولّد مخرجاته.", review: m01-l01}
    - {id: pre-02, topic: concepts, type: mcq, bloom: understand, prompt: "أي مما يلي مثال على «التعزيز» (Augmentation) لا «الأتمتة»؟",
       options: ["آلة تفرز الطرود دون تدخل بشري", "أداة تقترح على الطبيب مناطق مشبوهة في صورة أشعة والطبيب يقرر", "مرشح يحذف الرسائل المزعجة تلقائيًا", "نظام يمنح القروض آليًا"],
       answer: 1, explanation: "في التعزيز يبقى الإنسان صاحب القرار ويوسع النظام قدرته.", review: m01-l02}
    - {id: pre-03, topic: ai_ml, type: mcq, bloom: understand, prompt: "ما العلاقة الصحيحة بين الذكاء الاصطناعي (AI) والتعلم الآلي (ML) والتعلم العميق (DL)؟",
       options: ["ثلاثة حقول منفصلة لا علاقة بينها", "DL ⊂ ML ⊂ AI", "AI ⊂ ML ⊂ DL", "ML و AI مصطلحان مترادفان"],
       answer: 1, explanation: "علاقة تضمين: التعلم العميق عائلة من طرق التعلم الآلي، والتعلم الآلي منهج داخل الذكاء الاصطناعي.", review: m04-l01}
    - {id: pre-04, topic: ai_ml, type: mcq, bloom: understand, prompt: "نظام يتعلم من آلاف الصور المصنفة مسبقًا («قط» / «كلب») ليصنف صورًا جديدة. أي نمط تعلم هذا؟",
       options: ["التعلم غير الموجَّه", "التعلم الموجَّه (Supervised)", "التعلم المعزز", "لا يتعلم أصلًا"],
       answer: 1, explanation: "وجود أمثلة معلّمة (مدخل + فئة صحيحة) هو علامة التعلم الموجَّه.", review: m04-l02}
    - {id: pre-05, topic: ai_ml, type: tf, bloom: understand, prompt: "إذا حقق نموذج دقة عالية جدًا على بيانات التدريب، فهذا يضمن أنه سيعمل جيدًا على بيانات جديدة.", answer: false,
       explanation: "قد يحفظ النموذج بيانات التدريب دون أن يعمم (الإفراط في التوافق Overfitting)؛ لذلك يُقيّم على بيانات اختبار منفصلة.", review: m04-l05}
    - {id: pre-06, topic: history_types, type: tf, bloom: remember, prompt: "الذكاء الاصطناعي حقل حديث ظهر في العقد الأخير.", answer: false,
       explanation: "صيغ المصطلح سنة 1955 وعُقدت ورشة Dartmouth سنة 1956؛ للحقل تاريخ طويل من الصعود والتراجع.", review: m02-l01}
    - {id: pre-07, topic: history_types, type: mcq, bloom: understand, prompt: "ما الوصف الأدق لأنظمة الذكاء الاصطناعي المستعملة اليوم؟",
       options: ["ذكاء فائق يتجاوز الإنسان في كل شيء", "ذكاء عام مكافئ للإنسان", "أنظمة قوية في مهام أو نطاقات محددة، ومفهوما الذكاء العام والفائق ما زالا محل نقاش", "أنظمة واعية بذاتها"],
       answer: 2, explanation: "الأنظمة الحالية أقرب إلى الذكاء الضيق وإن اتسع نطاق النماذج التأسيسية؛ AGI وASI مفاهيم نظرية محل جدل.", review: m03-l01}
    - {id: pre-08, topic: genai, type: mcq, bloom: understand, prompt: "ما الذي يميز الذكاء الاصطناعي التوليدي؟",
       options: ["أنه يصنف البيانات فقط", "أنه ينتج محتوى جديدًا كالنص والصورة والصوت", "أنه لا يحتاج إلى بيانات", "أنه يعمل دون حاسوب"],
       answer: 1, explanation: "التوليد إنتاج محتوى جديد، ومخرجه لا يملك إجابة صحيحة واحدة.", review: m01-l02}
    - {id: pre-09, topic: genai, type: tf, bloom: understand, prompt: "نماذج توليد الصور تنسخ صورًا جاهزة من قاعدة بيانات وتلصقها.", answer: false,
       explanation: "تتعلم النماذج أنماطًا إحصائية من بيانات التدريب وتولّد صورًا جديدة (مثلًا بالانتشار Diffusion)، وإن طرحت أسئلة حقيقية حول حقوق بيانات التدريب.", review: m09-l02}
    - {id: pre-10, topic: llm, type: mcq, bloom: understand, prompt: "كيف ينتج النموذج اللغوي الكبير نصه أساسًا؟",
       options: ["يبحث عن الإجابة الجاهزة في قاعدة بيانات", "يتنبأ تكراريًا بالرمز (token) التالي الأرجح وفق ما تعلمه", "يستشير خبيرًا بشريًا", "يترجم من لغة برمجة"],
       answer: 1, explanation: "التنبؤ بالرمز التالي هو الآلية الأساسية؛ ولهذا قد يكون النص طليقًا دون أن يكون صحيحًا.", review: m07-l01}
    - {id: pre-11, topic: llm, type: tf, bloom: understand, prompt: "قد يذكر مساعد حواري مرجعًا علميًا بعنوان ومؤلفين وسنة، ثم يتبين أن المرجع غير موجود.", answer: true,
       explanation: "هذه إحدى صور الهلوسة (Hallucination)؛ لذلك يُتحقق من كل مرجع.", review: m07-l03}
    - {id: pre-12, topic: prompting, type: mcq, bloom: apply, prompt: "أي الأوامر التالية أوضح لطلب ملخص مقال؟",
       options: ["لخص", "لخص هذا المقال", "لخص المقال التالي في 5 نقاط لطلبة السنة الأولى، مع ذكر الفكرة الرئيسة أولًا، دون إضافة معلومات من خارجه", "اكتب شيئًا عن المقال"],
       answer: 2, explanation: "الأمر الجيد يحدد المهمة والجمهور والشكل والقيود.", review: m05-l01}
    - {id: pre-13, topic: prompting, type: tf, bloom: understand, prompt: "كتابة أمر (prompt) جيد جدًا تمنع النموذج من الخطأ نهائيًا.", answer: false,
       explanation: "الأمر الجيد يقلل الأخطاء ولا يلغيها؛ التحقق يبقى ضروريًا.", review: m05-l01}
    - {id: pre-14, topic: ethics, type: mcq, bloom: understand, prompt: "كيف يمكن أن يصبح نظام ذكاء اصطناعي منحازًا؟",
       options: ["لا يمكن، فالخوارزميات محايدة دائمًا", "إذا تعلم من بيانات تاريخية تعكس تمييزًا سابقًا أو من بيانات غير ممثلة لكل الفئات", "فقط إذا برمجه شخص سيئ النية", "فقط إذا كان صغير الحجم"],
       answer: 1, explanation: "التحيز قد يدخل من البيانات والقياس والتصميم والاستعمال، دون نية سيئة.", review: m11-l02}
    - {id: pre-15, topic: ethics, type: tf, bloom: understand, prompt: "حذف متغير «الجنس» من البيانات يكفي دائمًا لجعل نموذج التوظيف منصفًا.", answer: false,
       explanation: "متغيرات أخرى قد تحمل المعلومة نفسها بشكل غير مباشر (متغيرات بديلة)؛ الإنصاف يُقاس ولا يُفترض.", review: m11-l02}
    - {id: pre-16, topic: privacy, type: mcq, bloom: apply, prompt: "تريد استعمال مساعد حواري لتحليل ملف فيه أسماء الطلبة ونقاطهم. ما التصرف الأنسب أولًا؟",
       options: ["رفع الملف كما هو", "فهم سياسة البيانات للأداة، وإزالة الأسماء أو استبدالها برموز، ورفع الحد الأدنى الضروري فقط", "نشر الملف علنًا ثم تحليله", "لا يهم ما دامت الأداة معروفة"],
       answer: 1, explanation: "مبدأ تقليل البيانات وإخفاء الهوية: لا تضع بيانات حساسة قبل فهم سياسة الخصوصية.", review: m12-l01}
    - {id: pre-17, topic: privacy, type: tf, bloom: understand, prompt: "النص المخفي في صفحة ويب أو ملف قد يحتوي تعليمات تحاول التلاعب بمساعد ذكاء اصطناعي يقرأ ذلك المحتوى.", answer: true,
       explanation: "هذا هو حقن الأوامر غير المباشر (Indirect Prompt Injection)؛ المحتوى غير الموثوق بيانات وليس أوامر.", review: m12-l03}
    - {id: pre-18, topic: oversight, type: mcq, bloom: evaluate, prompt: "في أي حالة يجب ألا يُترك القرار لنظام الذكاء الاصطناعي وحده؟",
       options: ["اقتراح أغنية", "ترتيب نتائج البحث عن مطعم", "قرار يمس حقوق شخص أو صحته ولا يمكن التراجع عنه بسهولة", "تصحيح إملاء رسالة"],
       answer: 2, explanation: "القرارات عالية المخاطر أو غير القابلة للعكس أو الماسة بالحقوق تتطلب رقابة بشرية فعلية.", review: m13-l01}

posttest:
  intro: >-
    اختبار نهائي (35 سؤالًا) يغطي الأهداف العامة الخمسة للمقرر. الأسئلة تتجاوز الحفظ إلى الفهم والتطبيق والتحليل
    والتقييم، وكثير منها سيناريوهات قصيرة. تظهر التغذية الراجعة ورابط المحاضرة المرتبطة بعد التصحيح.
  questions:
    # Objective 1 — concepts and history
    - {id: post-01, topic: concepts, type: mcq, bloom: understand, prompt: "لماذا يعتمد قانون الذكاء الاصطناعي الأوروبي تعريفًا «وظيفيًا» لنظام الذكاء الاصطناعي؟",
       options: ["لأنه يريد تنظيم الشبكات العصبية فقط", "ليحدد ما يخضع للتنظيم بصرف النظر عن التقنية فلا يتقادم بتغيرها", "لأن التعريفات الأكاديمية ممنوعة قانونًا", "ليستثني الأنظمة التوليدية"],
       answer: 1, explanation: "التعريف الوظيفي (الاستنتاج من المدخلات وتوليد مخرجات مؤثرة) يصمد أمام تغير التقنيات.", review: m01-l01}
    - {id: post-02, topic: concepts, type: scenario, bloom: analyze, scenario: "مستشفى يستعمل نظامًا يعرض للطبيب احتمال الإصابة بالإنتان مع أهم المؤشرات، والطبيب يقرر العلاج.",
       prompt: "ما الوظائف التي يؤديها النظام بدقة؟", options: ["توليد وأتمتة", "تنبؤ ودعم قرار", "تحسين فقط", "تصنيف وأتمتة كاملة"],
       answer: 1, explanation: "احتمال (تنبؤ) يُعرض على الطبيب صاحب القرار (دعم قرار).", review: m01-l02}
    - {id: post-03, topic: concepts, type: mcq, bloom: evaluate, prompt: "عنوان صحفي: «نظام ذكاء اصطناعي يشخص السرطان أفضل من الأطباء». ما أول سؤال نقدي ينبغي طرحه؟",
       options: ["ما اسم الشركة؟", "ما مستوى الدليل ومن أي بيانات وعلى أي فئة من المرضى وبمقارنة مع من؟", "هل النظام مكتوب بلغة Python؟", "كم سعر النظام؟"],
       answer: 1, explanation: "القراءة النقدية تبدأ بنوع الدليل والعينة والمقارنة (المحاضرة 1.4).", review: m01-l04}
    - {id: post-04, topic: history_types, type: mcq, bloom: understand, prompt: "ما السبب الرئيس لتراجع الأنظمة الخبيرة بعد ازدهارها في الثمانينيات؟",
       options: ["منعها قانونًا", "صعوبة استخراج المعرفة من الخبراء وصيانة آلاف القواعد وهشاشتها أمام الحالات غير المتوقعة", "أنها كانت دقيقة أكثر من اللازم", "اختفاء الحواسيب"],
       answer: 1, explanation: "عنق زجاجة اكتساب المعرفة والهشاشة وتكلفة الصيانة من أسباب الشتاء الثاني.", review: m02-l03}
    - {id: post-05, topic: history_types, type: multi, bloom: analyze, prompt: "أي العوامل التالية ساهمت في ثورة التعلم العميق بعد 2010؟ (اختر كل ما ينطبق)",
       options: ["توفر بيانات ضخمة مصنفة مثل ImageNet", "وحدات المعالجة الرسومية (GPU)", "تحسينات خوارزمية في تدريب الشبكات", "التخلي الكامل عن الرياضيات"],
       answer: [0, 1, 2], explanation: "اجتماع البيانات والحوسبة والخوارزميات هو التفسير المعتمد.", why_wrong: {3: "التعلم العميق قائم على الرياضيات (الجبر الخطي والتفاضل والاحتمالات)."}, review: m02-l04}
    - {id: post-06, topic: history_types, type: mcq, bloom: understand, prompt: "ما البنية التي قدمتها ورقة «Attention Is All You Need» سنة 2017 وقامت عليها أغلب النماذج اللغوية الكبيرة؟",
       options: ["الشبكة الالتفافية", "المحوّل (Transformer)", "شجرة القرار", "النظام الخبير"],
       answer: 1, explanation: "المحوّل القائم على آلية الانتباه الذاتي.", review: m02-l05}
    # Objective 2 — types and branches
    - {id: post-07, topic: history_types, type: tf, bloom: evaluate, prompt: "امتلاك نظام «وكيل ذكي» (AI Agent) يخطط ويستعمل أدوات يعني أننا بلغنا الذكاء الاصطناعي العام (AGI).", answer: false,
       explanation: "الوكيل يعمل داخل أدوات وصلاحيات محددة ويخفق خارجها؛ AI Agent ≠ AGI.", review: m03-l02}
    - {id: post-08, topic: history_types, type: mcq, bloom: analyze, prompt: "تصنيف «الآلات التفاعلية، الذاكرة المحدودة، نظرية العقل، الوعي الذاتي» هو:",
       options: ["تصنيف تقني رسمي معتمد في المعايير الدولية", "تصنيف تعليمي تبسيطي، والفئتان الأخيرتان نظريتان غير متحققتين", "تصنيف قانوني في القانون الأوروبي", "تصنيف لأنواع الحواسيب"],
       answer: 1, explanation: "تصنيف شائع للتبسيط التعليمي، ولا يمثل تقسيمًا تقنيًا دقيقًا.", review: m03-l03}
    - {id: post-09, topic: ai_ml, type: scenario, bloom: apply, scenario: "بنك لديه بيانات عملاء دون أي تصنيف مسبق، ويريد اكتشاف مجموعات متشابهة السلوك لتصميم عروض مختلفة.",
       prompt: "ما نمط التعلم الأنسب؟", options: ["التعلم الموجَّه", "التعلم غير الموجَّه (التجميع)", "التعلم المعزز", "التعلم الذاتي الإشراف لتوليد النصوص"],
       answer: 1, explanation: "لا توجد تسميات: اكتشاف البنية هو التعلم غير الموجَّه.", review: m04-l02}
    - {id: post-10, topic: ai_ml, type: mcq, bloom: understand, prompt: "ما الفرق بين المعاملات (Parameters) والمعاملات الفائقة (Hyperparameters)؟",
       options: ["لا فرق", "المعاملات يتعلمها النموذج من البيانات، والفائقة يحددها المصمم قبل التدريب (مثل معدل التعلم)", "الفائقة يتعلمها النموذج والمعاملات يحددها المصمم", "المعاملات خاصة بالنصوص فقط"],
       answer: 1, explanation: "الأوزان تُتعلم، ومعدل التعلم وعدد الطبقات يُختاران.", review: m04-l03}
    - {id: post-11, topic: ai_ml, type: scenario, bloom: analyze, scenario: "نموذج خطأه على بيانات التدريب 2% وعلى بيانات الاختبار 35%.",
       prompt: "ما التشخيص الأرجح؟", options: ["نقص التوافق (Underfitting)", "الإفراط في التوافق (Overfitting)", "النموذج مثالي", "خطأ في الحاسوب"],
       answer: 1, explanation: "فجوة كبيرة بين خطأ التدريب والاختبار علامة على الحفظ دون تعميم.", review: m04-l05}
    - {id: post-12, topic: ai_ml, type: scenario, bloom: evaluate, scenario: "نظام لكشف مرض نادر (1% من السكان) يحقق «دقة» (Accuracy) 99%.",
       prompt: "لماذا قد يكون هذا الرقم مضللًا؟", options: ["لأن 99% رقم منخفض", "لأن نموذجًا يقول «سليم» للجميع يحقق 99% دون أن يكشف أي مريض؛ يجب النظر إلى الاستدعاء والدقة الإيجابية", "لأن الدقة لا تُحسب للأمراض", "ليس مضللًا"],
       answer: 1, explanation: "في البيانات غير المتوازنة لا تكفي الدقة الإجمالية.", review: m04-l06}
    - {id: post-13, topic: ai_ml, type: mcq, bloom: understand, prompt: "في النيورون الاصطناعي، ما دور دالة التنشيط (Activation function)؟",
       options: ["تخزين البيانات", "إدخال لاخطية على المجموع الموزون تسمح للشبكة بتمثيل علاقات معقدة", "حذف الأوزان", "طباعة النتائج"],
       answer: 1, explanation: "دون لاخطية تنهار الشبكة متعددة الطبقات إلى دالة خطية واحدة.", review: m04-l04}
    # Objective 3 — LLMs, prompting, tools
    - {id: post-14, topic: llm, type: mcq, bloom: understand, prompt: "ماذا يحدث عمومًا عند رفع «درجة الحرارة» (Temperature) في توليد النص؟",
       options: ["يصبح النص أكثر حتمية وتكرارًا", "يصبح توزيع الاحتمالات أكثر تسطحًا فتزداد العشوائية والتنوع", "يتوقف النموذج", "تزداد صحة المعلومات"],
