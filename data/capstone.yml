# Final capstone. The official objective 4 is «تعزيز الفهم التطبيقي من خلال مشروع عملي بسيط»:
# tracks are deliberately scoped to be feasible in ~8 weeks by groups of 2–4 students without paid APIs.

intro: >-
  يحقق المشروع العملي الختامي الهدف الرابع من الأهداف العامة للمقرر: «تعزيز الفهم التطبيقي من خلال مشروع عملي بسيط».
  يختار الفريق (2–4 طلبة) مسارًا من ستة، ويُنجز خلال نحو ثمانية أسابيع مشروعًا صغير النطاق لكنه كامل: مشكلة محددة،
  واستعمال موثق للذكاء الاصطناعي، وتحقق من النتائج، وتحليل أخلاقي، وعرض نهائي.

general:
  - "البساطة مقصودة: مشروع صغير منجز بإتقان وموثق بأمانة أفضل من مشروع طموح غير مكتمل."
  - "لا يُشترط دفع اشتراك في أي أداة: يمكن استعمال النسخ المجانية أو أدوات مفتوحة المصدر أو مختبرات المنصة."
  - "كل استعمال للذكاء الاصطناعي يُوثّق في «سجل الاستعمال»: الأداة، التاريخ، الأمر المستعمل، المخرج، ما عُدّل وما رُفض ولماذا."
  - "لا تُرفع بيانات شخصية أو سرية إلى أي أداة؛ تُستعمل بيانات عامة أو مصطنعة أو مجهولة الهوية (المحور 12)."
  - "كل معلومة أو رقم أو مرجع في التقرير يُتحقق منه من مصدر أولي (المحور 8)."
  - "يتضمن التقرير قسمًا بعنوان «حدود المشروع» يذكر بصدق ما لم ينجح."

phases:
  - {phase: "اختيار المسار وصياغة المشكلة وتكوين الفريق", week: "الأسبوع 5", output: "بطاقة مشروع (صفحة واحدة): المشكلة، الجمهور، الهدف، البيانات، الأداة"}
  - {phase: "المراجعة والتخطيط", week: "الأسبوعان 6–7", output: "خطة عمل + قائمة مصادر موثقة + تحليل أولي للمخاطر"}
  - {phase: "الإنجاز والتجريب", week: "الأسابيع 8–11", output: "نموذج أولي أو نتائج أولية + سجل استعمال الذكاء الاصطناعي"}
  - {phase: "التحقق والتقييم", week: "الأسبوع 12", output: "تقرير تحقق: ما الذي صُحح؟ ما نسبة الأخطاء؟"}
  - {phase: "التحليل الأخلاقي والخصوصية", week: "الأسبوع 13", output: "قسم أخلاقيات وخصوصية ورقابة بشرية"}
  - {phase: "العرض النهائي", week: "الأسبوع 14", output: "تقرير نهائي (8–12 صفحة) + عرض 10 دقائق + 5 دقائق أسئلة"}

tracks:
  - code: A
    title: مشروع تعليمي بالذكاء الاصطناعي
    title_en: Educational AI Project
    problem: "صعوبة يواجهها الطلبة في فهم مفهوم معين من مقرر في تخصصهم (مثال: المرونة السعرية، أو الاشتقاق، أو قواعد الاستشهاد)."
    objectives:
      - "تصميم مورد تعلم ذاتي (دليل، سلسلة تمارين متدرجة، أسئلة تقييم ذاتي) بمساعدة الذكاء الاصطناعي."
      - "التحقق العلمي من كل محتوى مولَّد قبل اعتماده."
      - "اختبار المورد على زملاء وقياس أثره بسيطًا (اختبار قبلي وبعدي)."
    scope: "مفهوم واحد أو مفهومان مترابطان، ومورد لا يتجاوز 10 صفحات أو 15 تمرينًا."
    requirements: ["أهداف تعلم مصاغة بأفعال بلوم", "5 طلبة مختبرين على الأقل", "سجل استعمال الذكاء الاصطناعي", "مراجعة علمية لكل تمرين"]
    tasks:
      - "تحديد المفهوم والفئة المستهدفة وأخطائها الشائعة."
      - "كتابة قالب أوامر (Prompt template) لتوليد الشروح والتمارين."
      - "توليد المسودة، ثم تصحيحها وتحسينها يدويًا، وتوثيق كل تصحيح."
      - "إعداد اختبار قبلي وبعدي من 5 أسئلة وتجريب المورد."
      - "تحليل النتائج وكتابة التوصيات."
    deliverables: ["المورد التعليمي النهائي", "قالب الأوامر", "سجل الاستعمال والتصحيحات", "نتائج التجريب"]
    ethics: "الإفصاح للطلبة المختبرين عن استعمال الذكاء الاصطناعي في إعداد المورد؛ عدم تقديم المحتوى المولَّد كعمل أصلي كامل."
    privacy: "نتائج المختبرين مجهولة الهوية (رموز لا أسماء)، وموافقتهم على المشاركة."
    verification: "مقارنة كل شرح وتمرين بمرجع جامعي معتمد؛ نسبة الأخطاء المكتشفة في المسودة المولدة تُذكر في التقرير."
    presentation: "عرض المورد مع مثالين على أخطاء مولَّدة جرى تصحيحها، ونتائج الاختبار القبلي والبعدي."
    instructor_notes:
      - "أغنى لحظة تعلم في هذا المسار هي توثيق الأخطاء المكتشفة؛ امنحها وزنًا في التقييم."
      - "حذّر من قياس «الأثر» بعينة صغيرة: النتيجة وصفية لا استدلالية."

  - code: B
    title: تطبيق اقتصادي للذكاء الاصطناعي
    title_en: Economic AI Application
    problem: "سؤال اقتصادي تطبيقي بسيط يمكن معالجته ببيانات عامة (مثال: التنبؤ بالتضخم الشهري، أو تحليل نبرة بيانات البنك المركزي، أو تجميع ولايات حسب مؤشرات)."
    objectives:
      - "تطبيق نموذج تعلم آلي بسيط ومقارنته بخط أساس اقتصادي تقليدي."
      - "التمييز الصريح بين التنبؤ والتفسير السببي في تفسير النتائج."
      - "استعمال مساعد ذكاء اصطناعي في كتابة الشيفرة أو تنظيف البيانات مع التحقق منها."
    scope: "مجموعة بيانات عامة واحدة، ونموذجان على الأكثر مقارنة بخط أساس، وتقييم خارج العينة."
    requirements: ["بيانات من مصدر رسمي (ديوان إحصاء، بنك مركزي، البنك الدولي، IMF)", "خط أساس (متوسط، انحدار خطي، أو نموذج ARIMA)", "تقييم خارج العينة بمقياس مناسب (RMSE، MAE)", "سجل استعمال الذكاء الاصطناعي في الشيفرة"]
    tasks:
      - "صياغة السؤال وتحديد نوعه: تنبؤي أم سببي؟"
      - "جمع البيانات وتوثيق مصدرها وتاريخ تحميلها."
      - "بناء خط الأساس ثم نموذج تعلم آلي بسيط (مثل Ridge أو غابة عشوائية)."
      - "المقارنة خارج العينة وتحليل الأخطاء."
      - "كتابة تفسير حذر للنتائج يذكر ما لا يمكن استنتاجه."
    deliverables: ["دفتر حساب (Notebook) أو سكربت قابل لإعادة التنفيذ", "تقرير النتائج", "سجل الاستعمال"]
    ethics: "عدم تقديم نتيجة تنبؤية على أنها أثر سببي؛ الإفصاح عن حدود البيانات."
    privacy: "بيانات كلية منشورة فقط؛ لا بيانات أفراد."
    verification: "إعادة تنفيذ الشيفرة من الصفر؛ مراجعة كل سطر ولّده المساعد وشرحه في التقرير."
    presentation: "رسم بياني للتنبؤات مقابل القيم الفعلية، وجدول مقارنة الأخطاء، وشريحة «ما لا تقوله نتائجنا»."
    instructor_notes:
      - "اطلب شرح كل سطر من الشيفرة المولدة في العرض الشفهي: هذا يكشف الاعتماد غير المفهوم."
      - "إذا لم يتفوق النموذج على خط الأساس فتلك نتيجة علمية مقبولة إذا شُرحت جيدًا."

  - code: C
    title: مشروع في هندسة الأوامر
    title_en: Prompt Engineering Project
    problem: "مهمة نصية متكررة في مجال محدد (مثال: تلخيص مقالات علمية، أو صياغة ملاحظات على تقارير، أو استخراج بيانات من إعلانات توظيف)."
    objectives:
      - "بناء مكتبة أوامر (3–5 قوالب) لمهمة واحدة وتحسينها تكراريًا."
      - "تصميم معيار تقييم (Rubric) وتطبيقه على مخرجات كل نسخة من الأوامر."
      - "مقارنة النسخ بطريقة منهجية على مجموعة اختبار ثابتة."
    scope: "مهمة واحدة، ومجموعة اختبار من 15–20 مدخلًا، وثلاث نسخ على الأقل من الأمر."
    requirements: ["مجموعة اختبار ثابتة", "سلم تقييم مكتوب قبل التجريب", "أداتان على الأقل أو نموذجان للمقارنة إن أمكن", "توثيق الإصدارات"]
    tasks:
      - "تحديد المهمة ومعايير الجودة."
      - "كتابة الأمر الأولي (خط أساس) ثم تحسينه (سياق، أمثلة، قيود، شكل المخرج)."
      - "تقييم كل نسخة على مجموعة الاختبار بسلم التقييم."
      - "تحليل أنماط الفشل المتبقية."
      - "اختبار مقاومة الأمر لمحتوى غير موثوق (حقن أوامر) في المدخلات."
    deliverables: ["مكتبة الأوامر النهائية مع التعليمات", "جدول نتائج التقييم لكل نسخة", "تحليل أنماط الفشل"]
    ethics: "عدم استعمال الأوامر لإنتاج محتوى مضلل أو انتحال؛ ذكر حدود المكتبة."
    privacy: "مدخلات الاختبار عامة أو مصطنعة."
    verification: "تقييم مزدوج مستقل لعينة من المخرجات لقياس اتفاق المقيّمين."
    presentation: "عرض تطور الأمر نسخة بنسخة مع أثر كل تعديل على الدرجات."
    instructor_notes:
      - "أصرّ على كتابة سلم التقييم قبل التجريب؛ هذا يمنع تفصيل المعيار على مقاس النتائج."
      - "ذكّر بأن التحسن على مجموعة الاختبار قد لا يعمم على مدخلات مختلفة."

  - code: D
    title: مشروع في الذكاء الاصطناعي التوليدي
    title_en: Generative AI Project
    problem: "إنتاج مادة إعلامية أو تعليمية متعددة الوسائط (ملصق توعوي، بودكاست قصير، سلسلة رسوم توضيحية) لجمهور محدد."
    objectives:
      - "استعمال أداتين توليديتين على الأقل (نص + صورة أو صوت) في سلسلة إنتاج موثقة."
      - "تطبيق مبادئ الإنتاج المسؤول: الإفصاح، والحقوق، والموافقة."
      - "تقييم جودة المنتج مع الجمهور المستهدف."
    scope: "منتج واحد قصير (ملصق، أو 3 دقائق صوت، أو 6 رسوم)."
    requirements: ["خطة إنتاج", "التحقق من شروط استعمال كل أداة (الاستعمال التجاري، الإسناد)", "إفصاح واضح على المنتج", "لا صور أو أصوات لأشخاص حقيقيين دون موافقة"]
    tasks:
      - "تحديد الجمهور والرسالة والمعايير."
      - "كتابة النصوص وتوليد العناصر المرئية أو الصوتية مع توثيق الأوامر."
      - "المراجعة التحريرية والعلمية والتعديل اليدوي."
      - "التحقق من الحقوق والشروط."
      - "عرض المنتج على 5 أفراد من الجمهور وجمع ملاحظاتهم."
    deliverables: ["المنتج النهائي", "ملف الإنتاج (الأوامر، النسخ، القرارات)", "تقرير الحقوق والإفصاح"]
    ethics: "لا تزييف ولا تضليل؛ إفصاح صريح بأن المحتوى مولَّد بمساعدة الذكاء الاصطناعي."
    privacy: "عدم رفع صور أو أصوات أشخاص حقيقيين؛ عدم استعمال بيانات شخصية في الأوامر."
    verification: "التحقق من كل معلومة في المحتوى من مصدر موثوق."
    presentation: "عرض المنتج وملف الإنتاج وتحليل ملاحظات الجمهور."
    instructor_notes:
      - "انتبه إلى المشاريع التي تنبهر بالشكل وتهمل المضمون: خصص معيارًا للدقة العلمية."
      - "ناقش مع الفريق شروط الاستعمال الفعلية لكل أداة بتاريخها، لأنها تتغير."

  - code: E
    title: تدقيق أخلاقي لنظام ذكاء اصطناعي
    title_en: AI Ethics Audit
    problem: "نظام أو تطبيق ذكاء اصطناعي حقيقي ومتاح للعموم (مثال: أداة ترجمة، أو مرشح محتوى، أو مساعد حواري) يُدقَّق من زاوية الإنصاف والشفافية والخصوصية."
    objectives:
      - "تطبيق إطار تدقيق (مثل وظائف NIST AI RMF: Govern, Map, Measure, Manage) على حالة محددة."
      - "تصميم اختبارات بسيطة لكشف سلوك متحيز أو غير شفاف."
      - "صياغة توصيات قابلة للتنفيذ."
    scope: "نظام واحد، وثلاثة أسئلة تدقيق على الأكثر، و30–60 اختبارًا مصممًا."
    requirements: ["إطار تدقيق موثق", "خطة اختبار مسبقة", "أمثلة اختبار قابلة لإعادة الإنتاج", "تمييز بين الملاحظة والاستنتاج"]
    tasks:
      - "وصف النظام وسياق استعماله وأصحاب المصلحة."
      - "تحديد المخاطر المحتملة (تحيز، شفافية، خصوصية)."
      - "تصميم الاختبارات وتنفيذها وتسجيل النتائج."
      - "تحليل النتائج مع الحذر من التعميم."
      - "كتابة التوصيات وخطة الرقابة البشرية."
    deliverables: ["تقرير تدقيق", "ملف الاختبارات والنتائج", "ملخص تنفيذي من صفحة"]
    ethics: "الاختبار مسؤول: لا محاولات اختراق ولا إساءة استعمال؛ عدم التشهير بمنتج دون دليل."
    privacy: "عدم إدخال بيانات شخصية حقيقية في الاختبارات؛ استعمال شخصيات مصطنعة."
    verification: "تكرار كل اختبار دال مرتين على الأقل لأن المخرجات قد تختلف."
    presentation: "عرض أبرز ثلاثة ممارسات مكتشفة مع أمثلتها، وحدود التدقيق."
    instructor_notes:
      - "راقب أن يبقى التدقيق دفاعيًا وأخلاقيًا؛ لا مكان لمحاولات تجاوز ضوابط الأمان."
      - "علّم الفريق صياغة «لاحظنا في 12 من 40 حالة…» بدل «النظام عنصري»."

  - code: F
    title: مسار عمل للتحقق من مخرجات الذكاء الاصطناعي
    title_en: AI Verification Workflow
    problem: "الطلبة يستعملون المساعدات الحوارية في البحث، لكنهم لا يملكون طريقة منهجية للتحقق من المعلومات والمراجع."
    objectives:
      - "تصميم مسار تحقق (Workflow) من خطوات واضحة لنوع معين من المخرجات (مراجع، أرقام، اقتباسات، ملخصات)."
      - "اختبار المسار على عينة من المخرجات الحقيقية وقياس ما يكشفه."
      - "إنتاج دليل قصير قابل للاستعمال من الزملاء."
    scope: "نوع واحد أو نوعان من المخرجات، و30 مخرجًا على الأقل للاختبار."
    requirements: ["عينة مخرجات موثقة (الأمر، الأداة، التاريخ)", "مسار مكتوب من خطوات", "قياس نتائج (نسبة الأخطاء المكتشفة حسب النوع)", "دليل نهائي من صفحتين"]
    tasks:
      - "جمع عينة المخرجات (مثال: 30 مرجعًا اقترحها مساعد في موضوع ما)."
      - "تصميم خطوات التحقق (DOI، قواعد بيانات المكتبة، المصدر الأولي، القراءة الجانبية)."
      - "تطبيق المسار وتصنيف الأخطاء (مختلق، خاطئ جزئيًا، صحيح)."
      - "تحسين المسار وقياس الوقت اللازم."
      - "كتابة الدليل وتجريبه على زملاء."
    deliverables: ["الدليل النهائي", "جدول نتائج التحقق", "سجل العينة"]
    ethics: "الأمانة في عرض النتائج حتى إن كانت نسبة الأخطاء صغيرة."
    privacy: "لا بيانات شخصية في الأوامر أو العينة."
    verification: "مراجع ثانٍ يعيد التحقق من 10 عناصر عشوائية."
    presentation: "عرض المسار بخطواته، وأمثلة على أخطاء مكتشفة، وإحصاء الأخطاء حسب النوع."
    instructor_notes:
      - "هذا المسار مناسب جدًا لطلبة الماستر والدكتوراه لأنه يخدم عملهم البحثي مباشرة."
      - "اطلب أن يكون الدليل النهائي عمليًا (صفحتان) لا تقريرًا نظريًا."

rubric:
  - criterion: وضوح المشكلة والأهداف
    weight: 15
    levels: ["مشكلة محددة وقابلة للقياس وأهداف بأفعال بلوم", "مشكلة واضحة وأهداف عامة", "مشكلة غامضة جزئيًا", "المشكلة غير محددة"]
  - criterion: الاستعمال المنهجي للذكاء الاصطناعي
    weight: 20
    levels: ["استعمال مبرر وموثق كليًا في سجل الاستعمال مع تحسين تكراري", "استعمال موثق في أغلبه", "توثيق ناقص", "لا توثيق أو استعمال غير مفهوم"]
  - criterion: التحقق من النتائج
    weight: 20
    levels: ["تحقق منهجي من مصادر أولية مع قياس الأخطاء", "تحقق من أغلب المخرجات", "تحقق سطحي", "لا تحقق"]
  - criterion: الأخلاقيات والخصوصية والرقابة
    weight: 15
    levels: ["تحليل دقيق ومحدد بالحالة مع ضوابط قابلة للتنفيذ", "تحليل مناسب لكنه عام أحيانًا", "إشارات عامة", "غياب التحليل"]
  - criterion: جودة المنتج أو النتائج
    weight: 15
    levels: ["منتج أو نتائج مكتملة ومفيدة فعلًا للجمهور", "منتج جيد مع نقائص بسيطة", "منتج غير مكتمل", "لا منتج"]
