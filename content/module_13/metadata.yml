module_number: 13
title: دور الإنسان في الرقابة على الذكاء الاصطناعي
short_title: الرقابة البشرية
title_en: "The human role in overseeing artificial intelligence"
subtitle: الرقابة البشرية ليست شعارًا بل تصميمًا له متطلبات وأنماط فشل معروفة — وهذا ختام المقرر.
description: |
  في كل محور من هذا المقرر وضعنا ضابطًا ينتهي بإنسان: **مراجعة** بشرية للمخرجات (المحور 8)،
  و**رقابة** بشرية على القرار (المحور 11)، و**تأكيد** بشري للأفعال ذات الأثر (المحور 12).
  **وهذا المحور يفحص ذلك الإنسان.**

  والسؤال الذي يحكم المحور كله: **هل المراجعة البشرية تعمل فعلًا؟** والجواب المنهجي: **تعمل إذا صُمّمت،
  وتفشل فشلًا منتظمًا إذا افتُرضت.** فوجود إنسان في المسار **ليس ضابطًا** بنفسه — وقد يكون **أخطر** من
  غيابه، لأنه يمنح النظام غطاءً من المساءلة بلا حماية فعلية.

  ونبدأ بالتمييز بين ثلاثة أدوار يُخلط بينها دائمًا: إنسان **في** الحلقة، وإنسان **على** الحلقة، وإنسان
  **آمِر**. ولكل دور شروط ومخاطر مختلفة.

  ثم **أنماط الفشل**، وهي موثّقة في أدبيات العوامل البشرية **منذ ثمانينيات القرن الماضي** في الطيران
  والتحكم الصناعي — قبل أن تُعاد اكتشافها في الذكاء الاصطناعي. **وتحيّز الأتمتة** أشهرها: أن يقبل الإنسان
  اقتراح النظام حتى مع وجود دليل يخالفه.

  ثم **مستويات الاستقلالية** وتناسبها مع المخاطر، وهو ما وعدنا به في المحاضرة 1.5.

  ثم **تصميم مراجعة تعمل**: المعلومات، والوقت، والسلطة، والحوافز — والأربعة شروط لا نصائح.

  ونختم المقرر كله بتحويل ما تعلّمتَه إلى **ممارسة شخصية**: قائمة قصيرة تحملها معك إلى مذكرتك وإلى عملك.
estimated_duration: "5 حصص × 90 دقيقة"
difficulty: متوسط
keywords: [الرقابة البشرية, تحيّز الأتمتة, الرضا الزائف, مفارقات الأتمتة, تآكل المهارة, مستويات الاستقلالية, سلطة التجاوز, معدل الرفض, الثقة المعايَرة, المراجعة الشكلية]
concept_diagram: m13_concept_map
objectives:
  - {bloom: remember, text: "يعرّف تحيّز الأتمتة والرضا الزائف وتآكل المهارة وسلطة التجاوز والثقة المعايَرة."}
  - {bloom: understand, text: "يميز بين الإنسان في الحلقة وعلى الحلقة والآمِر ويحدد شروط كل دور."}
  - {bloom: understand, text: "يشرح مفارقة الأتمتة ولماذا تزداد صعوبة مهمة الإنسان كلما تحسّن النظام."}
  - {bloom: apply, text: "يطبق مستويات الاستقلالية على نظام محدد ويبرّر المستوى بحجم المخاطر."}
  - {bloom: analyze, text: "يحلل إجراء مراجعة قائمًا ويحدد أي شروطه الأربعة مفقود."}
  - {bloom: evaluate, text: "يقيّم هل مراجعة بشرية في نظام موصوف حقيقية أم شكلية بمؤشرات قابلة للقياس."}
  - {bloom: create, text: "يصمم إجراء مراجعة لنظام في مجاله يحقق الشروط الأربعة ويكون قابلًا للتدقيق."}
prerequisites:
  - المحاضرة 1.2 (الأتمتة مقابل التعزيز) والمحاضرة 1.5 (الاستقلالية خيار تصميمي).
  - المحاضرة 6.5 (مسارات العمل والمراجعة).
  - المحور 11 (الرقابة بوصفها التزامًا) والمحور 12 (التأكيد البشري).
entry:
  prior_knowledge:
    - "يعرف الطالب من المحاضرة 1.2 الفرق بين الأتمتة والتعزيز؛ نبني عليه أدوار الرقابة الثلاثة."
    - "يعرف من المحاضرة 1.5 أن الاستقلالية خيار تصميمي؛ نفصّل مستوياتها ومعيار اختيارها هنا."
    - "يعرف من المحاضرة 6.5 أن معدل الرفض إن كان صفرًا دائمًا فالمراجعة لا تعمل؛ نحوّل ذلك إلى إطار قياس."
    - "يعرف من المحاضرة 12.3 أن التأكيد البشري ينفع بشرطه؛ نشرح الشرط ونقيسه."
  diagnostic_questions:
    - نظام يقترح والإنسان يوافق في 99٪ من الحالات. هل هذه مراجعة بشرية؟ ولماذا؟
    - إذا تحسّن النظام فصار يخطئ مرة في الألف، فهل تصير مهمة المراجع البشري أسهل أم أصعب؟
    - ما الذي يحتاجه موظف ليرفض اقتراح نظام آلي فعلًا، غير الصلاحية النظرية؟
    - من يتحمّل المسؤولية إذا وافق موظف على قرار خاطئ اقترحه نظام؟ وهل الجواب عادل؟
    - هل يمكن أن تكون مراجعة بشرية **أسوأ** من غياب المراجعة؟ كيف؟
exit:
  competencies:
    - أستطيع أن أميّز بين أدوار الرقابة الثلاثة وأحدد المناسب لنظام معيّن.
    - أستطيع أن أسمّي أنماط فشل المراجعة الأربعة وأتعرّف عليها في إجراء قائم.
    - أستطيع أن أشرح مفارقة الأتمتة وأثرها على تصميم عمل المراجع.
    - أستطيع أن أحدد مستوى الاستقلالية المناسب لنظام بحسب مخاطره وأبرّره كتابةً.
    - أستطيع أن أصمم إجراء مراجعة يحقق شروط المعلومات والوقت والسلطة والحوافز.
    - أستطيع أن أقيس هل مراجعة قائمة حقيقية أم شكلية بمؤشرات محددة.
    - أستطيع أن أصوغ ممارستي الشخصية في استعمال هذه الأدوات في بحثي وعملي.
  assessment_activities:
    - "اختبار بعدي يجمع الأدوار وأنماط الفشل والمستويات وشروط المراجعة."
    - "تمرين تشخيص: ثلاثة إجراءات مراجعة، يُطلب تحديد النمط المفقود في كل واحد."
    - "نشاط قياس: تحديد مؤشرات تكشف المراجعة الشكلية في نظام موصوف."
    - "تمرين تصميم: إعادة تصميم إجراء مراجعة فاشل بشروطه الأربعة."
    - "مشروع ختامي: وثيقة رقابة لنظام من اختيار الطالب، تُضم إلى مشروعه الختامي."
    - "تمرين تركيبي: تطبيق قائمة المقرر كلها على حالة واحدة."
  common_mistakes:
    - الاعتقاد أن وجود إنسان في المسار ضابط بنفسه.
    - الاعتقاد أن تحسّن النظام يجعل مهمة المراجع أسهل.
    - الخلط بين الصلاحية النظرية على التجاوز والقدرة الفعلية عليه.
    - قياس المراجعة بوجودها لا بأثرها (بلا معدل رفض ولا زمن مراجعة).
    - تحميل الموظف المسؤولية عن قرار لم يملك وسائل مراجعته.
    - إضافة طلبات تأكيد كثيرة فتصير ضغطات آلية.
    - نسيان أن الأتمتة تآكل المهارة التي تحتاجها المراجعة نفسها.
  remediation:
    - إذا ظننت أن وجود إنسان يكفي، شغّل مختبر المراجعة الشكلية (المحاضرة 13.2) وراقب معدل الرفض.
    - إذا التبست عليك مفارقة الأتمتة، أعد مختبر اليقظة (المحاضرة 13.2) بمعدل خطأ منخفض جدًا.
    - إذا صعب تحديد المستوى المناسب، أعد جدول التناسب في المحاضرة 13.3 وطبّقه على ثلاثة أنظمة تعرفها.
    - راجع المحاضرة 1.2 و1.5 قبل 13.1، فهما أساسها المفاهيمي.
    - إذا بدا المحور نظريًا، ابدأ من المحاضرة 13.4 واصمّم إجراء مراجعة لنظام تستعمله فعلًا.
  suggested_reading: [m13_bainbridge_1983, m13_parasuraman_manzey_2010, m13_green_chen_2019, m13_lee_see_2004, m13_parasuraman_2000_levels]
  bridge: |
    وبهذا يكتمل المقرر. وقد بدأنا من **تعريف** الذكاء الاصطناعي وتاريخه وأنواعه، ثم **كيف يعمل**،
    ثم **كيف نخاطبه ونتحقق منه**، ثم **كيف نوظّفه** في الاقتصاد والبحث، ثم **ما الضوابط** الأخلاقية
    والقانونية والأمنية التي تحكمه — وانتهينا إلى **موقع الإنسان** منه.

    **وما يبقى معك ليس معلومات عن أدوات ستتغير، بل أربع عادات:** أن تحدد **نوع سؤالك** قبل اختيار أداتك،
    وأن **تتحقق** من كل مخرج بمصدره، وأن **توثّق** قراراتك حتى تكون قابلة للفحص، وأن **تعرف حدودك وحدود
    أدواتك** وتصرّح بها.

    **والخطوة التالية عملية: المشروع الختامي** — حيث تطبّق هذا كله على مسألة واحدة من تخصصك، من صياغة
    السؤال إلى التوثيق والعرض.
instructor:
  sequence:
    - "13.1 تضع الأدوار الثلاثة؛ لا تختصرها فهي مفردات المحور كله."
    - "13.2 (أنماط الفشل) هي **عمود المحور** وأكثرها إثارة للنقاش: خصص لها حصة كاملة بمختبرها."
    - "13.3 (المستويات والتناسب) عملية وسريعة؛ يمكن دمج جزء منها مع 13.1 عند ضيق الوقت."
    - "13.4 (تصميم المراجعة) هي حصة العمل: اجعلها ورشة على أنظمة يعرفونها."
    - "13.5 ختام المقرر: اجعلها جلسة تركيب ومراجعة عامة لا محاضرة جديدة."
  timing:
    - "الحصة 1 (90 د): الأسئلة التشخيصية (15 د) + المحاضرة 13.1 (55 د) + نقاش (20 د)."
    - "الحصة 2 (90 د): المحاضرة 13.2 مع مختبري اليقظة والمراجعة الشكلية."
    - "الحصة 3 (90 د): المحاضرة 13.3 مع تمرين التناسب."
    - "الحصة 4 (90 د): المحاضرة 13.4 كورشة تصميم مراجعة."
    - "الحصة 5 (90 د): المحاضرة 13.5 (40 د) + مراجعة عامة للمقرر (25 د) + الاختبار البعدي (25 د)."
    - "في مقرر قصير: 13.2 و13.4 هما الحد الأدنى الذي لا ينزل عنه."
  discussion:
    - "هل يمكن أن تكون المراجعة البشرية غطاءً للمسؤولية بدل أن تكون حماية؟ وكيف نميّز؟"
    - "من العدل أن يُحاسَب على قرار: الموظف الذي وافق، أم من صمّم إجراءً يجعل الرفض متعذرًا؟"
    - "إذا كان النظام أدق من الإنسان في المتوسط، فهل يبقى للمراجعة معنى؟"
    - "كيف نحافظ على مهارة لا نمارسها لأن النظام يؤديها؟"
    - "ما الذي تغيّر في نظرتك إلى هذه الأدوات من المحور الأول إلى الآن؟"
  assessment_ideas:
    - "اعرض إجراء مراجعة موصوفًا واطلب تحديد الشرط المفقود من الأربعة."
    - "أعطِ مؤشرات نظام (معدل الرفض، وزمن المراجعة) واطلب الحكم على جدية المراجعة."
    - "اطلب تحديد مستوى الاستقلالية المناسب لثلاثة أنظمة مع تبرير بحجم المخاطر."
    - "سؤال مقالي: «وجود إنسان في المسار ليس ضابطًا». اشرح بمثال."
    - "اطلب كتابة وثيقة رقابة في صفحة لنظام يعرفه الطالب."
  extensions:
    - "قراءة Bainbridge (1983) كاملة ومناقشة أي مفارقاتها ينطبق على أدوات اليوم."
    - "قراءة Parasuraman و Manzey (2010) ومناقشة الفرق بين الرضا الزائف وتحيّز الأتمتة."
    - "قراءة Green و Chen (2019) ومناقشة ما وجدوه عن حدود الإنسان في الحلقة."
    - "قراءة Lee و See (2004) ومناقشة معنى الثقة المعايَرة وكيف تُبنى."
    - "مقارنة مستويات الأتمتة في Parasuraman وSheridan وWickens (2000) بتصنيف مخاطر المحاضرة 11.6."
