entry:
  - id: m13-e01
    type: mcq
    bloom: understand
    prompt: "نظام يقترح قرارات، والإنسان يوافق في 99٪ من الحالات. هل هذه مراجعة بشرية؟"
    options:
      - "نعم، فالإنسان يراجع كل حالة ويوافق عليها."
      - "لا يمكن الحكم من هذا الرقم وحده، لكنه فرضية عطب تستوجب فحص الزمن والسلطة والحوافز."
      - "نعم، والنسبة المرتفعة دليل على جودة النظام."
      - "لا، فالمراجعة الحقيقية يجب أن تخالف النظام في نصف الحالات."
    answer: 1
    explanation: "معدل مخالفة قريب من الصفر يحتمل تفسيرين: نظام دقيق جدًا، أو مراجعة لا تفحص. ولا يُفصَل بينهما إلا بمؤشرات أخرى: الزمن لكل حالة، والسلطة الفعلية، والحوافز، وكشف الحالات المزروعة."
    review: m13-l02
  - id: m13-e02
    type: mcq
    bloom: understand
    prompt: "إذا تحسّن النظام فصار يخطئ مرة في الألف بدل مرة في العشر، فهل تصير مهمة المراجع أسهل أم أصعب؟"
    options:
      - "أسهل، فالأخطاء صارت أقل فينقص العبء."
      - "أصعب: يقل تدرّبه على كشف الخطأ، واليقظة للحدث النادر مهمة يفشل فيها البشر، وترتفع الثقة فينخفض التشكيك."
      - "لا يتغير شيء، فمهمة المراجعة واحدة."
      - "أسهل، لأن النظام يتولى الحالات الصعبة."
    answer: 1
    explanation: "هذه مفارقة الأتمتة. وقد وصفها Bainbridge سنة 1983: المصمّم يؤتمت ما يستطيع فيبقى للإنسان الأصعب، والمهارة تتآكل بلا ممارسة، والتدخل مطلوب في أسوأ لحظة. فتحسين النظام يوجب إعادة تصميم المراجعة لا الاطمئنان إليها."
    review: m13-l02
  - id: m13-e03
    type: mcq
    bloom: apply
    prompt: "ما الذي يحتاجه موظف ليرفض اقتراح نظام آلي فعلًا، غير الصلاحية النظرية؟"
    options:
      - "تدريب على الثقة بالنفس."
      - "معلومات كافية للحكم، ووقت كافٍ للفحص، وسلطة مباشرة بلا موافقة أعلى، وحوافز لا تعاقب الرفض المبرَّر."
      - "زيادة في الأجر."
      - "نظام أقل دقة حتى يجد ما يرفضه."
    answer: 1
    explanation: "الشروط الأربعة، وغياب أي واحد يُنتج النتيجة نفسها: «يوافق». وأكثر ما يغيب عمليًا هو الوقت ثم الحوافز، وهما الأقل ذكرًا في السياسات المكتوبة لأنهما يكلّفان."
    review: m13-l04
  - id: m13-e04
    type: tf
    bloom: evaluate
    prompt: "مراجعة بشرية شكلية أفضل من لا مراجعة على الأقل، فهي خير من لا شيء."
    answer: false
    explanation: "المراجعة الشكلية تنقل المسؤولية إلى من لم يفحص فينجو التصميم المعطوب، وتمنح غطاءً أمام الرقابة يصعب الطعن فيه، وتزاحم الضوابط الفعلية على موضعها في السياسة والميزانية. والخيار الصحيح ثلاثة لا اثنان، وأصدق من الشكلية أن يُعلَن أن القرار آلي مع سبيل طعن."
    review: m13-l01
  - id: m13-e05
    type: mcq
    bloom: analyze
    prompt: "من يتحمّل المسؤولية إذا وافق موظف على قرار خاطئ اقترحه نظام، وهو لا يملك وقتًا للفحص؟"
    options:
      - "الموظف، فقد وقّع على القرار."
      - "النظام، فقد أخطأ."
      - "من صمّم إجراءً يجعل الفحص متعذرًا ثم نقل المسؤولية إلى الموظف."
      - "لا أحد، فالخطأ وارد في أي نظام."
    answer: 2
    explanation: "تحميل الفرد مسؤولية إجراء معطوب هو نفسه أحد أعراض العطب: فحين يُغلَق التحقيق عند الموظف، لا يصل إلى التصميم الذي جعل الفحص متعذرًا، فيتكرر الضرر مع موظف آخر."
    why_wrong:
      0: "الصلاحية النظرية بلا وقت ولا معلومات ولا غطاء ليست قدرة على المراجعة."
      1: "النظام أدّى ما بُني له؛ والمسؤولية تقع على من نشره بهذا المستوى وبهذا الإجراء."
      3: "ورود الخطأ لا يُلغي المسؤولية عن تصميم إجراء لا يكشفه."
    review: m13-l01

questions:
  - id: m13-q01
    type: mcq
    bloom: remember
    prompt: "ما الفرق بين «إنسان في الحلقة» و«إنسان على الحلقة»؟"
    options:
      - "الأول يراقب والثاني ينفّذ."
      - "الأول لا يُنفَّذ القرار بلا موافقته في كل حالة، والثاني النظام ينفّذ وهو يراقب ويتدخل ويراجع عيّنة."
      - "الأول للأنظمة الدقيقة والثاني للأنظمة الضعيفة."
      - "لا فرق جوهري بينهما."
    answer: 1
    explanation: "ولكل دور نمط فشله: الأول يتحول إلى موافقة آلية عند كثرة الحجم، والثاني لا يلاحظ الخطأ لأنه لا يفحص كل حالة. فلا دور أفضل مطلقًا، بل دور متناسب مع المخاطر وشروط تجعله يعمل."
    why_wrong:
      0: "مقلوب: الأول هو من تلزم موافقته، والثاني هو المراقب."
      2: "الدور يُختار بحسب الأثر وقابلية التراجع لا بحسب دقة النظام."
    review: m13-l01
  - id: m13-q02
    type: multi
    bloom: understand
    prompt: "أي هذه من مفارقات الأتمتة التي وصفها Bainbridge سنة 1983؟ (اختر كل ما ينطبق)"
    options:
      - "المصمّم يؤتمت ما يستطيع، فيبقى للإنسان ما لا يمكن أتمتته — أي الأصعب."
      - "مهمة المراقبة لحدث نادر مهمة يفشل فيها البشر بنيويًا."
      - "المهارات تتآكل بلا ممارسة، وهي المهارة نفسها اللازمة للمراجعة."
      - "الأنظمة الآلية أكثر عرضة للاختراق من الأنظمة اليدوية."
      - "الإنسان يُطلب منه التدخل في أسوأ لحظة: حالة غير معتادة، ووقت ضيق، وهو خارج السياق."
    answer: [0, 1, 2, 4]
    explanation: "الأربعة المختارة هي مفارقات الأتمتة، وقد كُتبت سنة 1983 في سياق التحكم الصناعي وتصف أدوات اليوم وصفًا دقيقًا. أما الاختراق فمسألة أمنية من المحور 12 ولا علاقة لها بهذه الورقة."
    review: m13-l02
  - id: m13-q03
    type: mcq
    bloom: analyze
    prompt: "نظام مساعد للتشخيص يعمل منذ ثلاث سنوات، والأطباء الجدد يكشفون حالاته الشاذة أكثر من القدامى. ما النمط؟"
    options:
      - "تحيّز الأتمتة."
      - "تآكل المهارة."
      - "إجهاد التنبيهات."
      - "سلطة بلا قدرة."
    answer: 1
    explanation: "تفوّق الجدد على القدامى في الحالات الشاذة تحديدًا هو العلامة المميِّزة لتآكل المهارة: فالجدد لم يعتمدوا على النظام سنوات. والعلاج تمارين دورية وإبقاء حصة عمل يدوي وحالات مزروعة."
    why_wrong:
      0: "تحيّز الأتمتة يظهر في قبول اقتراح رغم دليل مخالف، لا في فرق بين الجدد والقدامى."
      2: "لا ذكر لتنبيهات متكررة في الوصف."
      3: "لا ذكر لقيد إجرائي على المخالفة."
    review: m13-l02
  - id: m13-q04
    type: mcq
    bloom: evaluate
    prompt: "أداة تطلب تأكيدًا قبل كل حفظ وكل إرسال وكل تعديل، وموظفوها يوافقون على 99.8٪ في أقل من ثانية. ما العلاج؟"
    options:
      - "إضافة نافذة تأكيد ثانية للأفعال المهمة."
      - "تقليل نقاط التأكيد إلى الأفعال غير القابلة للتراجع وحدها، ومايَزة شكلها بحسب الخطورة، وعرض المعلومة الحاسمة في نصها."
      - "تدريب الموظفين على قراءة التأكيدات بعناية."
      - "زيادة زمن انتظار إجباري قبل تمكين زر الموافقة."
    answer: 1
    explanation: "هذا إجهاد التنبيهات: عدد التنبيهات يتناسب عكسًا مع الانتباه لكل تنبيه. فزيادة التأكيدات تخفض الرقابة لا ترفعها، والعلاج تقليلها وتركيزها لا مضاعفتها."
    why_wrong:
      0: "مزيد من النوافذ في بيئة مُجهَدة يُنتج مزيدًا من الضغطات الآلية."
      2: "التوصية ليست إجراءً، والمشكلة بنيوية في تصميم التدفق لا في جدية الموظفين."
      3: "الانتظار الإجباري يضيف إزعاجًا بلا أن يجعل المعلومة مقروءة، وقد يزيد الالتماس للتحايل."
    review: m13-l02
  - id: m13-q05
    type: mcq
    bloom: apply
    prompt: "ما الذي يحدد المستوى الأقصى المسموح لاستقلالية نظام؟"
    options:
      - "دقة النظام وقدرته التقنية."
      - "الأثر على من يتأثر وقابلية التراجع عن الفعل."
      - "كلفة المراجعة البشرية مقارنةً بالفائدة."
      - "حجم المؤسسة المشغّلة ونضجها التقني."
    answer: 1
    explanation: "الدقة متوسط يخفي الفئات، والدقة العالية تُنتج تحيّز أتمتة فتضعف الضابط الباقي، والشرعية ليست الدقة: حق الشخص في مراجعة قرار يمسّه لا يزول بتحسّن النظام. والقاعدة: ما كان غير قابل للتراجع ويمسّ أشخاصًا لا يتجاوز الاقتراح."
    why_wrong:
      0: "هذه أكثر الحجج إغراءً وأقلها صلة بتحديد المستوى."
      2: "الكلفة قيد على التنفيذ لا معيار للمستوى المسموح."
      3: "النضج التقني لا يغيّر أثر القرار على من يتأثر به."
    review: m13-l03
  - id: m13-q06
    type: scenario
    bloom: analyze
    scenario: "نظام يرتّب طلبات التوظيف، والموظف «يختار» من القائمة. وفي الواقع يُدعى للمقابلة الخمسة الأوائل دائمًا."
    prompt: "ما المستوى الفعلي للنظام؟"
    options:
      - "المستوى 2، فالاختيار بشري بالكامل."
      - "المستوى 3 أو 4 عمليًا، فقرار النظام هو القرار والموظف ينفّذه."
      - "المستوى 0، فالنظام يعرض بيانات فقط."
      - "المستوى 5، فلا يوجد إنسان في المسار."
    answer: 1
    explanation: "أثر الترتيب: الترتيب يوزّع الانتباه، ويُقرأ بوصفه حكمًا، ويجعل اختيار الأول بلا تبرير واختيار الأخير محتاجًا إليه. فصنّف نظامك بأثره لا بتسميته الإدارية."
    why_wrong:
      0: "هذا هو المستوى المعلن؛ والقاعدة الثابتة تكشف أن الاختيار ليس اختيارًا."
      2: "النظام يرتّب ويوصي، فهو يتجاوز عرض البيانات."
      3: "يوجد إنسان في المسار، لكنه ينفّذ لا يقرر."
    review: m13-l03
  - id: m13-q07
    type: mcq
    bloom: understand
    prompt: "مهلة اعتراض مدتها 30 ثانية على فعل يُنفَّذ آليًا. ما تقييمها؟"
    options:
      - "مستوى 4 سليم، فالسلطة محفوظة للإنسان."
      - "هي عمليًا المستوى 5 بمسؤولية منقولة إلى الإنسان، لأن المهلة لا تكفي للفهم ولا للتحقق."
      - "مستوى 3، فالموافقة صريحة."
      - "مقبولة إذا كان النظام دقيقًا."
    answer: 1
    explanation: "المستوى 4 يعتمد على شرطين: مهلة كافية للفهم والتحقق والقرار، وإشعار يُقرأ فعلًا. وحين يفشلان يصير عدم الاعتراض حالة افتراضية لا قرارًا — وهذه المراجعة الشكلية في أنقى صورها."
    why_wrong:
      0: "السلطة محفوظة شكلًا لا فعلًا؛ والمعيار أن يستطيع المراجع أن يشرح لماذا وافق."
      2: "لا موافقة صريحة هنا بل غياب اعتراض."
      3: "الدقة لا تحدد المستوى ولا تعوّض غياب شرطه."
    review: m13-l03
  - id: m13-q08
    type: mcq
    bloom: apply
    prompt: "لجنة من ثلاثة أعضاء تراجع 1500 طلب في ست ساعات إجمالًا. ما الإجراء الصحيح؟"
    options:
      - "تدريب الأعضاء على المراجعة السريعة."
      - "زيادة عدد أعضاء اللجنة إلى ستة."
      - "تقليص المعروض: تصفية أهلية بمعايير معلنة وقابلة للطعن، ثم مراجعة كاملة للحالات الحدّية وعيّنة عشوائية من البقية."
      - "الاكتفاء بمراجعة الحالات التي يشتبه فيها النظام."
    answer: 2
    explanation: "الزمن المتاح أقل من 45 ثانية لكل طلب، فالإجراء معطوب قبل أن يبدأ. ومراجعة 250 حالة بحماية حقيقية أكثر من مراجعة 1500 بحماية صفر، والعيّنة العشوائية هي الضابط الوحيد على أخطاء الإغفال."
    why_wrong:
      0: "تسريع الفحص لا يخلق وقتًا، ويحوّل الإجراء إلى شكلي بكفاءة أعلى."
      1: "يخفّف الحجم قليلًا ولا يحل استحالة الزمن."
      3: "الاكتفاء بما يشتبه فيه النظام يترك أخطاء الإغفال بلا أي ضابط."
    review: m13-l04
  - id: m13-q09
    type: mcq
    bloom: evaluate
    prompt: "مراجعون يُقيَّمون شهريًا على عدد الملفات المنجزة ويُنشر ترتيبهم في الإنجاز. ما الشرط المفقود؟"
    options:
      - "المعلومات."
      - "الوقت."
      - "السلطة."
      - "الحوافز."
    answer: 3
    explanation: "السرعة مكافأة والفحص كلفة، فالمراجع العاقل سيسرع. والعلاج إضافة معدل المخالفة وكشف الحالات المزروعة إلى معايير التقييم، وإعلان أن معدل مخالفة صفر عطب لا إنجاز. والتعميم لا يغيّر ما يُقاس ويُكافأ عليه."
    why_wrong:
      0: "لا ذكر لنقص في المعلومات المعروضة."
      1: "الوقت قد يكون كافيًا؛ المشكلة أن الحوافز تدفع إلى عدم استعماله."
      2: "لا ذكر لقيد إجرائي على المخالفة."
    review: m13-l04
  - id: m13-q10
    type: multi
    bloom: create
    prompt: "أي هذه من العادات الأربع التي يختم بها المقرر؟ (اختر كل ما ينطبق)"
    options:
      - "حدّد نوع سؤالك — تنبؤي أم سببي أم وصفي أم قِيَمي — قبل أن تختار أداتك."
      - "تحقّق من كل مخرج بمصدره، ولا تخلط الإقناع بالصحة."
      - "استعمل أحدث نموذج متاح دائمًا لضمان أفضل النتائج."
      - "وثّق قراراتك بجمل قابلة للتكذيب."
      - "اعرف حدودك وحدود أدواتك وصرّح بها."
    answer: [0, 1, 3, 4]
    explanation: "العادات الأربع تبقى بعد أن تتغير كل الأدوات. أما اختيار «أحدث نموذج» فهو بداية من الأداة لا من السؤال، وهو الانحراف المنهجي الذي يحذّر منه المقرر — والأحدث ليس الأنسب، وقد يكون أكثر عرضة للحفظ وأصعب في التفسير."
    review: m13-l05
