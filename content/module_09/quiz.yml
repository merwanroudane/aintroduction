entry:
  - id: m09-e01
    type: mcq
    bloom: understand
    prompt: "ما الفرق الأساسي بين طريقة بناء النص المولَّد وطريقة بناء الصورة المولَّدة؟"
    options:
      - "لا فرق، الآلية واحدة والوسيط مختلف."
      - "النص يُبنى رمزًا رمزًا بالتتابع، والصورة تُبنى كتلةً واحدة عبر خطوات تصفية متتابعة."
      - "الصورة تُبنى بكسلًا بكسلًا من الأعلى إلى الأسفل."
      - "النص يُبنى دفعة واحدة والصورة بالتتابع."
    answer: 1
    explanation: "هذا الفارق البنيوي هو أصل اختلاف المعماريات والمخاطر وطرق التحقق."
    review: m09-l01
  - id: m09-e02
    type: tf
    bloom: understand
    prompt: "نموذج توليد الصور يبحث في مكتبة صور داخلية ويركّب أجزاءها."
    answer: false
    explanation: "لا صور مخزّنة ولا بحث. التوليد يبدأ من ضجيج عشوائي ويزيله تدريجيًا في اتجاه يحدده متجه الوصف."
    review: m09-l01
  - id: m09-e03
    type: mcq
    bloom: apply
    prompt: "وصلتك صورة متداولة تدّعي توثيق حدث. ما أول ما تفعله؟"
    options:
      - "أفحص الأيدي والنصوص فيها بحثًا عن تشوهات."
      - "أمتنع عن المشاركة، وأبحث عن أقدم ظهور للصورة وعن تغطية مستقلة للحدث."
      - "أمررها على أداة كشف صور مولَّدة."
      - "أنشرها مع عبارة «للتحقق» حتى يردّ أحد."
    answer: 1
    explanation: "التحقق من صورة تحقق من تاريخها ومصدرها لا من بكسلاتها؛ والمشاركة «للتحقق» مشاركة في الانتشار."
    review: m09-l06
  - id: m09-e04
    type: tf
    bloom: remember
    prompt: "إذا خرجت صورة مولَّدة متقنة وواقعية، فهذا يعني أن ما تمثّله صحيح."
    answer: false
    explanation: "الإتقان البصري ليس دقة توثيقية؛ فقد تخرج صورة بديعة لمعلم حقيقي بتفاصيل مخترعة تمامًا."
    review: m09-l01
  - id: m09-e05
    type: mcq
    bloom: understand
    prompt: "إذا طلبت صورة «طبيب» دون أي تحديد آخر، فما المتوقع؟"
    options:
      - "مخرج محايد تمامًا لأن الأمر لم يذكر أي هوية."
      - "مخرج يحمل افتراضات، لأن النموذج يملأ ما لم تحدده بالأكثر احتمالًا وفق بيانات تدريبه."
      - "رفض التوليد لأن الأمر ناقص."
      - "توزيع مطابق للإحصاءات الرسمية."
    answer: 1
    explanation: "الفراغ الذي تتركه ليس محايدًا؛ والدراسات وجدت الأنماط حتى في الأوامر التي لا تذكر أي هوية."
    review: m09-l05

questions:
  - id: m09-q01
    type: mcq
    bloom: remember
    prompt: "ما المسار الأمامي في نموذج الانتشار؟"
    options:
      - "توليد الصورة من الوصف النصي."
      - "إضافة ضجيج تدريجي إلى صورة حقيقية حتى تصير عشوائية خالصة."
      - "ضغط الصورة إلى الفضاء الكامن."
      - "تدريب الشبكة على التنبؤ بالبكسل التالي."
    answer: 1
    why_wrong:
      0: "هذا هو المسار العكسي، وهو ما تتعلمه الشبكة."
      2: "الضغط الكامن خطوة مستقلة في نماذج الانتشار الكامنة، لا المسار الأمامي."
      3: "لا يوجد «بكسل تالٍ» في الانتشار؛ العمل يجري على الصورة كاملة في كل خطوة."
    explanation: "المسار الأمامي معروف تمامًا ولا يحتاج تعلّمًا، لأننا نحن من أضاف الضجيج ونحتفظ به."
    review: m09-l02
  - id: m09-q02
    type: mcq
    bloom: understand
    prompt: "لماذا تُدرَّب الشبكة على «التنبؤ بالضجيج» بدل «رسم صورة»؟"
    options:
      - "لأن الضجيج أسهل في التمثيل."
      - "لأن للتنبؤ بالضجيج إجابة مرجعية ودالة خسارة طبيعية وإشارة تصحيح مستقرة، وكلها غائبة في «ارسم صورة»."
      - "لأن الصور أكبر حجمًا من الضجيج."
      - "لأن الضجيج عشوائي فيسهل تعلّمه."
    answer: 1
    why_wrong:
      0: "سهولة التمثيل ليست المسألة؛ المسألة وجود إشارة تصحيح."
      2: "الضجيج بحجم الصورة نفسها تمامًا."
      3: "عشوائية الضجيج ليست سبب قابلية التعلّم، بل كوننا نعرف قيمته المرجعية."
    explanation: "الاستراتيجية الأعم: حوّل ما لا يُؤطَّر إلى مسألة مساعدة مؤطَّرة يقودك حلّها إلى هدفك."
    review: m09-l02
  - id: m09-q03
    type: mcq
    bloom: analyze
    prompt: "في أي محور بقيت الشبكات التنافسية متفوقة على نماذج الانتشار؟"
    options:
      - "جودة الصورة."
      - "سرعة التوليد: تمريرة واحدة مقابل عشرات الخطوات."
      - "تنوّع المخرجات."
      - "استقرار التدريب."
    answer: 1
    why_wrong:
      0: "دراسات مقارنة منشورة أظهرت تفوق الانتشار في جودة التركيب."
      2: "الشبكات التنافسية تميل إلى انهيار النمط، أي ضيق التنوّع."
      3: "تدريبها هشّ، وهو أشهر عيوبها."
    explanation: "المقايضة: سهولة المسألة واستقرار التدريب مقابل كلفة التوليد — والمقارنة تكون دائمًا بمحور محدد."
    review: m09-l02
  - id: m09-q04
    type: mcq
    bloom: understand
    prompt: "لماذا كان الانتقال إلى الفضاء الكامن مفصليًا لا تحسينًا هامشيًا؟"
    options:
      - "لأنه رفع جودة الصور فقط."
      - "لأنه خفّض كلفة الحساب بمراتب، فانتقل التوليد من عتاد المختبرات إلى عتاد عادي وصار متاحًا للجميع."
      - "لأنه ألغى الحاجة إلى بيانات تدريب."
      - "لأنه جعل التوليد يتم بخطوة واحدة."
    answer: 1
    why_wrong:
      0: "الأثر الأكبر كان في الإتاحة لا في الجودة وحدها."
      2: "البيانات تظل شرطًا أساسيًا في كل الأحوال."
      3: "عدد الخطوات لم يتغير بالانتقال إلى الفضاء الكامن."
    explanation: "الكفاءة الحسابية هنا ليست تفصيلًا تقنيًا: هي التي حددت من يستطيع استعمال التقنية، وبالتالي أثرها الاجتماعي."
    review: m09-l01
  - id: m09-q05
    type: tf
    bloom: apply
    prompt: "تثبيت البذرة عند ضبط أمر بصري خيار مفيد لكنه غير ضروري."
    answer: false
    explanation: "بلا بذرة ثابتة تغيّر متغيرين معًا (أمرك ونقطة البداية)، فلا تستطيع نسب أي فرق إلى سببه. وهو ضبط متغير دخيل لا اختصار وقت."
    review: m09-l03
  - id: m09-q06
    type: mcq
    bloom: apply
    prompt: "أي العناصر التالية لا يمكن الاستغناء عنه في أمر بصري؟"
    options:
      - "الإضاءة."
      - "الموضوع: ما الذي يُرى في الصورة."
      - "التفاصيل التقنية."
      - "الاستبعاد."
    answer: 1
    why_wrong:
      0: "مهم جدًا وأسرع ما يحسّن النتيجة، لكنه ليس شرط وجود."
      2: "أثره أقل مما يُظن، ويُترك للنهاية."
      3: "قوي حين تدعمه الأداة، لكنه إضافي."
    explanation: "«صورة تعبّر عن الأمل» أمر بلا موضوع: لا شيء فيه يمكن رسمه، فيملأ النموذج الفراغ بما شاء."
    review: m09-l03
  - id: m09-q07
    type: mcq
    bloom: analyze
    prompt: "لماذا يضعف النموذج البصري في العدّ وفي كتابة النصوص داخل الصورة؟"
    options:
      - "لأن هذه العناصر نادرة في بيانات التدريب."
      - "لأنها من صنف «الإجابة الواحدة الصحيحة»، والنموذج يجيد ما يحتمل تنويعًا واسعًا."
      - "لأن النماذج لا تعالج الرموز إطلاقًا."
      - "لأنها تحتاج نماذج لغوية منفصلة."
    answer: 1
    why_wrong:
      0: "النصوص والأعداد شائعة جدًا في الصور؛ المشكلة في طبيعتها لا في ندرتها."
      2: "النماذج تعالج الرموز، لكن بوصفها أشكالًا بصرية لا وحدات دلالية."
      3: "استعمال مرمّز نصي أقوى يحسّن النتيجة لكنه لا يلغي صعوبة المسألة."
    explanation: "بهذه القاعدة تتوقع مواضع الضعف بنفسك: الخرائط الدقيقة، والشعارات، ولوحات المفاتيح، والساعات."
    review: m09-l03
  - id: m09-q08
    type: mcq
    bloom: evaluate
    prompt: "لم تعجبك صورة مولَّدة. ما التصرف الأنجع؟"
    options:
      - "أضف كلمات مثل «عالي الجودة، احترافي، 8K، مذهل»."
      - "اسأل أي عنصر ناقص — والغالب أنه التركيب أو الإضاءة — وأضفه وحده."
      - "غيّر عدة عناصر دفعة واحدة لتوفير الوقت."
      - "أعد التوليد مرارًا حتى تصادف نتيجة جيدة."
    answer: 1
    why_wrong:
      0: "كلمات تقييمية لا وصفية، لا تحدد شيئًا يُرى، وتخفّف وزن العناصر المهمة في الأمر."
      2: "يمنعك من معرفة أي تغيير كان السبب، فلا تستطيع تكرار النجاح."
      3: "صيد عشوائي لا يتراكم ولا ينتج معرفة قابلة للنقل."
    explanation: "السؤال هو «أي عنصر ناقص؟» لا «كم كلمة أضيف؟»."
    review: m09-l03
  - id: m09-q09
    type: mcq
    bloom: apply
    prompt: "تفرّغ اثنتي عشرة مقابلة ميدانية. ما الخطوة التي تسبق التفريغ الآلي الكامل؟"
    options:
      - "شراء أفضل أداة متاحة."
      - "بناء مرجع ذهبي صغير: تفريغ خمس دقائق يدويًا وقياس نسبة الخطأ الفعلية على بياناتك أنت."
      - "قراءة أرقام الأداء المنشورة للأداة."
      - "تفريغ الجميع ثم مراجعة الكل يدويًا."
    answer: 1
    why_wrong:
      0: "لا تعرف ما «الأفضل» لبياناتك قبل أن تقيس عليها."
      2: "أرقام منشورة على لغة وبيانات أخرى لا تخصّك، خصوصًا مع اللهجات المحلية."
      3: "يعادل تفريغًا يدويًا كاملًا، وهو غير عملي — ولهذا وُجدت المراجعة الموجّهة."
    explanation: "أخطاء التفريغ منتظمة (الأسماء، والمصطلحات، والأرقام، واللهجة، والتداخل)، فتُوجَّه إليها المراجعة."
    review: m09-l04
  - id: m09-q10
    type: tf
    bloom: understand
    prompt: "أرقام أداء أنظمة التفريغ المنشورة تنطبق على كل اللغات بدرجة متقاربة."
    answer: false
    explanation: "الأداء يتفاوت تفاوتًا حادًا بحسب حجم بيانات التدريب لكل لغة وتنوّعها الداخلي؛ وأداء الفصحى يختلف عن العاميات."
    review: m09-l04
  - id: m09-q11
    type: mcq
    bloom: evaluate
    prompt: "وصلتك مكالمة بصوت قريب يطلب تحويلًا ماليًا عاجلًا. ما الضابط الأنجع؟"
    options:
      - "الإصغاء جيدًا للتأكد من طبيعية الصوت."
      - "معاودة الاتصال على الرقم المعروف، والالتزام بقاعدة: لا قرار مالي بمكالمة صوتية وحدها."
      - "طلب تكرار الجملة للمقارنة."
      - "تحويل مبلغ صغير للتجربة."
    answer: 1
    why_wrong:
      0: "استنساخ الصوت يتجاوز قدرة الأذن على التمييز؛ فالصوت لم يعد دليل هوية."
      2: "التكرار لا يضيف شيئًا لأن النظام يولّد أي جملة بالصوت نفسه."
      3: "تحويل أي مبلغ استجابة لطلب لم يُتحقق منه هو وقوع في الاحتيال."
    explanation: "الاستعجال نفسه علامة إنذار، لأنه أداة الضغط الأساسية في هذا النوع من الاحتيال."
    review: m09-l04
  - id: m09-q12
    type: mcq
    bloom: understand
    prompt: "ما الذي يجعل توليد الفيديو أصعب من توليد الصورة؟"
    options:
      - "حجم الملفات فقط."
      - "الاتساق الزمني: بقاء الأجسام والإضاءة نفسها عبر الإطارات المتتابعة، مع حركة معقولة فيزيائيًا."
      - "أن الفيديو ملوّن والصورة رمادية."
      - "أن الفيديو يحتاج صوتًا."
    answer: 1
    why_wrong:
      0: "الحجم عرض من أعراض المشكلة لا جوهرها."
      2: "لا علاقة للألوان بالمسألة."
      3: "الصوت مسار منفصل، والصعوبة قائمة في الفيديو الصامت أيضًا."
    explanation: "الفيديو ليس صورًا متتابعة مستقلة: كل إطار يجب أن يتسق مع جيرانه وإلا «ارتجف» المشهد."
    review: m09-l04
  - id: m09-q13
    type: mcq
    bloom: analyze
    prompt: "ما النتيجة الأخطر في دراسات التحيّز البصري المنشورة؟"
    options:
      - "أن جودة الصور تتفاوت بين الأنظمة."
      - "أن الأنماط تظهر حتى في الأوامر التي لا تذكر أي لغة هوية أو ديموغرافيا."
      - "أن الأنظمة تختلف في سرعتها."
      - "أن المستعملين يفضلون أنظمة معينة."
    answer: 1
    why_wrong:
      0: "مسألة أداء لا تمسّ جوهر التحيّز."
      2: "لا علاقة للسرعة بالتمثيل."
      3: "تفضيلات المستعملين ليست نتيجة قياس للتحيّز."
    explanation: "أغلب الاستعمال اليومي لا يذكر الهوية، فيعمل التحيّز حيث لا ينظر أحد وينتقل إلى المواد بلا قرار واعٍ."
    review: m09-l05
  - id: m09-q14
    type: mcq
    bloom: evaluate
    prompt: "«النموذج يعكس الواقع فقط، والمشكلة في الواقع لا في الأداة». ما تقييم هذه الحجة؟"
    options:
      - "صحيحة، فالنموذج مرآة محايدة."
      - "خاطئة وقائعيًا: الدراسات وجدت تضخيمًا لا انعكاسًا، إذ تُمثَّل الفئات المهمّشة تمثيلًا أقل من نسبتها الفعلية."
      - "صحيحة جزئيًا ولا يمكن الحكم عليها."
      - "خاطئة لأن النموذج لا علاقة له بالواقع إطلاقًا."
    answer: 1
    why_wrong:
      0: "لو كان مرآة لطابق التوزيع الفعلي، وهو ما لم تجده الدراسات."
      2: "المسألة مقيسة، ويمكن الحكم عليها بالرجوع إلى القياس."
      3: "للنموذج علاقة وثيقة بالواقع عبر بيانات التدريب؛ الإشكال في نوع هذه العلاقة."
    explanation: "وهي خاطئة منطقيًا كذلك: السلبية ليست حيادًا، والاستعمال في كتاب أو حملة فعل معياري لا وصف."
    review: m09-l05
  - id: m09-q15
    type: mcq
    bloom: apply
    prompt: "كيف تراجع مجموعة صور مولَّدة لمادة تعليمية؟"
    options:
      - "أفحص كل صورة على حدة وأقبلها إن لم يكن فيها عيب."
      - "أراجع التوزيع عبر المجموعة كلها، لأن التحيّز لا يظهر في المخرج الواحد."
      - "أعتمد على حواجز الأمان في الأداة."
      - "أطلب في كل أمر صورًا مضادة للنمط."
    answer: 1
    why_wrong:
      0: "هذا بالضبط ما يفوّت المشكلة: كل صورة قد تبدو سليمة والمجموعة منحازة."
      2: "الدراسات وجدت أن حواجز الأمان المؤسسية لم تمنع استمرار الأنماط."
      3: "طلب المستعمل المضاد لم يمنع الأنماط كذلك، وهو يعالج آخر السلسلة فقط."
    explanation: "التحيّز خاصية توزيع لا خاصية عنصر — وهو المبدأ الإحصائي نفسه في تقييم أي مصنّف."
    review: m09-l05
  - id: m09-q16
    type: mcq
    bloom: understand
    prompt: "ما الفرق الجوهري بين كشف التزييف وإثبات المنشأ؟"
    options:
      - "الأول أسرع والثاني أدق."
      - "الكشف يستنتج بأثر رجعي من المحتوى، والإثبات يسجّل تاريخ الملف لحظة إنشائه بسجل موقّع."
      - "الكشف يعمل على الصور والإثبات على الفيديو."
      - "لا فرق جوهري بينهما."
    answer: 1
    why_wrong:
      0: "المسألة في اتجاه العمل الزمني لا في السرعة والدقة."
      2: "كلاهما ينطبق على كل الوسائط."
      3: "الفرق بنيوي ويحدد صلاحية كل منهج."
    explanation: "لا يمكن استنتاج ما لم يُسجَّل؛ ولهذا كان الكشف في سباق خاسر مع مولّدات تتحسن باستمرار."
    review: m09-l06
  - id: m09-q17
    type: tf
    bloom: analyze
    prompt: "صورة لا تحمل بيانات منشأ، إذن هي على الأرجح مولَّدة."
    answer: false
    explanation: "خلط بين غياب الدليل ودليل الغياب. أغلب المحتوى الحقيقي لا يحمل هذه البيانات، وهي تُنزع بلقطة شاشة واحدة."
    review: m09-l06
  - id: m09-q18
    type: mcq
    bloom: understand
