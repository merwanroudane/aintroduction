module_number: 9
title: "النماذج التوليدية للصور والصوت (DALL·E، Midjourney، Suno...)"
short_title: توليد الصور والصوت
title_en: "Generative models for images and audio"
subtitle: من نماذج الانتشار إلى الأمر البصري، ثم الصوت والفيديو، فالتحيّز والأصالة وإثبات المصدر.
description: |
  خرجنا من عالم **الكلمات** إلى عالم **البكسل والموجة**. فالذكاء الاصطناعي التوليدي لا يقف عند النص: إنه
  يولّد الصور والأصوات والموسيقى والفيديو، ويحوّل بين هذه الوسائط.

  نبدأ بالسؤال المفصلي: **ما الذي يختلف حقًا حين ننتقل من النص إلى الصورة؟** فالنص متسلسل ومنفصل ويُقرأ
  رمزًا رمزًا؛ والصورة **كتلة واحدة متصلة** تُبنى دفعة واحدة. وهذا الاختلاف البنيوي يفسّر لماذا اختلفت
  المعماريات، ولماذا اختلفت طرق التحقق، ولماذا اختلفت المخاطر.

  ثم ندرس **نماذج الانتشار** بفكرتها البديعة والبسيطة: درّب شبكة على **إزالة الضجيج**، ثم ابدأ من ضجيج
  خالص وأزله تدريجيًا حتى تظهر صورة. ونقارنها بـ**الشبكات التنافسية (GAN)** التي سبقتها، ونفهم دور
  **الفضاء الكامن** ودور **التمثيل المشترك بين النص والصورة (CLIP)** في جعل الأمر النصي يوجّه الصورة.

  ثم ننتقل إلى العملي: **هندسة الأمر البصري** — وهي مهارة مختلفة عن هندسة الأمر النصي — ثم **الصوت**:
  تحويل النص إلى كلام، واستنساخ الصوت، وتحويل الكلام إلى نص، وتوليد الموسيقى، ثم **الفيديو**.

  ونختم بمحورين لا يقلان أهمية عن التقنية: **التحيّز والتمثيل** في الصور المولَّدة (وهو موثق بحثيًا بدقة)،
  ثم **الأصالة وإثبات المصدر**: التزييف العميق، ومعايير إثبات المنشأ (C2PA)، والعلامات المائية، وموجبات
  الشفافية في قانون الاتحاد الأوروبي للذكاء الاصطناعي، والاستعمال الأكاديمي المسؤول.
estimated_duration: "6 حصص × 90 دقيقة"
difficulty: متوسط
keywords: [نماذج الانتشار, Diffusion, الشبكات التنافسية, GAN, الفضاء الكامن, CLIP, التوجيه بالنص, الأمر البصري, تحويل النص إلى كلام, استنساخ الصوت, توليد الموسيقى, الفيديو, التزييف العميق, إثبات المنشأ, C2PA, العلامة المائية, التحيّز]
concept_diagram: m09_concept_map
objectives:
  - {bloom: remember, text: "يعرّف نموذج الانتشار والفضاء الكامن والتوجيه بالنص والعلامة المائية وإثبات المنشأ."}
  - {bloom: understand, text: "يشرح فكرة الانتشار بوصفها تدريبًا على إزالة الضجيج ثم توليدًا بعكس العملية."}
  - {bloom: understand, text: "يفسّر الفروق البنيوية بين توليد النص وتوليد الصورة وأثرها في المخاطر وطرق التحقق."}
  - {bloom: apply, text: "يصوغ أمرًا بصريًا مكتمل العناصر ويضبطه تكراريًا بتغيير عنصر واحد في كل مرة."}
  - {bloom: analyze, text: "يحلل مخرجًا بصريًا أو صوتيًا ويحدد مصادر التحيّز أو التشويه فيه."}
  - {bloom: evaluate, text: "يقيّم ادعاء أصالة صورة أو تسجيل بالرجوع إلى بيانات المنشأ وحدود أدوات الكشف."}
  - {bloom: create, text: "يبني بروتوكول استعمال وإفصاح للوسائط المولَّدة في عمل أكاديمي أو مهني."}
prerequisites:
  - المحور 4 (التعلم العميق والشبكات العصبية).
  - المحاضرة 7.1 (التضمينات والفضاءات المتجهية).
  - المحور 8 (التحقق والنزاهة والإفصاح).
entry:
  prior_knowledge:
    - "يعرف الطالب من المحاضرة 4.2 أن الشبكة تتعلم بتقليل دالة خسارة؛ نبني على ذلك فكرة التدريب على إزالة الضجيج."
    - "يعرف من المحاضرة 7.1 أن التضمين متجه يمثل المعنى؛ نوسّعه هنا إلى فضاء مشترك بين النص والصورة."
    - "يعرف من المحاضرة 2.4 أن الشبكات الالتفافية تعالج الصور؛ نستعمل ذلك في فهم بنية نماذج الانتشار."
    - "يعرف من المحور 8 أن التحقق مسؤولية المستعمل؛ ننقل ذلك من النص إلى الصورة والصوت."
  diagnostic_questions:
    - هل رأيت صورة ظننتها حقيقية ثم تبيّن أنها مولَّدة؟ ما الذي كشفها؟ وهل كنت ستكتشفها لولا أن أُخبرت؟
    - في رأيك، لماذا كانت أيدي الأشخاص في الصور المولَّدة مشكلة معروفة لفترة؟ وماذا يقول ذلك عن آلية التوليد؟
    - إذا طلبتَ صورة «طبيب» دون تحديد، فمن تتوقع أن تظهر؟ ولماذا؟
    - كيف تتحقق من أن صورة متداولة في وسائل التواصل حقيقية؟ اكتب خطواتك.
exit:
  competencies:
    - أستطيع أن أشرح فكرة نماذج الانتشار وأميّزها عن الشبكات التنافسية.
    - أستطيع أن أفسّر لماذا يختلف توليد الصورة عن توليد النص بنيويًا.
    - أستطيع أن أصوغ أمرًا بصريًا مكتمل العناصر وأضبطه بمنهج التغيير المفرد.
    - أستطيع أن أحدد مصادر التحيّز في مخرج بصري وأربطها ببيانات التدريب.
    - أستطيع أن أفحص ادعاء أصالة صورة وأعرف حدود ما تستطيع أدوات الكشف إثباته.
    - أستطيع أن أصوغ بيان إفصاح عن استعمال وسائط مولَّدة.
  assessment_activities:
    - "اختبار بعدي يجمع المفاهيم التقنية وتحليل التحيّز ومسائل الأصالة."
    - "تمرين ضبط أمر بصري: ثلاث دورات تحسين مع توثيق ما تغيّر في كل دورة ولماذا."
    - "تحليل مجموعة صور مولَّدة لمهنة واحدة، وتوثيق التمثيل الديموغرافي فيها ومناقشة مصدره."
    - "دراسة حالة: صورة متداولة يُدّعى أنها حقيقية — بناء مسار تحقق كامل."
    - "مشروع مصغّر: مادة بصرية أو صوتية لغرض تعليمي مع بيان إفصاح وسجل استعمال."
  common_mistakes:
    - الاعتقاد بأن نموذج الصورة «يبحث» عن صور مشابهة ويركّبها.
    - الخلط بين الشبكات التنافسية ونماذج الانتشار.
    - الظن بأن جودة الصورة دليل على صحة ما تصوّره.
    - معاملة الأمر البصري كالأمر النصي وتغيير عدة عناصر دفعة واحدة.
    - افتراض أن أدوات كشف الصور المولَّدة حاسمة.
    - الاعتقاد بأن غياب علامة مائية دليل على أن المحتوى حقيقي.
  remediation:
    - إذا التبست فكرة الانتشار، أعد مختبر إزالة الضجيج وشغّله خطوة خطوة (المحاضرة 9.2).
    - إذا لم تتحسن مخرجاتك البصرية، طبّق منهج التغيير المفرد على عنصر واحد خمس مرات (المحاضرة 9.3).
    - إذا صعب عليك رصد التحيّز، أعد تنفيذ تمرين المهن وسجّل النتائج في جدول (المحاضرة 9.5).
    - راجع المحاضرة 8.5 (التحقق) قبل المحاضرة 9.6، فالمنهج واحد والوسيط مختلف.
  suggested_reading: [m09_ho_2020_ddpm, m09_rombach_2022_ldm, m09_bianchi_2023, m09_c2pa_spec, m09_eu_ai_act_50]
  bridge: |
    أتممنا الآن الجولة على **ما تستطيع هذه الأدوات إنتاجه**: نصًا وصورة وصوتًا وفيديو. والسؤال التالي هو
    سؤال هذا المقرر في صميمه بالنسبة إلى طالب الاقتصاد: **ما أثر ذلك على الاقتصاد؟** و**المحور 10** ينتقل
    إلى تطبيقات الذكاء الاصطناعي في الاقتصاد: في البحث الاقتصادي، وفي التنبؤ، وفي تحليل البيانات، وفي سوق
    العمل، وفي الإنتاجية — مع الانضباط المنهجي نفسه: ما الذي **قِيس فعلًا**؟ وما الذي ما زال **توقعًا**؟
instructor:
  sequence:
    - "9.1 و9.2 يشكلان وحدة مفاهيمية واحدة: لا تفصل بينهما بأكثر من حصة."
    - "9.3 (الأمر البصري) عملية بحتة: تحتاج إلى أداة متاحة للطلبة، أو إلى أمثلة محضّرة مسبقًا."
    - "9.4 (الصوت والفيديو) يمكن اختصارها إلى نصف حصة إن ضاق الوقت."
    - "9.5 و9.6 لا تُختصران: هما ما يميز مقررًا أكاديميًا عن شرح أدوات."
  timing:
    - "الحصة 1 (90 د): الأسئلة التشخيصية (10 د) + المحاضرة 9.1 (60 د) + نقاش (20 د)."
    - "الحصة 2 (90 د): المحاضرة 9.2 مع مختبر إزالة الضجيج."
    - "الحصة 3 (90 د): المحاضرة 9.3 مع تمرين الضبط التكراري."
    - "الحصة 4 (90 د): المحاضرة 9.4 (الصوت والموسيقى والفيديو)."
    - "الحصة 5 (90 د): المحاضرة 9.5 مع تمرين المهن الجماعي."
    - "الحصة 6 (90 د): المحاضرة 9.6 + الاختبار البعدي (25 د)."
    - "في حصة قصيرة (60 د): ادمج 9.1 و9.2، واختصر 9.4، ولا تمسّ 9.5 ولا 9.6."
  discussion:
    - "إذا ولّد نموذج صورة بأسلوب فنان حي معروف، فما المسائل التي يطرحها ذلك؟ ومن المتضرر؟"
    - "هل يكفي وسم المحتوى المولَّد؟ وماذا عن المحتوى الحقيقي الذي يُدّعى أنه مولَّد؟"
    - "ما أثر انتشار الصور المولَّدة على قيمة الصورة بوصفها دليلًا؟"
    - "هل يختلف حكم استعمال صورة مولَّدة في عرض تقديمي عن استعمالها في ورقة علمية؟ ولماذا؟"
  assessment_ideas:
    - "أعطِ الطلبة أمرًا بصريًا ضعيفًا واطلب تحسينه في ثلاث دورات مع تبرير كل تغيير."
    - "اعرض أربع صور (مولَّدة وحقيقية) واطلب بناء مسار تحقق لا حكمًا بالنظر."
    - "سؤال مقالي: «جودة الصورة ليست دليلًا على صحة ما تمثّله». اشرح مع مثال."
    - "اطلب تحليل نتائج تمرين المهن وربطها ببيانات التدريب لا بـ«رأي النموذج»."
  extensions:
    - "قراءة ورقة نماذج الانتشار الكامنة (Rombach 2022) ومناقشة لماذا كان الانتقال إلى الفضاء الكامن مفصليًا."
    - "قراءة Stable Bias ومقارنة منهجها بمنهج Bianchi وآخرون."
    - "استعراض مواصفة C2PA ومناقشة ما تستطيع بيانات المنشأ إثباته وما لا تستطيع."
    - "قراءة المادة 50 من قانون الاتحاد الأوروبي للذكاء الاصطناعي ومناقشة استثناءاتها."
related_modules: [4, 7, 8, 11, 12]
