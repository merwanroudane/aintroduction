title: مقدمة في الذكاء الاصطناعي
title_en: Introduction to Artificial Intelligence
subtitle: من المفاهيم الأساسية إلى الذكاء الاصطناعي التوليدي والتفاعل المسؤول مع النماذج الحديثة
tagline: منصة تعليمية تفاعلية للأساتذة والطلبة والباحثين
author_ar: الدكتور مروان رودان
author_en: Dr. Marwan Roudane
app_url: https://aicourses.streamlit.app/
repo_url: https://github.com/merwanroudane/aintroduction
last_update: "2026-09-26"

description: >-
  مقرر جامعي تأسيسي يقدّم الذكاء الاصطناعي (Artificial Intelligence) بوصفه حقلًا علميًا
  له تاريخ ومناهج وحدود، ثم ينتقل إلى الذكاء الاصطناعي التوليدي والنماذج اللغوية الكبيرة
  (Large Language Models — LLMs) من زاوية الاستخدام المنهجي: كيف تُبنى الأوامر، وكيف يُتحقق
  من المخرجات، وكيف تُوظَّف هذه الأدوات في الاقتصاد والبحث، وما الضوابط الأخلاقية والقانونية
  والأمنية التي تحكم استخدامها، ولماذا تبقى الرقابة البشرية شرطًا لا غنى عنه. صُمّمت المنصة
  لتكون أداة تدريس في القاعة بيد الأستاذ، ومرجعًا للتعلم الذاتي المنظم للطالب والباحث.

syllabus:
  needs_analysis: >-
    تبدأ عملية تصميم البرامج التعليمية بتحليل الاحتياجات للتعرف على المهارات والكفاءات التي
    يحتاجها الطالب لتحقيق الأهداف التعليمية. يمكن أن يشمل هذا التحليل دراسة للسوق واحتياجات
    سوق العمل، واستطلاعات للمجتمع والمؤسسات التعليمية، وتقييمات لمستوى المهارات الحالي للطلاب.

  # The official card leaves "الكفاءات المستهدفة" empty. The list below is a proposal
  # derived from the five official objectives; it is labelled as such in the UI.
  competencies_note: >-
    خانة «الكفاءات المستهدفة» فارغة في البطاقة الرسمية للمقرر. الكفاءات التالية مقترحة من
    معدّ المنصة، ومشتقة مباشرة من الأهداف العامة الخمسة، ويمكن للفريق البيداغوجي تعديلها.
  competencies:
    - يشرح المفاهيم الأساسية للذكاء الاصطناعي ومراحل تطوره التاريخي بلغة علمية دقيقة، ويربط كل مرحلة بالمشكلة التي حاولت حلها وبحدودها.
    - يميّز بين أنواع الذكاء الاصطناعي (الضيق، العام، الفائق) وبين فروعه ومناهجه (التعلم الآلي، التعلم العميق، الذكاء الاصطناعي التوليدي)، ويصنّف أنظمة واقعية وفقها.
    - يصوغ أوامر منهجية للنماذج اللغوية الكبيرة ويحسّنها تكراريًا، ويتحقق من مخرجاتها بمقارنتها بمصادر أولية.
    - يوظّف أدوات التوليد النصي والمرئي والصوتي في مهمة أكاديمية أو مهنية محددة، مع توثيق طريقة الاستخدام وحدوده.
    - ينجز مشروعًا عمليًا بسيطًا يستخدم الذكاء الاصطناعي لحل مشكلة محددة، ويعرضه ويقيّم نتائجه.
    - يحلل تطبيقًا للذكاء الاصطناعي من زوايا الإنصاف والشفافية والتحيز والخصوصية والأمان، ويقترح ضوابط رقابة بشرية مناسبة.

  general_objectives_intro: "يهدف هذا المقياس:"
  general_objectives:
    - تعريف الطالب بالمفاهيم الأساسية للذكاء الاصطناعي وتطوره التاريخي.
    - تمكين الطالب من التمييز بين أنواع الذكاء الاصطناعي وفروعه.
    - تدريب الطالب على التعامل مع النماذج اللغوية الكبيرة مثل ChatGPT و Gemini.
    - تعزيز الفهم التطبيقي من خلال مشروع عملي بسيط.
    - ترسيخ مبادئ الأخلاق والخصوصية في تطبيقات الذكاء الاصطناعي.

  keywords:
    - المفاهيم الأساسية للذكاء الاصطناعي
    - التطور التاريخي للذكاء الاصطناعي
    - أنواع الذكاء الاصطناعي
    - فروع الذكاء الاصطناعي
    - النماذج اللغوية الكبيرة
    - مشروع عملي
    - مبادئ الأخلاق
    - الخصوصية
    - تطبيقات الذكاء الاصطناعي
    - ChatGPT
    - Gemini

  axes:
    - "مقدمة في الذكاء الاصطناعي: المفهوم، الأهمية، والمجالات"
    - "تاريخ الذكاء الاصطناعي: مراحل التطور"
    - "أنواع الذكاء الاصطناعي: الضيق، العام، والفائق"
    - "مقارنة بين الذكاء الاصطناعي، التعلم الآلي، والتعلم العميق"
    - "المفاهيم الأساسية في هندسة الأوامر (Prompt Engineering)"
    - "تقنيات بناء الأوامر للنماذج اللغوية الكبيرة"
    - "تطبيقات النماذج اللغوية (ChatGPT، Google Gemini، Claude...)"
    - "التفاعل مع نماذج الذكاء الاصطناعي لتوليد النصوص"
    - "النماذج التوليدية للصور والصوت (DALL·E، Midjourney، Suno...)"
    - "استخدام الذكاء الاصطناعي في الاقتصاد"
    - "أخلاقيات الذكاء الاصطناعي: الإنصاف، الشفافية، والتحيز"
    - "قضايا الخصوصية والأمان في أدوات الذكاء الاصطناعي"
    - "دور الإنسان في الرقابة على الذكاء الاصطناعي"

  structure:
    title: الهيكل التنظيمي (Structure organisationnel) للمادة التعليمية
    rows:
      - item: البطاقة المفاهيمية الذهنية
        detail: استعراض الخارطة الذهنية المعرفية الخاصة بمحاور المادة التعليمية
      - item: استعراض موارد مختلفة
        detail: صور، جداول، معادلات، مخططات وأشكال، روابط لفيديوهات توضيحية

  entry_system:
    title: نظام الدخول (Le système d'entrée) للمادة التعليمية
    rows:
      - item: وضوح أهداف الدروس وفق الصياغة العلمية لأفعال تصنيف بلوم
        detail: ""
      - item: استعراض أنشطة للمدخلات القبلية
        detail: التغذية الرجعية (feed back) عبارة عن QUIZ
      - item: ارتباط المكتسبات القبلية بمحتوى المادة التعليمية
        detail: الأنشطة التفاعلية للمكتسبات القبلية وعلاقته بالمادة الحالية (إجراء اختبارات القبول les tests d'entrées)

  learning_system:
    title: نظام التعلم (Système d'apprentissage)
    rows:
      - item: استعراض محتوى لاكتساب المعرفة وللتعلم الذاتي وتطبيقها
        detail: المعرفة، التعلم الذاتي، الإدراك (savoir, auto-apprentissage, savoir-faire)
      - item: بناء محتوى الدروس على أساس المكتسبات القبلية
        detail: ""
      - item: استعراض تمرين في كل درس
        detail: الاختبارات التقييمية (les post-tests) عبارة عن QUIZ

  exit_system:
    title: نظام الخروج (Système de sortie)
    rows:
      - item: تقييم الكفاءات المستهدفة حسب الأهداف المسطرة
        detail: أنشطة تقييمية مختلفة الطرح
      - item: أنشطة تدعيمية للطالب في حالة فشله
        detail: توجيه الطالب إلى عدة موارد وإجراءات تعليمية لتعويض هذا النقص

# Bloom-level expansion of the five official objectives (the official ones stay above, unchanged).
bloom_objectives:
  remember: [يسترجع تعريفات الذكاء الاصطناعي والتعلم الآلي والتعلم العميق والمصطلحات الأساسية بالعربية والإنجليزية., يعدّد المحطات الكبرى في تاريخ الذكاء الاصطناعي بترتيبها الزمني.]
  understand: [يشرح العلاقة التضمينية بين الذكاء الاصطناعي والتعلم الآلي والتعلم العميق., يفسّر آلية التنبؤ بالرمز التالي (next-token prediction) ولماذا تنشأ الهلوسة (Hallucination).]
  apply: [يصوغ أوامر منظمة (instruction، context، constraints، output format) لمهام نصية فعلية., يستخدم أداة توليدية نصية أو مرئية أو صوتية في مهمة محددة مع توثيق خطوات الاستخدام.]
  analyze: [يصنّف تطبيقًا حقيقيًا للذكاء الاصطناعي حسب نوعه ونمط تعلمه ومصدر بياناته., يفكك مخرج نموذج لغوي إلى ادعاءات قابلة للتحقق ويحدد ما يحتاج منها إلى مصدر.]
  evaluate: [يقيّم ملاءمة أداة ذكاء اصطناعي لمهمة معينة وفق معايير الدقة والخصوصية والتكلفة والقابلية للتحقق., يحكم على مدى إنصاف نظام قرار آلي وشفافيته ويقترح مستوى الرقابة البشرية الملائم.]
  create: [يصمم مشروعًا عمليًا بسيطًا يوظف الذكاء الاصطناعي بمسؤولية، ويعرض نتائجه وحدوده., يبني قالب أوامر (prompt template) وقائمة تحقق قابلين لإعادة الاستخدام في مجال تخصصه.]

learning_outcomes:
  - يعرف الطالب ما الذي يستطيع الذكاء الاصطناعي المعاصر فعله وما لا يستطيعه، ويعبّر عن ذلك بمفاهيم دقيقة لا بشعارات.
  - يقرأ خبرًا أو ادعاءً عن الذكاء الاصطناعي قراءة نقدية، فيميز بين الإمكانات المثبتة والتوقعات والتسويق.
  - يستخدم النماذج اللغوية الكبيرة أداةً مساعدة في الكتابة والتلخيص والتحليل، ويتحقق من مخرجاتها قبل اعتمادها.
  - يدرك الفرق بين التنبؤ والتفسير السببي في التطبيقات الاقتصادية.
  - يطبق قواعد حماية البيانات الشخصية والسرية عند التعامل مع أدوات الذكاء الاصطناعي.
  - يتحمل مسؤولية القرار النهائي ويعرف متى يجب ألا يُترك القرار للنظام وحده.

journey:
  - [نظام الدخول, Entry, الاختبار القبلي العام ثم اختبار دخول قصير في بداية كل محور لربط المكتسبات القبلية بالمحتوى الجديد.]
  - [الأسس, Foundations, "المحاور 1–4: المفهوم، التاريخ، الأنواع، والعلاقة بين AI وML وDL."]
  - [النماذج اللغوية والأوامر, LLMs & prompting, "المحاور 5–8: هندسة الأوامر، التقنيات المتقدمة، الأدوات، وتوليد النصوص والتحقق منها."]
  - [التوليد متعدد الوسائط والتطبيقات, Generative media & applications, "المحوران 9–10: الصور والصوت والفيديو، ثم الذكاء الاصطناعي في الاقتصاد."]
  - [المسؤولية, Responsibility, "المحاور 11–13: الأخلاقيات، الخصوصية والأمان، والرقابة البشرية."]
  - [نظام الخروج, Exit, الاختبار البعدي العام والمشروع العملي الختامي وتقييم الكفاءات.]
