module_number: 12
title: قضايا الخصوصية والأمان في أدوات الذكاء الاصطناعي
short_title: الخصوصية والأمان
title_en: "Privacy and security in AI tools"
subtitle: ما يحدث فعلًا لما تكتبه، ولماذا لا يكفي حذف الاسم، وكيف تُخترق هذه الأدوات، وما الضوابط التي تعمل.
description: |
  هذا المحور هو **الأكثر قابلية للتطبيق الفوري** في المقرر. فكل ما فيه يغيّر سلوكك **غدًا**: ما تكتبه في
  نافذة محادثة، وما ترفعه من ملفات، وما تمنحه من صلاحيات، وما توثّقه قبل أن تبدأ.

  ونبدأ بالمفهوم الذي يُخطئ فيه الجميع: **البيانات الشخصية ليست الاسم**. فالتعريف القانوني والتقني معًا
  يقوم على **قابلية التعرّف** لا على وجود معرّف صريح. وسنرى دليلًا منشورًا على أن **خمس عشرة صفة ديموغرافية
  تكفي للتعرّف على 99.98٪ من سكان بلد كامل** — أي أن «حذف الاسم» ليس إخفاء هوية بأي معنى جدي.

  ثم **ماذا يحدث لما تكتبه**: دورة حياة البيانات في هذه الأدوات، والفرق بين الاستعمال الفردي والمؤسسي،
  و**الأسئلة الستة** التي تُوجَّه إلى أي سياسة بيانات قبل استعمال أي أداة. ولن نقول لك ما تفعله أداة بعينها
  — فالسياسات تتغير — بل **كيف تقرأ سياستها أنت**.

  ثم **الأمان**، وهو باب مختلف عن الخصوصية: **حقن الأوامر** المباشر وغير المباشر، ولماذا لا يوجد له حل
  كامل، و**مبدأ الصلاحية الأدنى** الذي وعدنا به في المحاور السابقة، وكيف يتحول الخطر من «إجابة خاطئة»
  إلى **فعل ضار** حين تُمنح الأداة صلاحيات.

  ثم **استخراج المعلومة**: كيف يُستنتج ما لم يُصرّح به، وكيف **تحفظ** النماذج نصوصًا من تدريبها وتُستخرج
  منها، ولماذا يجعل هذا مسألة البيانات الشخصية في التدريب مسألة مفتوحة.

  ثم **الضوابط التي تعمل فعلًا** — التقليل، والإخفاء، والفصل، والحذف، والتوثيق — و**ما لا يعمل** منها.

  ونختم بالإطار القانوني: المبادئ التي تحكم معالجة البيانات الشخصية، وحقوق أصحابها، وما يعنيه ذلك في
  مذكرة بحثية أو في مؤسسة لا يوجد فيها تشريع شامل بعد.
estimated_duration: "6 حصص × 90 دقيقة"
difficulty: متوسط
keywords: [البيانات الشخصية, قابلية التعرّف, إعادة التعرّف, إخفاء الهوية, الأسماء المستعارة, تقليل البيانات, حقن الأوامر, الصلاحية الأدنى, الحفظ والاستخراج, استنتاج العضوية, الخصوصية التفاضلية, حقوق أصحاب البيانات]
concept_diagram: m12_concept_map
objectives:
  - {bloom: remember, text: "يعرّف البيانات الشخصية وقابلية التعرّف وإخفاء الهوية والأسماء المستعارة وحقن الأوامر والصلاحية الأدنى."}
  - {bloom: understand, text: "يشرح لماذا لا يكفي حذف المعرّفات الصريحة لإخفاء الهوية."}
  - {bloom: understand, text: "يفسّر كيف يعمل حقن الأوامر غير المباشر ولماذا لا يوجد له حل كامل."}
  - {bloom: apply, text: "يطبق الأسئلة الستة على سياسة بيانات أداة قبل استعمالها في عمل يمسّ أشخاصًا."}
  - {bloom: analyze, text: "يحلل مسار عمل يستعمل أداة خارجية ويحدد فيه مواضع تسرّب البيانات ومواضع الخطر الأمني."}
  - {bloom: evaluate, text: "يقيّم ادعاء «البيانات مجهولة الهوية» بالرجوع إلى معيار قابلية التعرّف."}
  - {bloom: create, text: "يصمم إجراء معالجة بيانات لمشروع بحثي يحقق التقليل والفصل والحذف والتوثيق."}
prerequisites:
  - المحور 6 (كيف تعمل النماذج اللغوية، ومسارات العمل، وحقن الأوامر مبدئيًا).
  - المحاضرة 7.6 (التحقق قبل رفع البيانات).
  - المحور 11 (الأخلاقيات، والتوثيق، والحكامة).
entry:
  prior_knowledge:
    - "يعرف الطالب من المحاضرة 6.4 فكرة حقن الأوامر؛ نوسّعها هنا إلى إطار أمني كامل مع الصلاحيات."
    - "يعرف من المحاضرة 6.5 استبدال المعرّفات برموز؛ نضع ذلك في سياقه التقني والقانوني ونبيّن حدوده."
    - "يعرف من المحاضرة 7.6 أن رفع البيانات الشخصية حدث لا يُلغى بالحذف؛ نبني عليه دورة حياة البيانات."
    - "يعرف من المحور 11 التوثيق وصحيفة البيانات؛ نضيف إليهما البُعد القانوني وحقوق أصحاب البيانات."
  diagnostic_questions:
    - جدول فيه العمر والجنس والبلدية والمهنة، بلا أسماء. هل هذه بيانات مجهولة الهوية؟ ولماذا؟
    - كتبتَ في نافذة محادثة اسم طالب ونتيجته لتطلب صياغة تقرير. ما الذي حدث بالضبط؟ وهل يُلغيه حذف المحادثة؟
    - أداة تقرأ بريدك وتستطيع الرد عليه. ما أخطر ما قد يحدث إذا وصلتها رسالة فيها تعليمات مدسوسة؟
    - ما الفرق بين «البيانات مشفّرة» و«البيانات مجهولة الهوية» و«البيانات محمية»؟
    - هل يمكن لنموذج لغوي أن «يتذكر» نصًّا من بيانات تدريبه ويعيد إنتاجه حرفيًا؟
exit:
  competencies:
    - أستطيع أن أحدد هل بيانات ما شخصية بمعيار قابلية التعرّف لا بوجود الاسم.
    - أستطيع أن أشرح لماذا يفشل إخفاء الهوية بالحذف، وأن أذكر دليلًا منشورًا على ذلك.
    - أستطيع أن أقرأ سياسة بيانات أداة وأستخرج منها ما يخصّ عملي في ستة أسئلة.
    - أستطيع أن أشرح حقن الأوامر المباشر وغير المباشر وأطبّق مبدأ الصلاحية الأدنى على مسار عمل.
    - أستطيع أن أصمم إجراء معالجة لمشروعي يحقق التقليل والإخفاء والفصل والحذف.
    - أستطيع أن أسمّي حقوق أصحاب البيانات وأحدد ما يلزمني عمليًا تجاه من أبحث عنهم.
  assessment_activities:
    - "اختبار بعدي يجمع قابلية التعرّف ودورة حياة البيانات والأمان والضوابط."
    - "تمرين إعادة التعرّف: جدول «مجهول الهوية» يُطلب كشف أفراده بربطه بمصدر عام."
    - "قراءة سياسة بيانات حقيقية واستخراج أجوبة الأسئلة الستة منها."
    - "تمرين أمني: مسار عمل موصوف، يُطلب تحديد نقاط الحقن وتطبيق الصلاحية الأدنى."
    - "نشاط عملي: إعادة تصميم إجراء بحثي ليحقق تقليل البيانات."
    - "مشروع مصغّر: خطة معالجة بيانات لمذكرة الطالب مع سجل معالجة موجز."
  common_mistakes:
    - الاعتقاد أن حذف الاسم يجعل البيانات مجهولة الهوية.
    - الخلط بين التشفير وإخفاء الهوية وبين الأسماء المستعارة وإخفاء الهوية.
    - الاعتقاد أن حذف المحادثة يُلغي أثر ما أُرسِل.
    - معاملة حقن الأوامر على أنه خطأ برمجي قابل للإصلاح النهائي.
    - منح الأداة صلاحيات واسعة لأن ذلك «أسهل».
    - الاعتقاد أن النموذج لا يمكن أن يعيد إنتاج نصوص تدريبه.
    - الاكتفاء بموافقة شكلية بديلًا عن تقليل البيانات فعلًا.
  remediation:
    - إذا ظننت أن حذف الاسم كافٍ، شغّل مختبر إعادة التعرّف (المحاضرة 12.1) وراقب كم صفة تكفي.
    - إذا التبس الفرق بين إخفاء الهوية والأسماء المستعارة، أعد جدول المقارنة في المحاضرة 12.5.
    - إذا لم تقتنع بخطر حقن الأوامر، شغّل مختبر الحقن غير المباشر (المحاضرة 12.3) وتابع مسار الصلاحيات.
    - راجع المحاضرة 6.4 قبل 12.3، فهي أساسها المفاهيمي.
    - إذا بدا المحور نظريًا، ابدأ من المحاضرة 12.5 وطبّق جدول الضوابط على مشروعك الحالي.
  suggested_reading: [m12_rocher_2019, m12_montjoye_2013, m12_carlini_2021_extract, m06_owasp_llm_2025, m12_gdpr_2016, m12_dwork_roth_2014]
  bridge: |
    غطّينا حتى الآن عدالة القرار (المحور 11) وحماية البيانات وأمن الأدوات (هذا المحور). وفي كل ضابط
    وضعناه كان هناك **إنسان** مفترض: من يراجع، ومن يوافق، ومن يرفض، ومن يوقف. **لكن هذا الإنسان نفسه لم
    يُدرَس بعد.** فهل المراجعة البشرية تعمل فعلًا؟ ومتى تصير توقيعًا شكليًا؟ و**المحور 13** — وهو ختام
    المقرر — يدرس الرقابة البشرية بوصفها **تصميمًا** له متطلبات وأنماط فشل معروفة: تحيّز الأتمتة، ومستويات
    الاستقلالية، وكيف تُبنى مراجعة تعمل بدل مراجعة تُمضى.
instructor:
  sequence:
    - "12.1 (قابلية التعرّف) أساس المحور كله: لا تختصرها، وابدأها بالمختبر لا بالتعريف."
    - "12.2 (دورة حياة البيانات) عملية جدًا؛ اجعلها قراءة سياسة حقيقية في القاعة."
    - "12.3 (الأمان والصلاحية الأدنى) تكمل المحاضرة 6.4؛ راجعها معهم سريعًا أولًا."
    - "12.4 (الحفظ والاستخراج) هي الأكثر إثارة للاهتمام والأسهل في المبالغة؛ اضبطها بالأدلة."
    - "12.5 (الضوابط) هي حصة العمل: اجعلها ورشة على مشاريعهم."
    - "12.6 (الإطار القانوني) يمكن اختصارها إن ضاق الوقت لصالح 12.1 و12.5."
  timing:
    - "الحصة 1 (90 د): الأسئلة التشخيصية (15 د) + المحاضرة 12.1 مع مختبر إعادة التعرّف."
    - "الحصة 2 (90 د): المحاضرة 12.2 مع قراءة سياسة بيانات حقيقية في القاعة."
    - "الحصة 3 (90 د): المحاضرة 12.3 مع مختبر الحقن غير المباشر."
    - "الحصة 4 (90 د): المحاضرة 12.4 مع مختبر استنتاج العضوية."
    - "الحصة 5 (90 د): المحاضرة 12.5 كورشة على مشاريع الطلبة."
    - "الحصة 6 (90 د): المحاضرة 12.6 (45 د) + نقاش (20 د) + الاختبار البعدي (25 د)."
    - "في مقرر قصير: 12.1 و12.3 و12.5 هي الحد الأدنى الذي لا ينزل عنه."
  discussion:
    - "إذا كانت 15 صفة تكفي للتعرّف على 99.98٪ من سكان بلد، فهل بقي معنى لعبارة «بيانات مجهولة الهوية»؟"
    - "من يملك البيانات التي تنتجها أنت أثناء استعمال أداة مجانية؟ وما مقابل المجانية؟"
    - "هل يجوز لأستاذ أن يرفع أعمال طلبته إلى أداة خارجية لتصحيحها؟ وبأي شروط؟"
    - "إذا كان حقن الأوامر لا حل كامل له، فهل يجوز نشر أدوات ذات صلاحيات تنفيذية أصلًا؟"
    - "هل الموافقة على شروط لا يقرأها أحد موافقة حقيقية؟"
  assessment_ideas:
    - "أعطِ جدولًا «مجهول الهوية» واطلب خطة لإعادة التعرّف على أفراده."
    - "أعطِ سياسة بيانات حقيقية واطلب استخراج أجوبة الأسئلة الستة."
    - "اعرض مسار عمل لوكيل ذي صلاحيات واطلب تحديد نقاط الحقن وتقليص الصلاحيات."
    - "اطلب إعادة تصميم إجراء بحثي ليحقق تقليل البيانات مع بقاء السؤال البحثي قائمًا."
    - "سؤال مقالي: «حذف الاسم ليس إخفاء هوية». اشرح بدليل منشور."
  extensions:
    - "قراءة Rocher وHendrickx وde Montjoye (2019) ومناقشة أثرها على معايير إخفاء الهوية."
    - "قراءة Narayanan وShmatikov (2008) ومناقشة منهج الربط بمصدر خارجي."
    - "قراءة فصل من Dwork وRoth (2014) ومناقشة معنى ميزانية الخصوصية."
    - "قراءة Carlini وآخرين (2021) ومناقشة ما يعنيه الحفظ لبيانات شخصية في التدريب."
    - "مقارنة قائمة OWASP لمخاطر تطبيقات النماذج اللغوية بإطار NIST للذكاء الاصطناعي التوليدي."
