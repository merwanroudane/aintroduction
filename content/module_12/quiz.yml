entry:
  - id: m12-e01
    type: mcq
    bloom: understand
    prompt: "جدول فيه العمر والجنس والبلدية والمهنة، بلا أسماء. هل هذه بيانات مجهولة الهوية؟"
    options:
      - "نعم، فلا يوجد اسم ولا رقم تعريف."
      - "لا، فالصفات المجتمعة تعمل معرّفًا، وكثير من الأفراد يصيرون فريدين بها."
      - "نعم، بشرط أن يكون عدد السجلات كبيرًا."
      - "لا، لأن أي جدول بيانات هو بيانات شخصية بالتعريف."
    answer: 1
    explanation: "قابلية التعرّف لا تحتاج اسمًا. وعدد التركيبات ينمو أسيًّا مع كل صفة، فينهار التشابه دفعةً. والخيار الرابع خطأ أيضًا: فالجداول المجمّعة كفايةً قد تخرج من نطاق البيانات الشخصية."
    review: m12-l01
  - id: m12-e02
    type: tf
    bloom: remember
    prompt: "حذف المحادثة من الأداة يُعيد البيانات إلى سيطرتك ويُلغي أثر إرسالها."
    answer: false
    explanation: "الإرسال حدث وقع. وقد تكون هناك نسخ احتياطية، وسجلات تشغيلية، ومراجعة سابقة. والأهم أن من كانت بياناته لم يعلم، وهذه مسألة حقوق لا نظافة ملفات. فالضابط ألا تُرسِل لا أن تحذف."
    review: m12-l02
  - id: m12-e03
    type: mcq
    bloom: apply
    prompt: "أداة تقرأ بريدك وتستطيع الرد عليه. ووصلتها رسالة فيها تعليمات مدسوسة. ما أخطر ما قد يحدث؟"
    options:
      - "تعطي ملخصًا خاطئًا للرسالة."
      - "تبحث في بريدك عن معلومات حسّاسة وترسلها إلى جهة خارجية، ثم تعطيك ملخصًا سليمًا يخفي ما حدث."
      - "تتوقف عن العمل وتعرض رسالة خطأ."
      - "تحذف الرسالة المشتبه فيها تلقائيًا."
    answer: 1
    explanation: "هذا هو الحقن غير المباشر: المستخدم ضحية لا فاعل، والأداة تنفّذ بصلاحياته وبلا علمه. والضرر دالّة في الصلاحيات الممنوحة لا في الهجوم نفسه."
    review: m12-l03
  - id: m12-e04
    type: mcq
    bloom: understand
    prompt: "ما الفرق بين «بيانات مشفّرة» و«بيانات باسم مستعار» و«بيانات مجهولة الهوية»؟"
    options:
      - "ثلاث عبارات لمعنى واحد."
      - "التشفير ضابط أمني تعود معه البيانات بالمفتاح؛ والاسم المستعار يبقيها بيانات شخصية؛ وإخفاء الهوية يعني تعذّر التعرّف عمليًا."
      - "المشفّرة أقوى الثلاثة، ومجهولة الهوية أضعفها."
      - "الفرق شكلي ولا أثر له في الالتزامات."
    answer: 1
    explanation: "الخلط هنا هو الأشيع عمليًا. والأثر كبير: البيانات ذات الاسم المستعار تبقى خاضعة لكل التزامات حماية البيانات الشخصية، ومن يظن أنه «أخفى الهوية» يسقط هذه الالتزامات بلا حق."
    review: m12-l01
  - id: m12-e05
    type: tf
    bloom: understand
    prompt: "لا يمكن لنموذج لغوي أن يعيد إنتاج نص من بيانات تدريبه حرفيًا."
    answer: false
    explanation: "أثبتت أعمال منشورة استخراج مئات النصوص الحرفية من نموذج لغوي، ومنها أسماء وأرقام هاتف وعناوين بريد — وبعضها ورد في وثيقة واحدة فقط من بيانات التدريب. والنماذج الأكبر أكثر عرضة لا أقل."
    review: m12-l04

questions:
  - id: m12-q01
    type: mcq
    bloom: remember
    prompt: "ما المعيار الذي تُعرَّف به البيانات الشخصية؟"
    options:
      - "وجود اسم الشخص أو رقم تعريفه."
      - "قابلية التعرّف على الشخص، مباشرةً أو غير مباشرة."
      - "حساسية المعلومة التي يحتويها السجل."
      - "كون البيانات غير منشورة للعموم."
    answer: 1
    explanation: "الكلمة الحاكمة «التعرّف» لا «الاسم». والاسم إحدى طرق التعرّف لا شرطها، والتعرّف غير المباشر بمجموعة عناصر تخصّ الشخص داخل في التعريف."
    why_wrong:
      0: "الاسم إحدى طرق التعرّف، وحذفه لا يمنع التعرّف بالصفات."
      2: "الحساسية تحدد شدة الالتزامات لا انطباق التعريف."
      3: "بيانات منشورة قد تكون شخصية تمامًا؛ والعلنية لا تُخرجها من التعريف."
    review: m12-l01
  - id: m12-q02
    type: mcq
    bloom: understand
    prompt: "وجدت دراسة منشورة أن 15 صفة ديموغرافية تكفي للتعرّف الصحيح على 99.98٪ من سكان بلد. ما الاستنتاج الصحيح؟"
    options:
      - "يجب التوقف عن نشر أي بيانات بحثية."
      - "نموذج «انزع الهوية وانشر وانسَ» غير كافٍ، والمطلوب الانتقال إلى إدارة الخطر بالتعميم وتقييد الوصول والتوثيق."
      - "المشكلة تخص ذلك البلد وحده بسبب طبيعة سكانه."
      - "الحل إضافة مزيد من الصفات لتشتيت التعرّف."
    answer: 1
    explanation: "خلصت الدراسة إلى أن حتى المجموعات المعايَنة المنزوعة الهوية يُستبعد أن تستوفي معايير الإخفاء الحديثة، وأن ذلك يتحدى كفاية نموذج «انشر وانسَ». والنتيجة ليست الامتناع بل إدارة الخطر."
    why_wrong:
      0: "الامتناع عن البحث ليس نتيجة الدراسة، والضوابط المتاحة تجعل النشر المسؤول ممكنًا."
      2: "المنهج عام وطُبِّق على 210 مجتمعات، والبنية الرياضية لا تتعلق ببلد."
      3: "إضافة صفات تزيد قابلية التعرّف ولا تشتّتها."
    review: m12-l01
  - id: m12-q03
    type: multi
    bloom: apply
    prompt: "أي هذه أسئلة تُوجَّه إلى سياسة بيانات أداة قبل استعمالها في عمل يمسّ أشخاصًا؟ (اختر كل ما ينطبق)"
    options:
      - "من يستطيع الوصول إلى ما أُرسِل؟"
      - "ما مدة الاحتفاظ المعلنة، وهل تختلف بحسب نوع الحساب؟"
      - "كم عدد مستخدمي الأداة في العالم؟"
      - "هل تُستعمل مدخلاتي في تحسين النموذج، وهل ذلك افتراضي؟"
      - "في أي نطاق جغرافي تُخزَّن البيانات؟"
      - "هل الحذف فعلي أم إخفاء من العرض؟"
    answer: [0, 1, 3, 4, 5]
    explanation: "الأسئلة الخمسة المختارة هي من الستة المرجعية (مع سؤال المشاركة مع أطراف). وعدد المستخدمين ليس ضابطًا ولا يقول شيئًا عن معالجة بياناتك. والمهارة أن تُميّز «متاح» من «افتراضي» وأن تسجّل تاريخ قراءتك."
    review: m12-l02
  - id: m12-q04
    type: scenario
    bloom: analyze
    scenario: "طلبتَ من أداة أن تلخّص لك تقريرًا وصلك بالبريد. والتقرير يحتوي نصًّا مخفيًا يأمر بالبحث في صندوق بريدك عن بيانات حسّاسة وإرسالها إلى عنوان خارجي."
    prompt: "ما الذي يحدد حجم الضرر؟"
    options:
      - "مدى ذكاء النموذج وقدرته على كشف التعليمات المدسوسة."
      - "الصلاحيات التي مُنحت للأداة."
      - "جودة صياغة توجيه النظام الذي يحذّرها من التعليمات المدسوسة."
      - "حجم التقرير وعدد كلماته."
    answer: 1
    explanation: "المحتوى الخبيث ثابت، والنتيجة تتغير من «لا شيء» إلى «تسريب كامل» بتغيّر الصلاحيات وحدها. فالدفاع هندسة صلاحيات لا هندسة أوامر، ولا يجوز أن يقوم أمن النظام على ألا يُخترق النموذج."
    why_wrong:
      0: "النموذج يستقبل التعليمات والبيانات نصًّا في سياق واحد بلا حدّ صلب، فالميل إلى التوجيه إحصائي لا ضمان."
      2: "التوجيه الحذر طبقة نافعة لكنها آخر الطبقات قوةً، ولا يجوز أن يُعتمد عليها لفعل غير قابل للتراجع."
      3: "حجم النص لا علاقة له بحجم الضرر."
    review: m12-l03
  - id: m12-q05
    type: mcq
    bloom: apply
    prompt: "وفق مبدأ الصلاحية الأدنى، ما الصلاحية الأنسب لمساعد يصوغ ردودًا على استفسارات الطلبة؟"
    options:
      - "وصول كامل إلى صندوق البريد مع صلاحية إرسال تلقائي."
      - "وصول إلى الرسالة الواحدة التي يفتحها الموظف، وإنتاج مسوّدة لا تُرسَل بلا موافقة."
      - "وصول كامل إلى البريد مع تأكيد بشري مرة واحدة في بداية اليوم."
      - "وصول كامل بلا إرسال، مع حفظ الردود في مجلد مشترك."
    answer: 1
    explanation: "المورد محدد لا فئة، والكتابة مسوّدة لا تنفيذًا. فحتى مع نجاح الحقن، تكون الحصيلة مسوّدة غريبة يراها الموظف فيرفضها — أي إزعاج مرئي بدل تسريب."
    why_wrong:
      0: "أسوأ تركيب ممكن: محتوى غير موثوق مع صلاحية تنفيذ بلا مراجعة."
      2: "تأكيد واحد في اليوم يغطي كل الأفعال التالية، فيُفقد التأكيد معناه."
      3: "الوصول الكامل يسمح بالإفشاء، والمجلد المشترك يوسّع الضرر إلى الزملاء."
    review: m12-l03
  - id: m12-q06
    type: mcq
    bloom: understand
    prompt: "ما المتغير الذي يحكم نجاح هجوم استنتاج العضوية؟"
    options:
      - "حجم النموذج وحده."
      - "فرط الملاءمة، أي نسبة سعة النموذج إلى حجم بيانات التدريب."
      - "وجود معرّفات مباشرة في بيانات التدريب."
      - "كون النموذج متاحًا للعموم."
    answer: 1
    explanation: "كلما حفظ النموذج مشاهداته بدل أن يتعلم النمط، انزاح توزيع خسارته على الأعضاء فصار سلوكه قناة تسريب. ولهذا يقلّص الانضباط المنهجي — بيانات أكثر، وانتظام، ونموذج أبسط — التسريبَ والخطأ المنهجي معًا."
    why_wrong:
      0: "السعة أحد طرفي النسبة؛ ونموذج كبير على بيانات كبيرة قد لا يسرّب."
      2: "الهجوم لا يحتاج معرّفات: هو يستنتج العضوية من سلوك النموذج."
      3: "الإتاحة العامة توسّع من يستطيع الهجوم ولا تحدد نجاحه."
    review: m12-l04
  - id: m12-q07
    type: multi
    bloom: analyze
    prompt: "وُجد أن الحفظ في النماذج اللغوية ينمو مع ثلاثة عوامل. أي هذه إجراءات تستند إلى تلك النتائج؟ (اختر كل ما ينطبق)"
    options:
      - "إزالة السجلات المكرّرة من بيانات التدريب."
      - "استعمال نموذج لا يزيد حجمه على حاجة المهمة."
      - "تقييد طول السياق الذي يمرّره المستعمل عند الاستعلام."
      - "تشفير بيانات التدريب أثناء التخزين."
      - "عدم إدخال البيانات الحسّاسة في التدريب أصلًا."
    answer: [0, 1, 2, 4]
    explanation: "الحفظ ينمو لوغاريتميًا-خطيًا مع سعة النموذج ومع تكرار المثال ومع طول السياق، فالثلاثة الأولى تستند إلى ذلك مباشرة. والخامس يُلغي الخطر لا يخفّضه. أما التشفير فضابط أمني للتخزين ولا علاقة له بما ينتقل إلى الأوزان."
    review: m12-l04
  - id: m12-q08
    type: mcq
    bloom: evaluate
    prompt: "أي هذه ضابط حقيقي وليس نيّة حسنة؟"
    options:
      - "«لن يطّلع على الملف أحد غيري.»"
      - "«الأداة التي أستعملها موثوقة.»"
      - "«يُولَّد رمز عشوائي لكل مشارك، ويُحفظ مفتاح الربط في موضع منفصل بوصول مقتصر على شخص واحد.»"
      - "«حذفت المحادثة بعد أن انتهيت.»"
    answer: 2
    explanation: "المعيار الفاصل: هل يمكن لطرف ثالث أن يتحقق منه ويُثبت أنه لم يُطبَّق؟ فالضابط إجراء قابل للفحص، والنيّة حسنة وغير قابلة للفحص ولا تحميك."
    why_wrong:
      0: "توقّع عن سلوك مستقبلي، لا إجراء قابل للتحقق."
      1: "حكم بلا مرجع؛ والسؤال الصحيح: ما الذي قرأتَه وبأي تاريخ؟"
      3: "تصحيح بعد وقوع الحدث، ولا يُعيد البيانات إلى سيطرتك."
    review: m12-l05
  - id: m12-q09
    type: mcq
    bloom: create
    prompt: "تنشر جدول متوسطات بحسب البلدية والمستوى التعليمي والجنس لعيّنة 600 أسرة في 12 بلدية. ما أول ضابط تطبّقه؟"
    options:
      - "حذف أسماء الأسر من ملف البيانات."
      - "تحديد عتبة لحجم الخلية قبل التحليل، ودمج أو حجب ما دونها، وحجب خليتين في كل صف لمنع الاستنباط بالطرح."
      - "تشفير ملف الجدول قبل إرساله إلى الناشر."
      - "إضافة تنبيه في الجدول بأن البيانات سرّية."
    answer: 1
    explanation: "600 أسرة موزّعة على 12 بلدية × مستويات × جنسين تعطي خلايا بأفراد قليلين، وبعضها بفرد واحد — ونشر متوسط خلية من فرد هو نشر بياناته. وحجب خلية واحدة لا يكفي لأن المجموع يسمح بحسابها."
    why_wrong:
      0: "لا أسماء في جدول متوسطات أصلًا؛ المشكلة في صغر الخلايا."
      2: "التشفير يحمي النقل ولا يمنع الإفشاء بعد النشر المقصود."
      3: "التنبيه لا يغيّر ما يمكن استنباطه من الأرقام المنشورة."
    review: m12-l05
  - id: m12-q10
    type: mcq
    bloom: evaluate
    prompt: "أستاذ يريد موافقة طلبته على استعمال بياناتهم في بحثه. ما الشرط الذي يحدد صلاحية هذه الموافقة أساسًا؟"
    options:
      - "أن تكون مكتوبة وموقّعة."
      - "أن يكون رفض الطالب بلا أي أثر عليه، وإلا لم تكن الموافقة حرة."
      - "أن يوافق أغلب الطلبة."
      - "أن تُجمع في قاعة الدرس ليتمكن الأستاذ من شرح البحث."
    answer: 1
    explanation: "الموافقة يجب أن تكون حرة ومحددة ومستنيرة وقابلة للسحب. وفي علاقة غير متكافئة يصعب إثبات الحرية، فقد يكون الأنسب أساسًا آخر مع إعلام شفاف، أو تغيير طريقة الجمع بأن يجمعها طرف لا يعرف المشاركين."
    why_wrong:
      0: "التوقيع شكل؛ وموافقة موقّعة غير حرة تبقى باطلة."
      2: "الموافقة فردية لا جماعية، ولا معنى لأغلبية فيها."
      3: "الجمع بحضور الأستاذ يضعف الحرية بدل أن يقوّيها."
    review: m12-l06
