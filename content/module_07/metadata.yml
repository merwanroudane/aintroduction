module_number: 7
title: "تطبيقات النماذج اللغوية (ChatGPT، Google Gemini، Claude...)"
short_title: النماذج اللغوية الكبيرة
title_en: "Large Language Models in practice (ChatGPT, Gemini, Claude...)"
subtitle: من الرمز إلى الانتباه إلى دورة الحياة، ثم الهلوسة والاسترجاع والوكلاء، ثم الأدوات الفعلية بمقارنة محايدة موثقة.
description: |
  هذا هو المحور المركزي في المقرر، وهو الذي يحقق الهدف العام الثالث: **تدريب الطالب على التعامل مع النماذج
  اللغوية الكبيرة**. وقد أشرنا إليه مرارًا في المحاور السابقة، وآن أوان فتح الصندوق.

  نبدأ من الأساس: ما **النموذج اللغوي**؟ وكيف يُقطَّع النص إلى **رموز (Tokens)**؟ وما **التضمينات**؟ وكيف
  يُنتَج النص بالتنبؤ المتكرر بالرمز التالي، وما دور **درجة الحرارة** في ذلك؟ ثم ندرس بنية **المحوّل** وآلية
  **الانتباه الذاتي**، ثم **دورة حياة النموذج** من البيانات إلى التدريب المسبق إلى ضبط التعليمات والمواءمة
  إلى التقييم فالاستدلال.

  ثم ننتقل إلى ما يهم المستخدم مباشرة: **الهلوسة** (ما هي؟ ولماذا تحدث؟ وكيف تُخفَّف؟)، و**نافذة السياق**،
  و**التقييد والاسترجاع المعزز (RAG)**، و**استعمال الأدوات**، و**الوكلاء**، مع جدول المقارنة المركزي:
  **هندسة الأوامر مقابل RAG مقابل الضبط الدقيق**.

  ونختم بالمحاضرة التي ينتظرها الطلبة: **ChatGPT و Gemini و Claude عمليًا**. ونلتزم فيها بقاعدة صارمة:
  **لا ترتيب ولا تفضيل ولا دعاية**؛ مقارنة وظيفية محايدة مبنية على الوثائق الرسمية المُطّلع عليها بتاريخ
  محدد، مع تنبيه دائم إلى أن هذه المعلومات تتغير بسرعة ويجب التحقق منها عند كل استعمال.
estimated_duration: "6 حصص × 90 دقيقة"
difficulty: متوسط
keywords: [النماذج اللغوية الكبيرة, LLM, الرموز, Tokens, التقطيع, التضمينات, Embeddings, التنبؤ بالرمز التالي, درجة الحرارة, المحوّل, Transformer, الانتباه الذاتي, نافذة السياق, الهلوسة, التقييد, RAG, استعمال الأدوات, الوكلاء, الضبط الدقيق]
concept_diagram: m07_concept_map
objectives:
  - {bloom: remember, text: "يعرّف النموذج اللغوي والرمز والتضمين ونافذة السياق ودرجة الحرارة."}
  - {bloom: understand, text: "يشرح آلية التنبؤ بالرمز التالي وكيف يتحول التوزيع الاحتمالي إلى نص."}
  - {bloom: understand, text: "يشرح فكرة الانتباه الذاتي ودورها في بنية المحوّل بلغة مفاهيمية مدعومة برياضيات مبسطة."}
  - {bloom: understand, text: "يفسّر أسباب الهلوسة ويميز بينها وبين الخطأ والمعلومة القديمة والإجابة الغامضة."}
  - {bloom: apply, text: "يختار بين هندسة الأوامر والاسترجاع المعزز والضبط الدقيق لحالة معينة ويبرر اختياره."}
  - {bloom: analyze, text: "يحلل مسار الاسترجاع المعزز ويحدد أين يمكن أن يفشل."}
  - {bloom: evaluate, text: "يقيّم أداة حوارية تقييمًا محايدًا بالاعتماد على وثائقها الرسمية وتاريخ التحقق."}
  - {bloom: create, text: "يصمم مسار استعمال مسؤولًا لأداة حوارية في مهمة أكاديمية مع ضوابط التحقق والخصوصية."}
prerequisites:
  - المحور 4 كاملًا (المفردات، والتعلم الذاتي الإشراف، والخسارة، وSoftmax).
  - المحور 5 (هندسة الأوامر) والمحور 6 (التقييد والأمان).
entry:
  prior_knowledge:
    - "يعرف الطالب من المحاضرة 4.4 دالة Softmax؛ يستعملها هنا لفهم كيف تتحول درجات النموذج إلى احتمالات للكلمة التالية."
    - "يعرف من المحاضرة 4.2 التعلم الذاتي الإشراف؛ يراه هنا مطبقًا في التدريب المسبق للنماذج اللغوية."
    - "يعرف من المحاضرة 2.5 أن المحوّل استغنى عن التكرار فصار التدريب متوازيًا؛ نفصّل هنا آلية الانتباه نفسها."
    - "يعرف من المحاضرة 6.3 التقييد بالمصدر؛ نبني عليه الاسترجاع المعزز بوصفه آلية توفير ما نقيّد به."
  diagnostic_questions:
    - كيف تتوقع أن ينتج النموذج اللغوي جملة كاملة؟ هل يكتبها دفعة واحدة أم جزءًا جزءًا؟
    - لماذا يعطي المساعد الحواري إجابة مختلفة قليلًا كل مرة للسؤال نفسه؟
    - إذا سألته عن حدث وقع الأسبوع الماضي، فما احتمالات أن تكون إجابته صحيحة؟ وعلامَ يتوقف ذلك؟
    - ما الفرق في رأيك بين أن «يعرف» النموذج معلومة وأن «يبحث» عنها؟
exit:
  competencies:
    - أستطيع أن أشرح كيف يولّد النموذج اللغوي النص، وأن أفسّر سبب اختلاف المخرجات.
    - أستطيع أن أشرح الانتباه الذاتي مفاهيميًا وأربطه ببنية المحوّل.
    - أستطيع أن أصف دورة حياة النموذج وأحدد ما يحدث في كل مرحلة.
    - أستطيع أن أشخّص الهلوسة وأميزها عن أنواع الخطأ الأخرى وأقترح تخفيفًا مناسبًا.
    - أستطيع أن أختار بين هندسة الأوامر والاسترجاع والضبط الدقيق بمعايير واضحة.
    - أستطيع أن أقارن بين أدوات حوارية مقارنة محايدة موثقة ومؤرخة دون ترتيب.
  assessment_activities:
    - "اختبار بعدي يجمع أسئلة مفاهيمية وتقنية وسيناريوهات اختيار."
    - "تمرين مختبري: تجريب درجة الحرارة والتقطيع وتسجيل الملاحظات في تقرير قصير."
    - "تمرين مقارنة: ملء خانتين في مصفوفة المقارنة من الوثائق الرسمية مع ذكر الرابط وتاريخ التحقق."
    - "دراسة حالة: تصميم مسار استرجاع معزز لسؤال جامعي وتحديد نقاط الفشل."
    - "بطاقة استعمال مسؤول: كيف أستعمل مساعدًا حواريًا في بحثي؟ (صفحة واحدة تُقيَّم بسلم)."
  common_mistakes:
    - تصور أن النموذج يبحث في قاعدة بيانات عن الإجابة.
    - الاعتقاد بأن رفع درجة الحرارة يزيد الإبداع الصحيح، أو أن خفضها يضمن الصحة.
    - الخلط بين نافذة السياق والذاكرة الدائمة.
    - الاعتقاد بأن الاسترجاع المعزز يضمن صحة الإجابة.
    - الخلط بين الوكيل الذكي والذكاء العام (عولج في المحور 3 ويعاد تأكيده هنا).
    - مقارنة الأدوات بالانطباع أو بالشهرة بدل الوثائق الرسمية المؤرخة.
  remediation:
    - إذا بقيت آلية التوليد غامضة، شغّل مختبر درجة الحرارة وراقب تغير التوزيع (المحاضرة 7.1).
    - إذا لم يتضح الانتباه، استعمل مختبر الانتباه التوضيحي ثم شاهد فيديو 3Blue1Brown (المحاضرة 7.2).
    - إذا التبست أنواع الأخطاء، أعد جدول تصنيف الهلوسة واملأه بأمثلة من تجربتك (المحاضرة 7.3).
    - إذا صعب اختيار المقاربة، أعد جدول «هندسة الأوامر مقابل RAG مقابل الضبط الدقيق» وطبّقه على ثلاث حالات (المحاضرة 7.4).
    - افتح الوثائق الرسمية لأداة تستعملها واملأ صفًا واحدًا في مصفوفة المقارنة بنفسك (المحاضرة 7.6).
  suggested_reading: [m07_vaswani_2017, m07_ouyang_2022, m07_lewis_2020, m07_huang_2023, m07_openai_help]
  bridge: |
    فهمنا الآن كيف تعمل النماذج اللغوية وكيف نستعملها بمسؤولية. لكن قدرتها لا تقتصر على النص: فالمبادئ نفسها
    تمتد إلى **توليد النصوص بمهارة** (كيف نكتب ونلخّص ونستخرج ونتحقق)، وهو موضوع **المحور 8**، الذي يأخذ كل ما
    تعلمناه هنا ويحوّله إلى ممارسة يومية في الكتابة والبحث، مع قسم كامل عن **التحقق** الذي أجّلناه مرارًا.
instructor:
  sequence:
    - "7.1 (الأساسيات) لا تُختصر: كل ما بعدها يعتمد عليها."
    - "7.2 (المحوّل) يمكن تخفيفها للمجموعات غير التقنية: اكتفِ بالفكرة المفاهيمية وأحِل التعمق إلى الفيديو."
    - "7.3 (دورة الحياة والهلوسة) هي الأعلى قيمة عملية: خصص لها وقتًا كافيًا."
    - "7.4 (الاسترجاع والأدوات) و7.5 (الوكلاء) متتاليتان منطقيًا."
    - "7.6 (الأدوات) في النهاية، واحرص على الحياد التام: الوثائق الرسمية لا الانطباعات."
  timing:
    - "الحصة 1 (90 د): الأسئلة التشخيصية (10 د) + المحاضرة 7.1 (60 د) + مختبرا التقطيع والحرارة (20 د)."
    - "الحصة 2 (90 د): المحاضرة 7.2 مع مختبر الانتباه."
    - "الحصة 3 (90 د): المحاضرة 7.3 مع تمرين تصنيف الأخطاء."
    - "الحصة 4 (90 د): المحاضرة 7.4 مع مختبر الاسترجاع المعزز."
    - "الحصة 5 (90 د): المحاضرة 7.5 مع مختبر الوكيل."
    - "الحصة 6 (90 د): المحاضرة 7.6 + نشاط ملء المصفوفة من الوثائق + الاختبار البعدي (25 د)."
    - "في حصة قصيرة (60 د): اختصر 7.2 إلى فكرة الانتباه فقط، ولا تختصر 7.3 ولا 7.6."
  discussion:
    - "إذا كان النموذج يتنبأ بالكلمة التالية فقط، فكيف يُنتج نصًا متماسكًا في موضوع كامل؟"
    - "هل «معرفة» النموذج معرفة بالمعنى البشري؟ وما الفرق بينها وبين محتوى قاعدة بيانات؟"
    - "الاسترجاع المعزز يقيّد النموذج بمصادرك. فمن يتحمل مسؤولية جودة تلك المصادر؟"
    - "لماذا نرفض ترتيب الأدوات رغم أن الطلبة يسألون دائمًا: أيها الأفضل؟"
  assessment_ideas:
    - "أعطِ سيناريو واطلب اختيار المقاربة (أوامر / استرجاع / ضبط دقيق) مع ثلاثة مبررات."
    - "اطلب تحليل مسار استرجاع معزز وتحديد ثلاث نقاط فشل ممكنة."
    - "اطلب ملء صف في مصفوفة المقارنة من وثيقة رسمية مع الرابط وتاريخ التحقق."
    - "سؤال مقالي: «الطلاقة ليست معرفة». اشرح بالاعتماد على آلية التوليد."
  extensions:
    - "قراءة ورقة المحوّل (Vaswani et al., 2017) بتركيز على القسم 3.2 (الانتباه)."
    - "قراءة مسح الهلوسة (Huang et al., 2023) ومناقشة تصنيفه لأنواعها وأسبابها."
    - "مقارنة ورقة BERT (2018) بالنماذج التوليدية: ما الفرق بين الترميز ثنائي الاتجاه والتوليد التلقائي؟"
