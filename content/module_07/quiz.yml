entry:
  - id: m07-e01
    type: mcq
    bloom: understand
    prompt: "كيف ينتج النموذج اللغوي جملة كاملة؟"
    options:
      - "يكتبها دفعة واحدة بعد أن يخطط لها كاملة."
      - "يتنبأ بالرمز التالي، ثم يضيفه إلى السياق، ثم يعيد العملية رمزًا رمزًا."
      - "يبحث عن جملة مشابهة في قاعدة بيانات وينسخها."
      - "يترجمها من لغة داخلية."
    answer: 1
    explanation: "التوليد حلقة تتكرر: توزيع احتمالي للرمز التالي، ثم أخذ عينة، ثم إعادة الحساب."
    review: m07-l01
  - id: m07-e02
    type: mcq
    bloom: understand
    prompt: "لماذا تختلف إجابة المساعد قليلًا في كل مرة للسؤال نفسه؟"
    options:
      - "لأنه يتعلم من كل محادثة فورًا."
      - "لأن الرمز التالي يُؤخذ **عينةً** من توزيع احتمالي، لا يُختار حتميًا."
      - "لأن الخوادم مختلفة."
      - "لأن معاملاته تتغير أثناء الاستعمال."
    answer: 1
    explanation: "أخذ العينة عشوائي؛ ومعاملات النموذج لا تتغير أثناء الاستدلال (المحاضرة 4.1)."
    review: m07-l01
  - id: m07-e03
    type: tf
    bloom: understand
    prompt: "إذا سألتَ النموذج عن حدث وقع الأسبوع الماضي، فإجابته موثوقة ما دامت مفصّلة."
    answer: false
    explanation: "معرفته تتوقف عند تاريخ قطع المعرفة؛ والتفصيل ليس دليل صحة بل قد يكون اختلاقًا معقولًا."
    review: m07-l03
  - id: m07-e04
    type: mcq
    bloom: understand
    prompt: "ما الفرق بين أن «يعرف» النموذج معلومة وأن «يبحث» عنها؟"
    options:
      - "لا فرق."
      - "المعرفة من التدريب المسبق ومشفّرة في الأوزان وقد تتقادم؛ والبحث استرجاع من مصدر خارجي يُدرج في السياق ويمكن الاستشهاد به."
      - "البحث أبطأ فقط."
      - "المعرفة أدق دائمًا."
    answer: 1
    explanation: "هذا جوهر الفرق بين النموذج وحده والاسترجاع المعزز (المحاضرة 7.4)."
    review: m07-l04
  - id: m07-e05
    type: tf
    bloom: remember
    prompt: "نافذة السياق ونظام الذاكرة في المنتج شيء واحد."
    answer: false
    explanation: "النافذة حد تقني لما يُعالَج الآن؛ والذاكرة ميزة منتج تحفظ معلومات بين الجلسات."
    review: m07-l03

questions:
  - id: m07-q01
    type: mcq
    bloom: understand
    prompt: "لماذا تُقاس نافذة السياق والتكلفة بالرموز لا بالكلمات؟"
    options:
      - "لأن الرموز أسهل في العدّ."
      - "لأن النموذج لا يعالج كلمات بل رموزًا قد تكون أصغر من الكلمة، وهي وحدة الحساب الفعلية."
      - "لأن الكلمات تختلف بين اللغات فقط."
      - "لأسباب تسويقية."
    answer: 1
    explanation: "التقطيع هو الخطوة الأولى؛ وكل ما بعده يعمل على الرموز."
    review: m07-l01
  - id: m07-q02
    type: scenario
    bloom: apply
    scenario: "تريد استخراج بيانات من 300 وثيقة بصيغة ثابتة تمامًا لمعالجتها برمجيًا."
    prompt: "ما إعداد درجة الحرارة المناسب وما الذي لا يضمنه لك؟"
    options:
      - "حرارة مرتفعة (1.5) لزيادة الإبداع."
      - "حرارة منخفضة جدًا (0–0.2) للثبات؛ لكنها **لا تضمن** صحة القيم ولا الالتزام التام بالمخطط، فيبقى التحقق البرمجي إلزاميًا."
      - "حرارة متوسطة (1.0) دائمًا."
      - "الحرارة لا تؤثر في الاستخراج."
    answer: 1
    explanation: "الحرارة تضبط التباين لا الصدق؛ والالتزام بالشكل احتمالي (المحاضرة 6.2)."
    review: m07-l01
  - id: m07-q03
    type: mcq
    bloom: understand
    prompt: "ما وظيفة الانتباه الذاتي في المحوّل؟"
    options:
      - "ترتيب الكلمات أبجديًا."
      - "حساب وزن لكل رمز تجاه بقية الرموز، وبناء تمثيل مزيج مرجّح منها فيصبح التمثيل مراعيًا للسياق."
      - "ترجمة النص إلى لغة وسيطة."
      - "ضغط النص لتوفير الذاكرة."
    answer: 1
    explanation: "softmax(QKᵀ/√d_k)V: مطابقة الاستعلام بالمفاتيح تحدد الأوزان، والقيم هي المحتوى المنقول."
    review: m07-l02
  - id: m07-q04
    type: mcq
    bloom: analyze
    prompt: "لماذا يحتاج المحوّل إلى ترميز موضعي صريح بينما لم تحتجه الشبكات التكرارية؟"
    options:
      - "لأنه أسرع."
      - "لأن الانتباه مجموع مرجح لا يتأثر بإعادة الترتيب، فلا يرى الترتيب؛ أما التكرارية فتعالج الرموز بالتسلسل فالترتيب ضمني فيها."
      - "لأن المحوّل يعمل على الصور فقط."
      - "لأن الترميز الموضعي يقلل التكلفة."
    answer: 1
    explanation: "ثمن مكسب التوازي: ما ربحناه من المعالجة المتزامنة دفعناه بالحاجة إلى تمثيل الموضع صراحة."
    review: m07-l02
  - id: m07-q05
    type: mcq
    bloom: apply
    prompt: "سياق طوله 2000 رمز مقابل 4000 رمز: كيف تتغير تكلفة الانتباه تقريبًا؟"
    options: ["تبقى كما هي", "تتضاعف مرتين", "تتضاعف **أربع مرات** تقريبًا لأن التكلفة من رتبة O(n²)", "تنخفض للنصف"]
    answer: 2
    explanation: "الانتباه يحسب التشابه بين كل زوج من الرموز؛ ولهذا لا تحشُ السياق بما لا يلزم."
    review: m07-l02
  - id: m07-q06
    type: multi
    bloom: remember
    prompt: "أي مما يلي من مراحل دورة حياة النموذج اللغوي؟ (اختر كل ما ينطبق)"
    options: ["التدريب المسبق", "ضبط التعليمات", "المواءمة", "التقطيع"]
    answer: [0, 1, 2]
    explanation: "التقطيع خطوة في معالجة المدخل وليس مرحلة في دورة حياة النموذج."
    review: m07-l03
  - id: m07-q07
    type: scenario
    bloom: analyze
    scenario: "مساعد أعطاك مرجعًا علميًا باسم مؤلف حقيقي في المجال، وعنوان معقول، ومجلة موجودة، وسنة متسقة — ثم تبين أن الورقة غير موجودة."
    prompt: "ما التفسير البنيوي؟"
    options:
      - "خطأ في قاعدة بياناته."
      - "النموذج يولّد التسلسل **الأرجح لغويًا**؛ وكل عنصر من عناصر المرجع عالي الاحتمال، فالتركيبة معقولة وغير موجودة، ولا آلية داخلية تتحقق من الواقع."
      - "المجلة حذفت الورقة."
      - "السؤال كان غامضًا فقط."
    answer: 1
    explanation: "هذا هو السبب الجذري للهلوسة: تحسين الاحتمال اللغوي لا الصدق الواقعي."
    review: m07-l03
  - id: m07-q08
    type: multi
    bloom: analyze
    prompt: "أي مما يلي **ليس** هلوسة بالمعنى الدقيق وإن كان خطأ؟ (اختر كل ما ينطبق)"
    options:
      - "معلومة كانت صحيحة ولم تعد كذلك (قِدَم)."
      - "خطأ في عملية حسابية رغم صحة المعطيات."
      - "مرجع علمي غير موجود."
      - "إجابة عامة غامضة بلا مضمون."
    answer: [0, 1, 3]
    explanation: "الاختلاق هو الهلوسة بالمعنى الدقيق؛ والباقي أنواع خطأ أخرى لكل منها علاج مختلف."
    review: m07-l03
  - id: m07-q09
    type: scenario
    bloom: evaluate
    scenario: "نظام استرجاع معزز يجيب عن أسئلة لائحة جامعية، لكن نسخة اللائحة المخزّنة قديمة بسنتين."
    prompt: "ما وصف المخرجات؟"
    options:
      - "صحيحة لأنها مسندة إلى مصدر."
      - "**مسندة تمامًا وخاطئة تمامًا**: الإسناد يثبت مصدر المعلومة لا صحتها الحالية."
      - "لا علاقة للاسترجاع بالمشكلة."
      - "المشكلة في النموذج لا في المصادر."
    answer: 1
    explanation: "أخطر أنواع الفشل في RAG: فشل صامت يبدو موثقًا. ولهذا تلزم حوكمة الوثائق وتواريخها."
    review: m07-l04
  - id: m07-q10
    type: scenario
    bloom: evaluate
    scenario: "جامعة تريد مساعدًا يجيب عن لوائحها التي تُعدَّل كل سنة، مع إمكانية الاستشهاد بالمادة."
    prompt: "ما المقاربة الصحيحة؟"
    options:
      - "ضبط دقيق على نصوص اللوائح ليحفظها."
      - "**استرجاع معزز** من اللوائح المحدّثة مع الإسناد بالمادة؛ لأن الضبط الدقيق يجمّد الوقائع في الأوزان ويفقد الإسناد."
      - "الاعتماد على معرفة النموذج العامة."
      - "أمر طويل جدًا يتضمن كل اللوائح في كل مرة."
    answer: 1
    explanation: "الوقائع مكانها الاسترجاع لا الأوزان؛ والضبط الدقيق للأسلوب والصيغة."
    why_wrong: {0: "يحتاج إلى إعادة تدريب مع كل تعديل، ولا يتيح الاستشهاد بالمادة."}
    review: m07-l04
  - id: m07-q11
    type: multi
    bloom: analyze
    prompt: "ما مكونات الوكيل الذكي؟ (اختر كل ما ينطبق)"
    options:
      - "أدوات يستطيع استدعاءها ضمن صلاحيات ممنوحة."
      - "حالة تُحدَّث بعد كل خطوة."
      - "حلقة بشروط توقف."
      - "وعي بذاته وبحدوده."
    answer: [0, 1, 2]
    explanation: "الوكيل لا يدرك خروجه عن نطاقه؛ وهذا أحد فروقه عن الذكاء العام."
    review: m07-l05
  - id: m07-q12
    type: mcq
    bloom: evaluate
    prompt: "وكيل بحث بدأ بجمع مقالات صحفية بدل أوراق محكمة، ثم بنى عليها تحليلًا ثم مراجعة أدبيات متماسكة. أين المشكلة الجوهرية؟"
    options:
      - "في صياغة المخرج النهائي."
      - "**انحراف الخطوة الأولى**: كل ما بعدها بُني عليها، والخطأ صار غير مرئي في مخرج متماسك."
      - "في طول المراجعة."
      - "لا مشكلة ما دام النص متماسكًا."
    answer: 1
    explanation: "التماسك ليس دليل صحة؛ والضابط: معيار مصدر في الهدف + نقطة تحقق بعد الاختيار."
    review: m07-l05
  - id: m07-q13
    type: mcq
    bloom: evaluate
    prompt: "طالب يسأل: «أي أداة أفضل؟». ما الرد المنهجي الصحيح؟"
    options:
      - "ذكر اسم الأداة الأشهر."
      - "إعادة صياغة السؤال: **ما الأنسب لهذه المهمة ضمن هذه القيود؟** ثم القياس على مجموعة اختبار من عمله بمعيار محدد."
      - "سؤال النموذج نفسه عن قدراته."
      - "الاعتماد على مقاطع فيديو حديثة."
    answer: 1
    explanation: "«الأفضل» يتغير بتغير المهمة والقيود؛ والمنهج يبقى بعد تقادم أي ترتيب."
    why_wrong: {2: "النموذج قد لا يعرف خصائص المنتج المحيط به وقد يهلوس بثقة؛ اسأل الوثيقة."}
    review: m07-l06
  - id: m07-q14
    type: multi
    bloom: apply
    prompt: "عند التحقق من خاصية في أداة، ما الذي يجب تسجيله؟ (اختر كل ما ينطبق)"
    options:
      - "الرابط الدقيق للوثيقة الرسمية."
      - "تاريخ الاطلاع."
      - "الشروط: الخطة والمنطقة ونوع الحساب."
      - "رأي مستخدمين في منتديات."
    answer: [0, 1, 2]
    explanation: "المصدر الرسمي والتاريخ والشروط؛ وإن لم تجد فاكتب «غير موثق» ولا تخمّن."
    review: m07-l06
  - id: m07-q15
    type: scenario
    bloom: evaluate
    scenario: "أستاذ يريد رفع ملف فيه أسماء الطلبة وعلاماتهم إلى مساعد حواري لتحليلها، ويقول: «سأراجع المخرج جيدًا»."
    prompt: "ما التقييم الصحيح؟"
    options:
      - "لا مشكلة ما دام سيراجع."
      - "المراجعة لا تعالج المشكلة: **الخصوصية تُنتهك عند الإدخال لا عند الإخراج**؛ الواجب إخفاء الهوية بالرموز والتحقق من سياسة البيانات أولًا."
      - "المشكلة في دقة التحليل فقط."
      - "يكفي أن يحذف المحادثة بعدها."
    answer: 1
    explanation: "رفع البيانات الشخصية حدث وقع فعلًا؛ والحذف اللاحق لا يلغي المعالجة (المحور 12)."
    review: m07-l06
