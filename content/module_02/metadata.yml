module_number: 2
title: "تاريخ الذكاء الاصطناعي: مراحل التطور"
short_title: تاريخ الذكاء الاصطناعي
title_en: "History of AI: Stages of Development"
subtitle: سبعة عقود من الصعود والتراجع، ولكل مرحلة مشكلتها ومنهجها وأسباب نجاحها وحدودها.
description: |
  لا يُدرَّس تاريخ الذكاء الاصطناعي في هذا المقرر بوصفه سردًا لتواريخ وأسماء، بل بوصفه **سلسلة من المشكلات
  والحلول**. فكل مرحلة من مراحل الحقل انطلقت من سؤال مركزي، وطوّرت منهجًا للإجابة عنه، ونجحت فيه إلى حد،
  ثم اصطدمت بحدود دفعت الباحثين إلى منهج آخر. من يفهم هذه الحركة يفهم لماذا صارت النماذج اللغوية الكبيرة
  ما هي عليه اليوم، ويصبح أقدر على تقدير ما قد يأتي بعدها.

  نتبع في كل مرحلة خمسة أسئلة ثابتة: **ما المشكلة السائدة؟ وما المنهج المستعمل؟ ولماذا نجح؟ وما حدوده؟
  ولماذا انتقل الحقل إلى المرحلة التالية؟** وهذا الإطار يحوّل التاريخ من معلومات تُحفظ إلى أداة تحليل تُستعمل،
  ويكشف نمطًا متكررًا: كل منهج نجح في صنف من المسائل يشبه ما صُمّم له، وأخفق حين واجه ما لم يُصمّم له.

  ويكشف هذا التاريخ أيضًا ظاهرة تستحق وقفة تربوية: **دورات التفاؤل المفرط ثم خيبة الأمل**، وقد مرّ الحقل
  بشتاءين اثنين على الأقل تراجع فيهما التمويل والاهتمام بعد وعود لم تتحقق. ومعرفة هذه الدورات تحصّن الطالب
  من الانبهار السريع ومن الرفض السريع معًا، وتمنحه معيارًا لقراءة الوعود الحالية.
estimated_duration: "5 حصص × 90 دقيقة"
difficulty: مبتدئ
keywords: [تاريخ الذكاء الاصطناعي, تورينغ, Dartmouth, الذكاء الرمزي, البيرسبترون, الأنظمة الخبيرة, شتاء الذكاء الاصطناعي, التعلم الإحصائي, التعلم العميق, ImageNet, AlexNet, الانتباه, المحوّل, النماذج التأسيسية]
concept_diagram: m02_concept_map
objectives:
  - {bloom: remember, text: "يعدّد المحطات الكبرى في تاريخ الذكاء الاصطناعي بترتيبها الزمني الصحيح."}
  - {bloom: understand, text: "يشرح لكل مرحلة المشكلة السائدة والمنهج المستعمل وأسباب نجاحه وحدوده."}
  - {bloom: understand, text: "يفسّر أسباب شتاءي الذكاء الاصطناعي ودور الوعود المفرطة في نشأتهما."}
  - {bloom: apply, text: "يصنّف نظامًا أو منهجًا معينًا ضمن المرحلة والمقاربة التي ينتمي إليها (رمزية، اتصالية، إحصائية، عميقة، توليدية)."}
  - {bloom: analyze, text: "يحلل الانتقال من مرحلة إلى أخرى بوصفه استجابة لحدود منهجية لا مجرد تقدم تقني."}
  - {bloom: evaluate, text: "يقيّم وعودًا معاصرة عن الذكاء الاصطناعي في ضوء الدروس التاريخية لدورات التفاؤل والخيبة."}
prerequisites:
  - المحاضرة 1.1 (تعريفات الذكاء الاصطناعي والمقاربات الأربع).
  - المحاضرة 1.3 (فروع الحقل ومناهجه).
entry:
  prior_knowledge:
    - "يعرف الطالب من المحور 1 أن الذكاء الاصطناعي حقل له مقاربات متعددة؛ يبين هذا المحور أن هذه المقاربات لم تظهر معًا بل تعاقبت تاريخيًا."
    - "يعرف من المحاضرة 1.3 الفرق بين الأنظمة القائمة على القواعد والأنظمة المتعلمة من البيانات؛ يشرح هذا المحور كيف انتقل الحقل من الأولى إلى الثانية ولماذا."
    - "لدى الطالب انطباع أن الذكاء الاصطناعي ظاهرة حديثة جدًا (المفهوم الخاطئ في المحاضرة 1.5)؛ يصحح هذا المحور ذلك الانطباع بالوثائق والتواريخ."
  diagnostic_questions:
    - في أي عقد تعتقد أن مصطلح «الذكاء الاصطناعي» ظهر لأول مرة؟ وما الذي يجعلك تقدّر هذا التاريخ؟
    - هل تعتقد أن الشبكات العصبية فكرة حديثة؟ متى ظهرت في تقديرك؟
    - لماذا في رأيك تأخر ظهور الأنظمة القوية الحالية إذا كانت الأفكار الأساسية قديمة؟
    - هل مرّ الذكاء الاصطناعي بفترات تراجع؟ ما الذي يمكن أن يسبب تراجعًا في حقل علمي؟
exit:
  competencies:
    - أستطيع أن أرتب المحطات الكبرى في تاريخ الذكاء الاصطناعي وأحدد عقد كل منها.
    - أستطيع أن أشرح لكل مرحلة مشكلتها ومنهجها وسبب نجاحه وحدوده.
    - أستطيع أن أفسّر شتاءي الذكاء الاصطناعي بأسبابهما لا بأعراضهما فقط.
    - أستطيع أن أصنف نظامًا ضمن مقاربته (رمزية، اتصالية، إحصائية، عميقة، توليدية).
    - أستطيع أن أقرأ وعدًا معاصرًا عن الذكاء الاصطناعي قراءة نقدية مستندة إلى التاريخ.
  assessment_activities:
    - "اختبار بعدي متعدد الأنماط مع أسئلة سيناريو تاريخية."
    - "نشاط ترتيب زمني: 15 بطاقة محطات تُرتب في مجموعات، ثم تُبرر كل مجموعة ترتيبها شفهيًا."
    - "ورقة قصيرة (صفحة): «اختر مرحلة وحلّلها بالأسئلة الخمسة»."
    - "تحليل نص تاريخي: مقتطف من مقترح Dartmouth أو من تقرير Lighthill، مع أسئلة توجيهية."
    - "مناظرة: «هل نعيش اليوم دورة تفاؤل ستعقبها خيبة؟»"
  common_mistakes:
    - الاعتقاد بأن الذكاء الاصطناعي بدأ مع المساعدات الحوارية الحديثة.
    - الاعتقاد بأن الشبكات العصبية اختراع حديث، بينما ترجع أصولها إلى سنة 1943.
    - تصور تاريخ الحقل خطًا صاعدًا متصلًا، وتجاهل فترات التراجع.
    - الخلط بين اختبار تورينغ بوصفه اقتراحًا فلسفيًا وبين كونه معيارًا تقنيًا معتمدًا.
    - عزو نجاح التعلم العميق إلى الخوارزميات وحدها دون البيانات والعتاد.
  remediation:
    - إذا اختلط عليك الترتيب الزمني، استعمل الخط الزمني التفاعلي في المحاضرة 2.1 وصفّ المحطات حسب المقاربة لا حسب السنة فقط.
    - إذا لم تتضح أسباب الشتاء الأول، أعد قراءة قسم تقرير Lighthill في المحاضرة 2.2 وحدد ثلاث حجج وردت فيه.
    - إذا صعب عليك التمييز بين المقاربات، استعمل مختبر «صنّف المنهج» وحاول بلوغ 8 من 10.
    - إذا بقي دور البيانات والعتاد غامضًا، راجع جدول العوامل الثلاثة في المحاضرة 2.4 واكتب لكل عامل ما الذي كان سيحدث لو غاب.
    - شاهد فيلم AlphaGo الوثائقي ثم اربط ما رأيته بمرحلة التعلم المعزز في المحاضرة 2.5.
  suggested_reading: [m02_dartmouth_1955, m02_lighthill_1973, m02_rumelhart_1986, m02_krizhevsky_2012, m02_vaswani_2017]
  bridge: |
    انتهينا من رسم مسار الحقل من 1943 إلى اليوم، ورأينا كيف تعاقبت المقاربات الرمزية والاتصالية والإحصائية والعميقة.
    وفي كل مرحلة تكرر سؤال ضمني: **ما نوع الذكاء الذي بلغناه فعلًا؟** هل هو ذكاء في مهمة واحدة، أم ذكاء عام؟
    هذا بالضبط موضوع **المحور 3**: تصنيف أنواع الذكاء الاصطناعي حسب القدرة (الضيق والعام والفائق)، وتمييز مفاهيم
    كثيرًا ما تُخلط: القدرة والذكاء والاستقلالية والوكالة والتكيف والتعميم.
instructor:
  sequence:
    - "ابدأ بالخط الزمني التفاعلي معروضًا على الشاشة طوال الحصة: يعود إليه الطلبة كلما ذُكرت محطة."
    - "درّس المحاضرات بالترتيب الزمني (2.1 ← 2.5)؛ التسلسل السببي هنا هو جوهر الدرس."
    - "في نهاية كل مرحلة، املأ مع الطلبة جدول الأسئلة الخمسة على السبورة قبل الانتقال."
    - "احتفظ بنشاط «وعود اليوم» للحصة الأخيرة، فهو يجمع دروس المحور كلها."
  timing:
    - "الحصة 1 (90 د): الأسئلة التشخيصية (10 د) + المحاضرة 2.1 (65 د) + جدول الأسئلة الخمسة (15 د)."
    - "الحصة 2 (90 د): المحاضرة 2.2 مع تحليل مقتطف من تقرير Lighthill (20 د)."
    - "الحصة 3 (90 د): المحاضرة 2.3 مع نشاط مقارنة الأنظمة الخبيرة بالتعلم الإحصائي."
    - "الحصة 4 (90 د): المحاضرة 2.4 مع مختبر ترتيب المحطات."
    - "الحصة 5 (90 د): المحاضرة 2.5 + الاختبار البعدي (20 د) + مناظرة «وعود اليوم» (20 د)."
    - "في حصة قصيرة (60 د): ادمج 2.2 و2.3 في «عصر الرموز والشتاءان»، واحتفظ بالخط الزمني كاملًا."
  discussion:
    - "لو كنت عضوًا في لجنة تمويل سنة 1973، وقرأت تقرير Lighthill، هل كنت ستوقف التمويل؟ وبأي شروط؟"
    - "ما الذي يجعل وعدًا علميًا «مفرطًا»؟ وكيف نميز بين طموح بحثي مشروع ووعد غير قابل للتحقق؟"
    - "هل يمكن أن يتكرر شتاء ثالث؟ ما المؤشرات التي قد تنذر به؟"
    - "لماذا نجحت فكرة الشبكات العصبية بعد 70 سنة من طرحها الأول ولم تنجح قبل ذلك؟"
  assessment_ideas:
    - "اطلب من كل طالب «بطاقة مرحلة»: المشكلة، المنهج، نجاح، حد، سبب الانتقال، في صفحة واحدة."
    - "سؤال مقالي: «الانتقال من الأنظمة الخبيرة إلى التعلم الإحصائي لم يكن تقدمًا تقنيًا فقط بل تغيرًا في تعريف المشكلة». ناقش."
    - "تمرين تصحيح: قدّم للطلبة نصًا تاريخيًا فيه خمسة أخطاء في التواريخ والأسماء واطلب تصحيحها بالمصادر."
  extensions:
    - "قراءة مقترح Dartmouth الأصلي (1955) ومناقشة الجملة التي تفترض أن كل جوانب الذكاء يمكن وصفها بدقة تكفي لمحاكاتها."
    - "قراءة Searle (1980) «Minds, brains, and programs» ومناقشة حجة الغرفة الصينية وردود الفعل عليها."
    - "مقارنة AlphaGo (2016) بـ AlphaZero (2018) من حيث الاعتماد على الخبرة البشرية مقابل التعلم الذاتي."
