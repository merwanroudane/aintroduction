entry:
  - id: m02-e01
    type: mcq
    bloom: remember
    prompt: "في أي عقد ظهر مصطلح «الذكاء الاصطناعي» (Artificial Intelligence) لأول مرة؟"
    options: ["خمسينيات القرن العشرين", "ثمانينيات القرن العشرين", "العقد الأول من الألفية الثالثة", "العقد الثاني من الألفية الثالثة"]
    answer: 0
    explanation: "صيغ المصطلح في مقترح ورشة Dartmouth سنة 1955، وعُقدت الورشة صيف 1956."
    review: m02-l01
  - id: m02-e02
    type: tf
    bloom: remember
    prompt: "فكرة الشبكات العصبية الاصطناعية ظهرت بعد سنة 2000."
    answer: false
    explanation: "أول نموذج رياضي لخلية عصبية اصطناعية نشره McCulloch و Pitts سنة 1943، والبيرسبترون سنة 1958."
    review: m02-l01
  - id: m02-e03
    type: mcq
    bloom: understand
    prompt: "ما المقصود بأن مسألة ما تعاني «انفجارًا أسّيًا» في فضاء البحث؟"
    options:
      - "أن الحاسوب يسخن أثناء الحساب."
      - "أن عدد الحالات الممكنة ينمو نموًا أسيًا مع عمق البحث، فيستحيل استكشافها كلها."
      - "أن البيانات تحتوي أخطاء كثيرة."
      - "أن البرنامج يحتوي أخطاء برمجية."
    answer: 1
    explanation: "مع معامل تفرع b وعمق d يكون عدد المسارات من رتبة b^d، وهو ما يفسد التوسع إلى المسائل الواقعية."
    review: m02-l02
  - id: m02-e04
    type: tf
    bloom: understand
    prompt: "مرّ حقل الذكاء الاصطناعي بفترات تراجع حاد في التمويل والاهتمام."
    answer: true
    explanation: "تُعرف بشتاءي الذكاء الاصطناعي: الأول في منتصف السبعينيات والثاني في نهاية الثمانينيات ومطلع التسعينيات."
    review: m02-l02
  - id: m02-e05
    type: mcq
    bloom: understand
    prompt: "ما الفرق الجوهري بين نظام خبير ونظام تعلم آلي؟"
    options:
      - "الأول أسرع من الثاني."
      - "الأول يعتمد على قواعد يكتبها خبراء صراحة، والثاني يستنتج الأنماط من البيانات."
      - "الثاني لا يحتاج إلى حاسوب."
      - "لا فرق بينهما."
    answer: 1
    explanation: "مصدر المعرفة هو الفرق: خبير يصوغ القواعد في الأول، وبيانات تُقدَّر منها الدالة في الثاني."
    review: m02-l03

questions:
  - id: m02-q01
    type: mcq
    bloom: remember
    prompt: "من قدّم أول نموذج رياضي لخلية عصبية اصطناعية، وفي أي سنة؟"
    options: ["Rosenblatt سنة 1958", "McCulloch و Pitts سنة 1943", "Turing سنة 1950", "Rumelhart و Hinton سنة 1986"]
    answer: 1
    explanation: "ورقة «A logical calculus of the ideas immanent in nervous activity» سنة 1943: مجموع موزون مع عتبة."
    why_wrong:
      0: "Rosenblatt قدّم البيرسبترون سنة 1958، وهو نموذج **يتعلم** الأوزان، ولكنه بُني على فكرة 1943."
      3: "ورقة 1986 قدّمت الانتشار العكسي لتدريب الشبكات متعددة الطبقات."
    review: m02-l01
  - id: m02-q02
    type: mcq
    bloom: understand
    prompt: "لماذا اقترح تورينغ سنة 1950 استبدال سؤال «هل تستطيع الآلات أن تفكر؟»؟"
    options:
      - "لأنه كان متأكدًا أن الآلات لا تفكر."
      - "لأن السؤال غامض لتعدد معاني «آلة» و«تفكر»، فاقترح معيارًا سلوكيًا قابلًا للاختبار."
      - "لأن الحواسيب لم تكن موجودة بعد."
      - "لأن الفلاسفة منعوه من طرح السؤال."
    answer: 1
    explanation: "تحويل منهجي من سؤال فلسفي غير قابل للحسم إلى إجراء تجريبي هو لعبة المحاكاة."
    review: m02-l01
  - id: m02-q03
    type: scenario
    bloom: analyze
    scenario: "برنامج يحل ألغاز الأباريق ومسائل الجبر المدرسية بكفاءة عالية سنة 1970، لكنه يفشل تمامًا حين يُطلب منه التخطيط لتوزيع بضائع على مدينة كاملة."
    prompt: "ما التفسير البنيوي لهذا الفشل؟"
    options:
      - "البرنامج مكتوب بلغة برمجة قديمة."
      - "الانفجار الأسّي: فضاء الحالات في المسألة الواقعية أكبر بمراحل من أن يُستكشف."
      - "البرنامج لم يتصل بالإنترنت."
      - "المسألة الثانية أسهل لكن البرنامج لم يُختبر عليها."
    answer: 1
    explanation: "هذه حجة تقرير Lighthill نفسها: النتائج المخبرية على مسائل صغيرة لا تتوسع."
    why_wrong: {0: "المشكلة في المنهج لا في لغة البرمجة؛ فالنمو الأسّي يفسد أي تنفيذ مهما كان سريعًا."}
    review: m02-l02
  - id: m02-q04
    type: mcq
    bloom: understand
    prompt: "ما الذي بيّنه كتاب Perceptrons لـ Minsky و Papert سنة 1969؟"
    options:
      - "أن الشبكات العصبية لا فائدة منها إطلاقًا."
      - "أن البيرسبترون أحادي الطبقة لا يستطيع تمثيل دوال غير قابلة للفصل خطيًا مثل XOR."
      - "أن الحواسيب لن تتطور."
      - "أن التعلم العميق هو المستقبل."
    answer: 1
    explanation: "نتيجة رياضية دقيقة عن حدود نموذج محدد؛ والحل النظري (طبقة خفية) كان معروفًا لكن تدريبه لم يكن عمليًا بعد."
    why_wrong: {0: "الكتاب قدّم نتيجة محدودة النطاق، لكن تلقيها في سياق تنافس على التمويل وسّع أثرها."}
    review: m02-l02
  - id: m02-q05
    type: multi
    bloom: analyze
    prompt: "أي الأسباب التالية أسهمت في تراجع الأنظمة الخبيرة في نهاية الثمانينيات؟ (اختر كل ما ينطبق)"
    options:
      - "صعوبة استخراج المعرفة من الخبراء وصياغتها في قواعد (عنق زجاجة المعرفة)."
      - "كلفة صيانة آلاف القواعد المتشابكة والمتعارضة."
      - "الهشاشة خارج نطاق القواعد دون إدراك النظام لخروجه عن نطاقه."
      - "أن هذه الأنظمة لم تحقق أي فائدة اقتصادية على الإطلاق."
    answer: [0, 1, 2]
    explanation: "الأسباب بنيوية تتعلق بنموذج التوسع، لا بانعدام الفائدة."
    why_wrong: {3: "بعضها حقق عائدًا اقتصاديًا حقيقيًا مثل XCON؛ ما فشل هو قابلية التوسع لا الفكرة كليًا."}
    review: m02-l03
  - id: m02-q06
    type: mcq
    bloom: understand
    prompt: "ما الإسهام المفاهيمي الأهم لورقة الانتشار العكسي سنة 1986؟"
    options:
      - "اختراع الحاسوب المتوازي."
      - "طريقة عملية لتدريب الشبكات متعددة الطبقات، تجعل الطبقات الخفية **تتعلم التمثيلات** بنفسها."
      - "إثبات أن الشبكات العصبية عديمة الفائدة."
      - "تصميم أول نظام خبير."
    answer: 1
    explanation: "عنوان الورقة نفسه: «Learning representations by back-propagating errors»؛ الشبكة تكتشف السمات الوسيطة."
    review: m02-l03
  - id: m02-q07
    type: multi
    bloom: analyze
    prompt: "أي العوامل كانت ضرورية مجتمعة لانفجار التعلم العميق بعد 2012؟ (اختر كل ما ينطبق)"
    options:
      - "بيانات ضخمة موسومة مثل ImageNet."
      - "وحدات المعالجة الرسومية (GPU) التي تتيح الحساب المتوازي."
      - "تحسينات خوارزمية في التدريب (دوال تنشيط وتنظيم ومحسّنات أفضل)."
      - "اكتشاف مبدأ رياضي جديد كليًا لم يكن معروفًا قبل 2010."
    answer: [0, 1, 2]
    explanation: "المبادئ الأساسية كانت معروفة منذ 1943 و1986؛ الجديد هو نضج البنية التحتية."
    why_wrong: {3: "لم يكن هناك مبدأ جديد كليًا؛ AlexNet بُني على أفكار قائمة بحجم وظروف مختلفة."}
    review: m02-l04
  - id: m02-q08
    type: mcq
    bloom: evaluate
    prompt: "لماذا يُعد بناء قاعدة ImageNet إسهامًا علميًا كبيرًا وليس مجرد جمع ملفات؟"
    options:
      - "لأنها كانت أول قاعدة بيانات في التاريخ."
      - "لأنها وفّرت معيار تقييم مشتركًا جعل التقدم قابلًا للقياس والمقارنة بين الفرق، وهو شرط ضروري للتعلم الموجَّه بحجم كبير."
      - "لأنها كانت مجانية."
      - "لأنها احتوت صورًا جميلة."
    answer: 1
    explanation: "المعيار المشترك يحوّل الجدل إلى قياس؛ وهذا كثيرًا ما يسرّع الحقل أكثر من خوارزمية جديدة."
    review: m02-l04
  - id: m02-q09
    type: scenario
    bloom: analyze
    scenario: "في الترجمة العصبية قبل 2014، كانت الشبكة تضغط الجملة المصدر كلها في متجه واحد ثابت الطول قبل توليد الترجمة، وكان الأداء يسوء كلما طالت الجملة."
    prompt: "كيف عالجت آلية الانتباه هذه المشكلة؟"
    options:
      - "بزيادة طول المتجه الثابت فقط."
      - "بالسماح للنموذج بالنظر إلى كل تمثيلات كلمات المدخل عند توليد كل كلمة، بأوزان تحدد أهمية كل كلمة."
      - "بترجمة كلمة بكلمة دون سياق."
      - "بحذف الكلمات الطويلة من الجملة."
    answer: 1
    explanation: "Bahdanau et al. (2014): حلّ اختناق المعلومات وتعلّم المحاذاة والترجمة معًا."
    review: m02-l05
  - id: m02-q10
    type: mcq
    bloom: evaluate
    prompt: "لماذا كان الاستغناء عن البنية التكرارية في المحوّل (2017) شرطًا عمليًا لبناء النماذج اللغوية الضخمة؟"
    options:
      - "لأن الانتباه أرخص في الذاكرة دائمًا."
      - "لأن معالجة كل الرموز بالتوازي تستفيد من العتاد المتوازي، فيصبح التدريب على مدونات ضخمة ممكنًا: التوازي شرط التوسع."
      - "لأن الشبكات التكرارية لا تعمل على النصوص."
      - "لأن المحوّل لا يحتاج إلى بيانات."
    answer: 1
    explanation: "التسلسل يمنع التوازي؛ والمحوّل يحسب العلاقات دفعة واحدة، فينخفض زمن التدريب ويصبح التوسع ممكنًا."
    why_wrong: {0: "الانتباه الذاتي مكلف في الذاكرة مع طول التسلسل؛ الميزة الحاسمة هي التوازي."}
    review: m02-l05
  - id: m02-q11
    type: mcq
    bloom: evaluate
    prompt: "قرأت عنوانًا يقول: «نظام جديد تفوّق على البشر في اختبار معياري، إذن الذكاء العام صار قريبًا». ما الخطأ المنهجي؟"
    options:
      - "لا خطأ، الاستنتاج سليم."
      - "مغالطة الاستمرارية: التقدم في مهمة محددة لا يقع بالضرورة على مسار متصل نحو الذكاء العام، كما بيّن تاريخ الحقل."
      - "الخطأ أن الاختبار المعياري لا قيمة له إطلاقًا."
      - "الخطأ الوحيد هو أن العنوان قصير."
    answer: 1
    explanation: "Deep Blue في الشطرنج 1997 وImageNet لم ينقلا الحقل إلى الحس السليم؛ القدرات مجزأة ولا تتجمع تلقائيًا."
    review: m02-l05
