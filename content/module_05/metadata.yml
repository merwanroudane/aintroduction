module_number: 5
title: "المفاهيم الأساسية في هندسة الأوامر (Prompt Engineering)"
short_title: هندسة الأوامر
title_en: "Foundations of Prompt Engineering"
subtitle: ليست «اكتب سؤالًا واضحًا»، بل بناء سياق منظم يحدد المهمة والمعايير وشكل المخرج ويُحسَّن تكراريًا.
description: |
  تُختزل هندسة الأوامر (Prompt Engineering) في النصائح الشائعة إلى عبارة واحدة: «اكتب سؤالًا واضحًا».
  وهذا اختزال يفقدها قيمتها العلمية. فالأمر (Prompt) ليس سؤالًا، بل **السياق الكامل** الذي يشتق منه النموذج
  توزيع احتمالات الكلمة التالية. وكل عنصر نضيفه إلى هذا السياق يزيح ذلك التوزيع في اتجاه معين. ومن هنا
  نستمد مبدأ المحور كله: **لا نتعلم حيلًا، بل نفهم لماذا تعمل كل حيلة**.

  نبدأ بتفكيك الأمر إلى **مكوناته التسعة** (الدور، والمهمة، والسياق، والمدخل، والقيود، والأمثلة، وشكل المخرج،
  والجمهور، ومعيار النجاح)، ثم ننتقل إلى **تقنيات التوجيه** بأمثلة قليلة أو بلا أمثلة وإلى الفواصل والبنية.
  ثم ندرس **التحسين التكراري** بوصفه منهجًا لا محاولة عشوائية: كيف نبدأ بمعيار نجاح، ونغيّر عنصرًا واحدًا
  في كل دورة، ونقيس الأثر.

  ونغلق المحور بما تغفله أغلب الدورات: **حدود هندسة الأوامر**. فالأمر الجيد يقلل الأخطاء ولا يلغيها، ولا
  يضيف معرفة لا يملكها النموذج، ولا يمنع الهلوسة. ومعرفة هذه الحدود هي ما يميز الاستعمال المهني من الاستعمال
  الساذج، وهي التي تفتح الباب إلى الاسترجاع المعزز والضبط الدقيق في المحور 7.
estimated_duration: "5 حصص × 90 دقيقة"
difficulty: مبتدئ
keywords: [هندسة الأوامر, Prompt Engineering, الأمر, المكونات التسعة, الدور, السياق, القيود, شكل المخرج, بلا أمثلة, أمثلة قليلة, Zero-shot, Few-shot, الفواصل, التحسين التكراري, قوالب الأوامر, معيار النجاح]
concept_diagram: m05_concept_map
objectives:
  - {bloom: remember, text: "يعرّف الأمر (Prompt) وهندسة الأوامر ويعدد المكونات التسعة للأمر المنظم."}
  - {bloom: understand, text: "يشرح لماذا تعمل كل تقنية بالرجوع إلى آلية التنبؤ بالرمز التالي وتأثير السياق."}
  - {bloom: understand, text: "يميز بين التوجيه بلا أمثلة وبمثال واحد وبأمثلة قليلة، ويحدد متى يفيد كل منها."}
  - {bloom: apply, text: "يحوّل أمرًا ضعيفًا إلى أمر منظم مكتمل المكونات لمهمة أكاديمية أو مهنية."}
  - {bloom: analyze, text: "يحلل سبب فشل أمر معين ويحدد المكوّن الناقص المسؤول عن الفشل."}
  - {bloom: evaluate, text: "يقيّم أمرًا وفق قائمة تحقق بنيوية ويقارن نسختين منه على مجموعة اختبار ثابتة."}
  - {bloom: create, text: "يبني قالب أوامر قابلًا لإعادة الاستعمال في تخصصه مع تعليمات استعماله وحدوده."}
prerequisites:
  - المحاضرة 1.5 (الطلاقة ليست فهمًا، والمخرجات ليست صحيحة دائمًا).
  - يُفضَّل تقديم المحاضرة 7.1 (آلية التنبؤ بالرمز التالي) قبل هذا المحور، أو عرض ملخصها في مقدمة الحصة الأولى.
entry:
  prior_knowledge:
    - "استعمل أغلب الطلبة مساعدًا حواريًا فعلًا، ولديهم حدس عملي عن «ما ينفع»؛ ينطلق المحور من هذا الحدس ويحوّله إلى مبادئ قابلة للتفسير والقياس."
    - "يعرف الطالب من المحاضرة 1.5 أن الطلاقة لا تعني الصحة؛ يبني المحور على ذلك ليحدد ما تستطيع هندسة الأوامر إصلاحه وما لا تستطيعه."
    - "يعرف من المحاضرة 1.2 أن التوليد مخرجه ليس له إجابة صحيحة واحدة؛ ومن هنا تأتي ضرورة تحديد معيار النجاح في الأمر نفسه."
  diagnostic_questions:
    - اكتب أمرًا تطلب فيه من مساعد حواري تلخيص مقال علمي. احتفظ به وقارنه بما ستكتبه في نهاية المحور.
    - في تجربتك، ما الذي جعل إجابة مساعد حواري سيئة؟ هل كان سبب السوء في الأمر أم في النموذج؟
    - هل تعتقد أن إضافة عبارة «أنت خبير» في بداية الأمر تحسّن الإجابة؟ ولماذا؟
    - إذا طلبت من النموذج جدولًا فأعطاك فقرة، ما المكوّن الذي نسيته في أمرك؟
exit:
  competencies:
    - أستطيع أن أفكك أي أمر إلى مكوناته التسعة وأحدد الناقص منها.
    - أستطيع أن أشرح لماذا تعمل تقنية معينة استنادًا إلى أثر السياق على التوليد.
    - أستطيع أن أختار بين التوجيه بلا أمثلة وبأمثلة قليلة حسب طبيعة المهمة.
    - أستطيع أن أحسّن أمرًا تكراريًا بتغيير عنصر واحد في كل دورة وقياس الأثر.
    - أستطيع أن أبني قالب أوامر قابلًا لإعادة الاستعمال وأوثق حدوده.
    - أستطيع أن أحدد ما لا تستطيع هندسة الأوامر إصلاحه وأقترح البديل المناسب.
  assessment_activities:
    - "اختبار بعدي يجمع أسئلة مفاهيمية وسيناريوهات تحليل أوامر."
    - "تمرين تحويل: ثلاثة أوامر ضعيفة تُحوَّل إلى أوامر منظمة مع تعليل كل إضافة."
    - "تقييم أقران: كل طالب يقيّم أمر زميله بقائمة التحقق البنيوية ويقترح تحسينين."
    - "مشروع مصغر: بناء قالب أوامر لمهمة متكررة في التخصص، مع دليل استعمال من صفحة."
    - "تحليل فشل: يُعطى أمر ومخرج سيئ، ويُطلب تشخيص المكوّن المسؤول واقتراح الإصلاح."
  common_mistakes:
    - اعتبار هندسة الأوامر مجموعة عبارات سحرية تُحفظ وتُنسخ.
    - الاعتقاد بأن الأمر الأطول أفضل دائمًا.
    - الخلط بين وضوح الصياغة وتحديد معيار النجاح.
    - إضافة دور («أنت خبير») وتوقع أن يضيف ذلك معرفة لا يملكها النموذج.
    - تغيير عدة عناصر دفعة واحدة عند التحسين، فيستحيل معرفة سبب التحسن.
    - توقع أن يمنع الأمر الجيد الهلوسة منعًا تامًا.
  remediation:
    - إذا التبست المكونات، استعمل مختبر تشريح الأمر وابنِ أمرًا كاملًا للمهمة نفسها ثلاث مرات (المحاضرة 5.1).
    - إذا لم يتضح الفرق بين بلا أمثلة وبأمثلة قليلة، أعد جدول «متى يفيد كل منهما» وطبّقه على ثلاث مهام من تخصصك (المحاضرة 5.2).
    - إذا كان التحسين لديك عشوائيًا، طبّق دورة التحسين المنضبطة في المحاضرة 5.4 على أمر واحد وسجّل ثلاث دورات كاملة.
    - إذا بقيت حدود هندسة الأوامر غامضة، أعد قراءة جدول «ما الذي لا يصلحه الأمر» في المحاضرة 5.5 واكتب مثالًا لكل سطر.
    - راجع دليل المزوّد الرسمي الذي تستعمل أداته، وقارن توصياته بما درسته.
  suggested_reading: [m05_schulhoff_2024, m05_brown_2020, m05_anthropic_prompting, m05_google_prompting, m05_prompting_guide]
  bridge: |
    بنينا في هذا المحور أساس هندسة الأوامر: المكونات، والتقنيات الأساسية، والتحسين المنضبط، والحدود.
    لكن المهام الواقعية أعقد من أمر واحد: تحتاج إلى تفكيك المهمة إلى خطوات، وإلى مخرجات منظمة تُعالج برمجيًا،
    وإلى تقييد النموذج بمصادر محددة، وإلى الحماية من المحتوى غير الموثوق الذي قد يحمل تعليمات خبيثة.
    هذا هو موضوع **المحور 6**: تقنيات بناء الأوامر المتقدمة وأمنها.
instructor:
  sequence:
    - "ابدأ بجمع أوامر الطلبة الأولى (السؤال التشخيصي الأول) دون تصحيح؛ ستعود إليها في المحاضرة 5.5."
    - "5.1 (المكونات) أساس كل ما بعده: لا تختصرها."
    - "5.2 (التقنيات) و5.3 (البنية والفواصل) متلازمتان، ويمكن دمجهما في حصة واحدة عند الضرورة."
    - "5.4 (التحسين التكراري) هي المحاضرة الأهم عمليًا: خصص لها وقتًا كافيًا للتطبيق المباشر."
    - "5.5 (الحدود) في النهاية حتمًا، لأنها تمنع المبالغة التي قد تنشأ من نجاحات الحصص السابقة."
  timing:
    - "الحصة 1 (90 د): الأسئلة التشخيصية (10 د) + المحاضرة 5.1 (65 د) + مختبر التشريح (15 د)."
    - "الحصة 2 (90 د): المحاضرة 5.2 مع تطبيق على مهام من تخصص الطلبة."
    - "الحصة 3 (90 د): المحاضرة 5.3 مع تمرين الفواصل والبنية."
    - "الحصة 4 (90 د): المحاضرة 5.4 كاملة تطبيقًا في المختبر."
    - "الحصة 5 (90 د): المحاضرة 5.5 + مقارنة الأوامر الأولى بالأخيرة + الاختبار البعدي (20 د)."
    - "في حصة قصيرة (60 د): ادمج 5.2 و5.3، واحتفظ بـ5.1 و5.4 كاملتين فهما جوهر المحور."
  discussion:
    - "هل «هندسة الأوامر» مهارة ستبقى، أم أنها مرحلة مؤقتة ستزول مع تحسن النماذج؟ ما حجتك؟"
    - "من يتحمل مسؤولية مخرج سيئ: من كتب الأمر أم من بنى النموذج أم من استعمل المخرج؟"
    - "إذا كان الأمر الجيد يحسّن النتيجة، فهل هذا يعني أن النموذج «كان يعرف» الإجابة الأفضل ولم يقدمها؟"
    - "ما الفرق بين تحسين الأمر وبين التلاعب بالنموذج لتجاوز ضوابطه؟ أين الحد الأخلاقي؟"
  assessment_ideas:
    - "أعطِ مخرجًا سيئًا والأمر الذي أنتجه، واطلب تشخيص المكوّن الناقص واقتراح إصلاح محدد."
    - "اطلب بناء قالب أوامر لمهمة متكررة، وقيّمه بقائمة التحقق البنيوية أمام الصف."
    - "سؤال مقالي: «الأمر الأطول ليس الأفضل». ناقش بثلاث حجج وأمثلة مضادة."
    - "تمرين مقارنة: نسختان من أمر ومجموعة اختبار من خمس حالات؛ يُطلب حكم مبرر بأيهما أفضل ولماذا."
  extensions:
    - "قراءة تقرير Schulhoff وزملائه (2024) «The Prompt Report» ومناقشة تصنيفه لتقنيات التوجيه وحجم الأدبيات."
    - "مقارنة الأدلة الرسمية الثلاثة (OpenAI و Anthropic و Google): ما الذي تتفق عليه وما الذي تختلف فيه؟"
    - "قراءة Zhou وزملائه (2022) عن توليد الأوامر آليًا، ومناقشة ما يعنيه ذلك لمستقبل المهارة."
