entry:
  - id: m01-e01
    type: tf
    bloom: remember
    prompt: "مصطلح «الذكاء الاصطناعي» ظهر لأول مرة مع إطلاق المساعدات الحوارية الحديثة بعد سنة 2020."
    answer: false
    explanation: "صاغ John McCarthy المصطلح في مقترح ورشة Dartmouth سنة 1955. للحقل تاريخ يمتد سبعة عقود (المحور 2)."
    review: m01-l01
  - id: m01-e02
    type: mcq
    bloom: understand
    prompt: "ما الفرق الجوهري بين الآلة الحاسبة وتطبيق يتعلم من رسائلك السابقة تصنيف الرسائل المزعجة؟"
    options:
      - "الآلة الحاسبة أسرع."
      - "قواعد الآلة الحاسبة يكتبها المبرمج صراحة، أما التطبيق فيستنتج قواعده من البيانات."
      - "الآلة الحاسبة لا تستعمل الكهرباء."
      - "لا فرق، فكلاهما ذكاء اصطناعي بالدرجة نفسها."
    answer: 1
    explanation: "مصدر السلوك هو الفرق: قواعد صريحة مكتوبة في مقابل قواعد مستنتجة من الأمثلة (المحاضرة 1.2)."
    review: m01-l02
  - id: m01-e03
    type: multi
    bloom: understand
    prompt: "أيٌّ من الأنظمة التالية تستعمله يوميًا ويعتمد غالبًا على الذكاء الاصطناعي؟ (اختر كل ما ينطبق)"
    options:
      - "اقتراحات الفيديو في منصة مشاهدة."
      - "الترجمة الآلية لنص."
      - "مؤقت المطبخ الذي يرن بعد خمس دقائق."
      - "فتح الهاتف بالتعرف على الوجه."
    answer: [0, 1, 3]
    explanation: "التوصية والترجمة والتعرف على الوجه تعتمد على نماذج متعلمة. المؤقت يطبق قاعدة ثابتة بسيطة."
    why_wrong: {2: "المؤقت يطبق قاعدة زمنية ثابتة لا تتعلم ولا تستنتج شيئًا من المدخلات."}
    review: m01-l03
  - id: m01-e04
    type: tf
    bloom: understand
    prompt: "إذا كتب المساعد الحواري إجابة بلغة سليمة وواثقة، فهذا يضمن أنها صحيحة."
    answer: false
    explanation: "الطلاقة والثقة الظاهرة لا تضمنان الصحة؛ النماذج اللغوية قد تنتج معلومات خاطئة بصياغة مقنعة (المحاضرة 1.5)."
    review: m01-l05
  - id: m01-e05
    type: mcq
    bloom: remember
    prompt: "أي مما يلي أقرب إلى معنى «الخوارزمية» كما درسته سابقًا؟"
    options:
      - "جهاز حاسوب قوي."
      - "سلسلة خطوات محددة ومرتبة لحل مشكلة."
      - "قاعدة بيانات كبيرة."
      - "برنامج يتعلم دائمًا من البيانات."
    answer: 1
    explanation: "الخوارزمية سلسلة خطوات محددة. بعض الخوارزميات تتعلم من البيانات (التعلم الآلي) وأغلبها لا يتعلم."
    review: m01-l02

questions:
  - id: m01-q01
    type: mcq
    bloom: remember
    prompt: "وفق تصنيف Russell و Norvig، أي مقاربة يتبناها كتاب AIMA لتعريف الذكاء الاصطناعي؟"
    options: ["التفكير كالإنسان", "الفعل كالإنسان", "التفكير العقلاني", "الفعل العقلاني (الوكيل العقلاني)"]
    answer: 3
    explanation: "يتبنى الكتاب مقاربة الوكيل العقلاني: اختيار الفعل الذي يُتوقع أن يحقق أفضل نتيجة وفق مقياس أداء."
    why_wrong:
      1: "هذه مقاربة اختبار تورينغ، ويناقشها الكتاب لكنه لا يتبناها معيارًا."
      2: "التفكير العقلاني (قوانين الفكر) حالة خاصة من الفعل العقلاني."
    review: m01-l01
  - id: m01-q02
    type: mcq
    bloom: understand
    prompt: "ما العنصر الذي يجعل تعريف OECD لنظام الذكاء الاصطناعي تعريفًا «وظيفيًا» لا «تقنيًا»؟"
    options:
      - "أنه يشترط استعمال الشبكات العصبية."
      - "أنه يعرّف النظام بما يفعله (يستنتج من المدخلات كيف يولّد مخرجات مؤثرة) لا بالتقنية المستعملة."
      - "أنه يقتصر على الأنظمة التي تشبه الإنسان."
      - "أنه يستثني الأنظمة القائمة على القواعد."
    answer: 1
    explanation: "التعريف يركز على الوظيفة (الاستنتاج وتوليد تنبؤات أو محتوى أو توصيات أو قرارات)، فيبقى صالحًا مع تغير التقنيات."
    review: m01-l01
  - id: m01-q03
    type: scenario
    bloom: apply
    scenario: "تستعمل شركة نقل نظامًا يحسب كل صباح توزيع 60 شاحنة على 400 نقطة تسليم بأقل مسافة كلية، مع احترام أوقات الفتح."
    prompt: "ما الوظيفة الأساسية التي يؤديها هذا النظام؟"
    options: ["التوليد", "التحسين", "التصنيف", "التعرف على الوجوه"]
    answer: 1
    explanation: "البحث عن أفضل توزيع ضمن قيود هو تحسين (Optimization)."
    review: m01-l02
  - id: m01-q04
    type: multi
    bloom: analyze
    prompt: "أي العبارات التالية صحيحة بشأن العلاقة بين الأتمتة والتعزيز؟ (اختر كل ما ينطبق)"
    options:
      - "التعزيز يبقي الإنسان صاحب القرار في المهمة."
      - "نظام مصمم للتعزيز قد يتحول عمليًا إلى أتمتة إذا صار المستخدمون يقبلون مقترحاته دون مراجعة."
      - "الاختيار بين الأتمتة والتعزيز قرار تقني بحت لا علاقة له بالاقتصاد."
      - "يرى Brynjolfsson أن التركيز على تقليد الإنسان واستبداله قد يكون أقل نفعًا من تعزيز قدراته."
    answer: [0, 1, 3]
    explanation: "الأتمتة والتعزيز خياران تصميميان لهما آثار اقتصادية واجتماعية، والاستعمال الفعلي قد يغير الوظيفة (انحياز الأتمتة)."
    why_wrong: {2: "هو قرار تصميمي واقتصادي واجتماعي أيضًا (فخ تورينغ)."}
    review: m01-l02
  - id: m01-q05
    type: mcq
    bloom: analyze
    prompt: "لماذا يُعد تمثيل «التعلم الآلي» و«الرؤية الحاسوبية» فرعين متوازيين من المستوى نفسه تمثيلًا غير دقيق؟"
    options:
      - "لأن الرؤية الحاسوبية أقدم من الذكاء الاصطناعي."
      - "لأن الأول منهج والثاني مهمة، ونظم الرؤية الحديثة تستعمل التعلم الآلي."
      - "لأن التعلم الآلي لا يُستعمل في الصور."
      - "لأنهما المصطلح نفسه بلغتين."
    answer: 1
    explanation: "الفروع الموجهة بالمهمة (الرؤية، اللغة، الكلام) تستعمل مناهج أفقية كالتعلم الآلي؛ العلاقة تقاطع لا تواز."
    review: m01-l03
  - id: m01-q06
    type: scenario
    bloom: evaluate
    scenario: "خوارزمية صحية تتنبأ بدقة عالية بالتكاليف العلاجية المستقبلية للمرضى، وتستعملها المستشفى لتحديد من يستفيد من برنامج رعاية إضافية."
    prompt: "ما التقييم الأصح لاستعمال هذه الخوارزمية؟"
    options:
      - "استعمال سليم ما دامت الدقة عالية."
      - "قد يكون منحازًا لأن التكلفة مؤشر بديل للاحتياج الصحي، وقد تعكس فروقًا تاريخية في الوصول إلى الرعاية."
      - "غير سليم لأن الخوارزميات لا تصلح أبدًا للصحة."
      - "سليم لأن التكاليف بيانات موضوعية."
    answer: 1
    explanation: "هذه حالة Obermeyer et al. (2019): الدقة في التنبؤ بمتغير بديل منحاز تنتج قرارات منحازة (تحيز القياس)."
    why_wrong:
      0: "الدقة في التنبؤ بالمتغير الخطأ لا تعني قرارًا صحيحًا."
      3: "البيانات «الموضوعية» قد تحمل تحيزًا تاريخيًا في الإنفاق."
    review: m01-l04
  - id: m01-q07
    type: tf
    bloom: understand
    prompt: "حصول AlphaFold على دقة عالية في التنبؤ ببنية البروتينات يعني أنه لم يعد هناك حاجة إلى التحقق التجريبي."
    answer: false
    explanation: "التنبؤات فرضيات قوية توجه التجارب؛ بعض البنى أقل دقة، والتحقق التجريبي يبقى ضروريًا في البحوث الحساسة."
    review: m01-l04
  - id: m01-q08
    type: mcq
    bloom: evaluate
    prompt: "أظهرت دراسة ميدانية أن مساعدًا توليديًا رفع إنتاجية موظفي خدمة العملاء في المتوسط. ما الاستنتاج الأكثر دقة؟"
    options:
      - "سيرفع الذكاء التوليدي إنتاجية كل العاملين في كل المهن بالنسبة نفسها."
      - "الأثر حقيقي في هذا السياق، لكنه كان غير متجانس (أكبر للأقل خبرة)، ولا يُعمم آليًا على مهن أخرى."
      - "الدراسة لا قيمة لها لأنها لم تشمل كل المهن."
      - "الإنتاجية ارتفعت لأن الموظفين عملوا ساعات أكثر."
    answer: 1
    explanation: "Brynjolfsson, Li & Raymond (2025): أثر متوسط موجب مع تفاوت كبير حسب الخبرة. التعميم يحتاج إلى أدلة في سياقات أخرى."
    review: m01-l04
  - id: m01-q09
    type: multi
    bloom: analyze
    prompt: "أي العبارات التالية تمثل مفاهيم خاطئة عن الذكاء الاصطناعي؟ (اختر كل ما ينطبق)"
    options:
      - "النموذج الأكبر أفضل دائمًا في كل المهام."
      - "الاستقلالية في أنظمة الذكاء الاصطناعي درجات يحددها التصميم."
      - "المخرجات صحيحة ما دامت الصياغة واثقة."
      - "كل روبوت صناعي هو بالضرورة نظام ذكاء اصطناعي."
    answer: [0, 2, 3]
    explanation: "العبارة الثانية صحيحة؛ الثلاث الأخرى مفاهيم خاطئة عولجت في المحاضرة 1.5."
    why_wrong: {1: "هذه عبارة صحيحة وليست مفهومًا خاطئًا، وتوافق تعريف OECD."}
    review: m01-l05
  - id: m01-q10
    type: scenario
    bloom: create
    scenario: "طُلب منك اقتراح نظام يصنف رسائل الطلبة في أربع فئات ويوجهها إلى المصالح المختصة، مع حماية بياناتهم."
    prompt: "أي تصميم هو الأنسب انطلاقًا من مفاهيم المحور؟"
    options:
      - "أكبر نموذج لغوي متاح عبر خدمة سحابية، يرسل الردود آليًا دون مراجعة."
      - "نموذج أصغر متخصص يُشغَّل محليًا، يُقيَّم على عينة مصنفة، وتُراجع الحالات منخفضة الثقة بشريًا."
      - "قواعد يدوية فقط لأن الذكاء الاصطناعي لا يصلح للنصوص."
      - "لا حاجة إلى تقييم لأن المهمة بسيطة."
    answer: 1
    explanation: "المهمة ضيقة، والخصوصية مهمة، والتحقق والرقابة البشرية ضروريان: الأفضل نسبي للمهمة والقيود لا للحجم."
    review: m01-l05
