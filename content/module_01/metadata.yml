module_number: 1
title: "مقدمة في الذكاء الاصطناعي: المفهوم، الأهمية، والمجالات"
short_title: مقدمة في الذكاء الاصطناعي
title_en: "Introduction to AI: Concept, Importance and Fields"
subtitle: يؤسس هذا المحور للغة المقرر كله، فيحدد ماذا نعني بالذكاء الاصطناعي، ولماذا نستخدمه، وأين يُستخدم، وما الذي لا يستطيعه.
description: |
  يفتتح هذا المحور المقرر بسؤال يبدو بسيطًا ولكنه من أصعب أسئلة الحقل: **ما الذكاء الاصطناعي (Artificial Intelligence)؟**
  لا يوجد تعريف واحد متفق عليه، وليس ذلك نقصًا في العلم، بل نتيجة لاختلاف الغايات: فهناك من يريد آلة
  *تفكر كالإنسان*، ومن يريد آلة *تتصرف بعقلانية*، ومن يكتفي بنظام *يحقق أهدافًا محددة في بيئة معينة*.
  لذلك نبدأ بتفكيك مفهوم الذكاء نفسه إلى قدرات (الإدراك، والاستدلال، والتعلم، والتخطيط، واللغة، واتخاذ القرار)
  قبل أن نعرض التعريفات الأكاديمية والمؤسسية الكبرى.

  ثم ينتقل المحور من سؤال «ما هو؟» إلى سؤال «لماذا؟»: ما الوظائف التي يؤديها الذكاء الاصطناعي فعليًا
  (الأتمتة، والتعزيز، والتنبؤ، والتصنيف، والتوليد، والتحسين، ودعم القرار، والتعرف على الأنماط)،
  ثم إلى سؤال «أين؟»: خريطة فروع الحقل ومجالات تطبيقه في التعليم والطب والاقتصاد والمالية والصناعة والنقل والتجارة والبحث العلمي والإدارة العمومية.

  ويُختم المحور بتفكيك **المفاهيم الخاطئة** الأكثر انتشارًا، لأن الطالب يدخل المقرر بصورة ذهنية صنعتها
  السينما والإعلام وتجربته اليومية مع المساعدات الحوارية. هذا التفكيك ليس ترفًا، بل هو شرط لفهم بقية المحاور،
  وهو أول خطوة في بناء ما تسميه UNESCO **الكفاءة في الذكاء الاصطناعي (AI competency)**.
estimated_duration: "5 حصص × 90 دقيقة"
difficulty: مبتدئ
keywords: [الذكاء الاصطناعي, الذكاء, التعريفات الأربعة, الوكيل العقلاني, الأتمتة, التعزيز, فروع الذكاء الاصطناعي, تطبيقات الذكاء الاصطناعي, المفاهيم الخاطئة, النماذج التأسيسية, نظام الذكاء الاصطناعي]
concept_diagram: m01_concept_map
objectives:
  - {bloom: remember, text: "يعرّف الذكاء الاصطناعي وفق المقاربات الأربع (التفكير الإنساني، الفعل الإنساني، التفكير العقلاني، الفعل العقلاني) ووفق تعريف OECD لنظام الذكاء الاصطناعي."}
  - {bloom: understand, text: "يشرح لماذا يصعب وضع تعريف واحد للذكاء الاصطناعي، ويميز بين الذكاء البشري وقدرة الآلة على أداء مهمة."}
  - {bloom: understand, text: "يفسّر الوظائف الثماني للذكاء الاصطناعي (الأتمتة، التعزيز، التنبؤ، التصنيف، التوليد، التحسين، دعم القرار، التعرف على الأنماط) بأمثلة."}
  - {bloom: apply, text: "يصنّف أنظمة واقعية حسب الفرع (معالجة اللغة، الرؤية الحاسوبية، الروبوتات…) والوظيفة التي تؤديها."}
  - {bloom: analyze, text: "يحلل تطبيقًا حقيقيًا للذكاء الاصطناعي في قطاع معين من حيث البيانات والمخرجات والفوائد والمخاطر."}
  - {bloom: evaluate, text: "يقيّم ادعاءات شائعة عن الذكاء الاصطناعي ويحكم على صحتها بالاستناد إلى المفاهيم الدقيقة."}
  - {bloom: create, text: "يبني خريطة مفاهيمية شخصية تربط تعريف الذكاء الاصطناعي بفروعه ووظائفه ومجالات تطبيقه في تخصصه."}
prerequisites:
  - لا يتطلب المحور معرفة برمجية أو رياضية مسبقة.
  - معرفة عامة باستخدام الحاسوب والإنترنت والهاتف الذكي.
entry:
  prior_knowledge:
    - يستخدم الطالب يوميًا أنظمة ذكاء اصطناعي دون أن يسميها كذلك (التوصيات، الترجمة الآلية، التعرف على الوجه، المساعدات الحوارية)؛ ينطلق المحور من هذه الخبرة ويعيد تسميتها بلغة علمية.
    - لدى الطالب تصورات مسبقة عن الذكاء الاصطناعي مصدرها الأفلام والإعلام (الروبوت الواعي، الآلة التي تتمرد)؛ يستعمل المحور هذه التصورات مادة للنقاش ثم التصحيح في المحاضرة 1.5.
    - يعرف الطالب من دراسته الثانوية معنى الخوارزمية بوصفها سلسلة خطوات لحل مشكلة؛ نبني عليه التمييز بين البرنامج التقليدي والنظام الذي يتعلم من البيانات.
  diagnostic_questions:
    - اذكر ثلاثة أنظمة تستخدمها أسبوعيًا وتعتقد أنها تعتمد على الذكاء الاصطناعي. ما الذي يجعلك تصفها بالذكاء؟
    - هل الآلة الحاسبة ذكية؟ وهل تطبيق الخرائط الذي يقترح أسرع طريق ذكي؟ ما الفرق بينهما في رأيك؟
    - هل يفهم المساعد الحواري (مثل ChatGPT أو Gemini) ما تكتبه له كما يفهمه إنسان؟ علّل إجابتك الأولية.
    - "أكمل الجملة: «الذكاء الاصطناعي هو…» بكلماتك الخاصة، واحتفظ بها لتقارنها بتعريفك في نهاية المحور."
exit:
  competencies:
    - أستطيع أن أعرّف الذكاء الاصطناعي بأكثر من طريقة، وأن أشرح سبب تعدد التعريفات.
    - أستطيع أن أميز بين نظام ذكاء اصطناعي ونموذج ذكاء اصطناعي وبرنامج تقليدي.
    - أستطيع أن أحدد الوظيفة (تنبؤ، تصنيف، توليد…) التي يؤديها نظام معين.
    - أستطيع أن أصنف تطبيقًا حسب فرع الذكاء الاصطناعي الذي ينتمي إليه.
    - أستطيع أن أحلل تطبيقًا في قطاع من القطاعات من حيث البيانات والفوائد والمخاطر.
    - أستطيع أن أصحح خمسة مفاهيم خاطئة شائعة عن الذكاء الاصطناعي بحجج دقيقة.
  assessment_activities:
    - "اختبار بعدي قصير (Post-test) متعدد الأنماط: اختيار من متعدد، صح/خطأ، وأسئلة سيناريو."
    - "بطاقة خروج مكتوبة (Exit ticket): أعد كتابة تعريفك الأولي للذكاء الاصطناعي، واشرح في ثلاثة أسطر ما الذي تغيّر فيه."
    - "نشاط تصنيف جماعي: ترتيب 12 نظامًا واقعيًا في جدول (الفرع × الوظيفة) مع تبرير شفهي أمام الزملاء."
    - "دراسة حالة قصيرة مكتوبة (صفحة واحدة): تحليل تطبيق للذكاء الاصطناعي في تخصص الطالب."
    - "مناظرة مصغرة (Mini-debate) حول عبارة: «النموذج الأكبر أفضل دائمًا»."
  common_mistakes:
    - الخلط بين الذكاء الاصطناعي والتعلم الآلي واعتبارهما مترادفين.
    - اعتبار كل برنامج آلي «ذكاءً اصطناعيًا» لمجرد أنه يعمل تلقائيًا.
    - الخلط بين طلاقة اللغة في المساعدات الحوارية والفهم أو الصحة.
    - اختزال الذكاء الاصطناعي في الروبوتات أو في النماذج اللغوية وحدها.
    - الاعتقاد بأن التطبيق الناجح في مجال ينقل نجاحه آليًا إلى مجال آخر.
  remediation:
    - إذا تعثرت في تعريف الذكاء الاصطناعي، راجع المحاضرة 1.1 وأعد ملء جدول المقاربات الأربع بمثال من عندك لكل خانة.
    - إذا خلطت بين الوظائف، أعد نشاط «صنّف النظام» في المحاضرة 1.2 واكتب لكل نظام مدخلاته ومخرجاته قبل تحديد وظيفته.
    - إذا لم تميز بين الفروع، استعمل المختبر التفاعلي في المحاضرة 1.3 وحاول الوصول إلى 10/12 إجابة صحيحة.
    - إذا بقيت لديك مفاهيم خاطئة، اقرأ بطاقات «خطأ شائع» في المحاضرة 1.5 واكتب لكل مفهوم دليلًا مضادًا بكلماتك.
    - شاهد فيديو Crash Course AI #1 ثم لخصه في خمس نقاط، وقارن ملخصك بخلاصة المحاضرة 1.1.
  suggested_reading: [russell_norvig_2021, mccarthy_2007_whatisai, oecd_2024_ai_system, m01_mitchell_2021, unesco_2024_students]
  bridge: |
    عرّفنا في هذا المحور الذكاء الاصطناعي بوصفه حقلًا له وظائف وفروع وتطبيقات وحدود. لكن هذه الصورة لم تتكون
    دفعة واحدة: فتعريف ماكارثي سنة 1955، والانتقال من الأنظمة الخبيرة إلى التعلم الآلي، ثم ظهور النماذج التأسيسية،
    كلها محطات في تاريخ طويل من النجاحات والإخفاقات. **المحور 2** يعيد بناء هذا التاريخ مرحلةً مرحلة، ويسأل في كل مرحلة:
    ما المشكلة؟ وما المنهج؟ ولماذا نجح؟ ولماذا انتقل الحقل إلى ما بعده؟
instructor:
  sequence:
    - "ابدأ بالأسئلة التشخيصية واجمع إجابات الطلبة على السبورة دون تصحيح؛ ستعود إليها في المحاضرة 1.5."
    - "المحاضرة 1.1 (التعريفات) قبل 1.2 (الوظائف)، لأن الوظائف تفترض تمييزًا بين المهمة والقدرة."
    - "المحاضرة 1.3 (الفروع) و1.4 (التطبيقات) متكاملتان: درّس 1.3 بالمفاهيم، ثم استعمل 1.4 تمرينًا تطبيقيًا على الفروع."
    - "اجعل المحاضرة 1.5 (المفاهيم الخاطئة) نشاطًا تفاعليًا أكثر منها عرضًا: كل مفهوم خاطئ يُطرح أولًا للتصويت."
  timing:
    - "الحصة 1 (90 د): الأسئلة التشخيصية (15 د) + المحاضرة 1.1 (60 د) + بطاقة خروج (15 د)."
    - "الحصة 2 (90 د): المحاضرة 1.2 مع نشاط «صنّف النظام» (30 د)."
    - "الحصة 3 (90 د): المحاضرة 1.3 مع المختبر التفاعلي."
    - "الحصة 4 (90 د): المحاضرة 1.4 مع دراسة حالة جماعية (عمل في مجموعات 4–5 طلبة)."
    - "الحصة 5 (90 د): المحاضرة 1.5 + الاختبار البعدي (20 د) + مراجعة التعريفات الأولية."
    - "في حصة قصيرة (60 د): اختصر 1.3 و1.4 في محاضرة واحدة، واحتفظ بالمفاهيم الخاطئة لأنها الأعلى أثرًا."
  discussion:
    - "إذا حلّ نظام مشكلة بطريقة لا تشبه طريقة الإنسان إطلاقًا، هل يبقى وصفه بالذكاء مشروعًا؟"
    - "لماذا ما إن ينجح الذكاء الاصطناعي في مهمة حتى نكف عن اعتبارها ذكاءً (ما يسمى AI effect)؟"
    - "هل ينبغي أن يكون تعريف الذكاء الاصطناعي في القانون هو نفسه تعريفه في الكتب الجامعية؟ ولماذا؟"
    - "ما الوظيفة (أتمتة أم تعزيز) التي تفضل أن يؤديها الذكاء الاصطناعي في مهنتك المستقبلية؟"
  assessment_ideas:
    - "اطلب من كل طالب «بطاقة هوية» لنظام ذكاء اصطناعي من اختياره: الفرع، الوظيفة، المدخلات، المخرجات، البيانات، الخطأ الممكن."
    - "سؤال مقالي قصير: قارن تعريف ماكارثي بتعريف OECD لنظام الذكاء الاصطناعي، وبيّن ما يضيفه كل منهما."
    - "تقييم الأقران للخرائط المفاهيمية الشخصية وفق ثلاثة معايير: الدقة، الترابط، الأمثلة."
  extensions:
    - "للمجموعات المتقدمة: قراءة ورقة Legg وHutter (2007) عن تعريفات الذكاء ومناقشة فكرة «الذكاء الكوني» (universal intelligence)."
    - "مقارنة تعريف نظام الذكاء الاصطناعي في OECD (2024) بالمادة 3 من قانون الذكاء الاصطناعي الأوروبي."
    - "قراءة Mitchell (2021) «Why AI is harder than we think» واستخراج المغالطات الأربع التي تحددها."
