module_number: 8
title: التفاعل مع نماذج الذكاء الاصطناعي لتوليد النصوص
short_title: توليد النصوص والتحقق
title_en: "Text generation, interaction and verification"
subtitle: من تصنيف المهام النصية إلى الكتابة والاستخراج، ثم قسم كامل للتحقق والنزاهة الأكاديمية.
description: |
  هذا المحور هو **الترجمة العملية** لكل ما سبق. فقد بنينا المفاهيم (المحاور 1–4)، وتعلمنا صياغة الأوامر
  (5–6)، وفهمنا آلية النماذج وحدودها (7). والآن: **كيف نستعملها فعليًا في الكتابة والبحث؟**

  نبدأ بتصنيف يحسم كثيرًا من الالتباس: ليست كل مهمة نصية **توليدًا**. فهناك فرق جوهري بين **الاستخراج**
  (نقل ما في المصدر) و**التحويل** (إعادة صياغة موجود) و**التوليد** (إنشاء جديد) و**التصنيف** و**الاسترجاع**
  و**الاستدلال** و**التحقق**. ولكل صنف مخاطره وطريقة تقييمه: فالاستخراج يُقارن بالمصدر، والتوليد لا إجابة
  صحيحة واحدة له.

  ثم نمر على المهام العملية: الكتابة، وإعادة الصياغة، والتلخيص، والترجمة، والاستخراج، والتصنيف، والعصف
  الذهني، والمساعدة في البحث والبرمجة وتحليل البيانات. وفي كل مهمة: **ما الذي تجيده الأداة؟ وأين تخطئ؟
  وكيف نتحقق؟**

  ويُخصَّص **ثلث المحور للتحقق**: التحقق من الوقائع، والمصادر، والاستشهادات، والأرقام، والتواريخ،
  والاقتباسات. ثم **النزاهة الأكاديمية** بالاعتماد على مواقف رسمية موثقة (APA و COPE و ICMJE وناشرين).
  فالمهارة التي تميز الباحث المحترف ليست حسن الاستعمال، بل **حسن التحقق**.
estimated_duration: "6 حصص × 90 دقيقة"
difficulty: متوسط
keywords: [توليد النصوص, الاستخراج, التحويل, التصنيف, التلخيص, الترجمة, إعادة الصياغة, المساعدة البحثية, التحقق, الاستشهادات, القراءة الجانبية, النزاهة الأكاديمية, الإفصاح]
concept_diagram: m08_concept_map
objectives:
  - {bloom: remember, text: "يعدّد أصناف المهام النصية السبعة ويعرّف كلًا منها."}
  - {bloom: understand, text: "يشرح الفرق بين الاستخراج والتحويل والتوليد من حيث المخاطر وطرق التقييم."}
  - {bloom: apply, text: "يصمم مسار عمل لمهمة نصية محددة مع نقاط التحقق المناسبة لها."}
  - {bloom: apply, text: "يطبق إجراءات التحقق من الاستشهادات والأرقام والاقتباسات على مخرج فعلي."}
  - {bloom: analyze, text: "يحلل مخرجًا نصيًا ويصنّف أخطاءه ويحدد سبب كل خطأ."}
  - {bloom: evaluate, text: "يقيّم جودة نص مولَّد بمعايير الصحة والملاءمة والاكتمال والاتساق."}
  - {bloom: create, text: "يبني بروتوكول استعمال وإفصاح لعمله الأكاديمي وفق سياسات موثقة."}
prerequisites:
  - المحور 5 و6 (هندسة الأوامر والتقييد والإسناد).
  - المحاضرة 7.3 (الهلوسة وتصنيف الأخطاء).
entry:
  prior_knowledge:
    - "يعرف الطالب من المحاضرة 1.2 الفرق بين التوليد والتصنيف والاستخراج؛ نبني عليه تصنيفًا أدق للمهام النصية."
    - "يعرف من المحاضرة 7.3 أن الهلوسة أنواع؛ نحوّل ذلك هنا إلى إجراءات تحقق عملية."
    - "يعرف من المحاضرة 6.3 التقييد بالمصدر وجدول الأدلة؛ نطبقهما على الكتابة الأكاديمية."
    - "لدى أغلب الطلبة تجربة عملية في استعمال مساعد حواري في دراستهم؛ ننطلق منها ونضبطها بمنهج."
  diagnostic_questions:
    - هل لخّصتَ نصًا بمساعدة أداة ثم قارنت الملخص بالأصل؟ ماذا وجدت؟
    - إذا أعطاك مساعد رقمًا إحصائيًا، كيف تتحقق منه؟ اكتب خطواتك.
    - ما الفرق في رأيك بين طلب «لخّص هذا النص» وطلب «استخرج الأرقام من هذا النص»؟ أيهما أسهل تحققًا؟
    - ما الذي يجب أن تفصح عنه إذا استعملت أداة في إعداد بحثك؟ ومن يحدد ذلك؟
exit:
  competencies:
    - أستطيع أن أصنّف أي مهمة نصية وأحدد مخاطرها وطريقة تقييمها.
    - أستطيع أن أصمم مسار عمل للكتابة أو الاستخراج مع نقاط تحقق مناسبة.
    - أستطيع أن أتحقق من استشهاد أو رقم أو اقتباس بإجراء منهجي.
    - أستطيع أن أميز بين الأخطاء القابلة للكشف داخليًا وتلك التي تحتاج إلى مصدر خارجي.
    - أستطيع أن أصوغ بيان إفصاح عن استعمال الأدوات وفق سياسة مؤسستي.
  assessment_activities:
    - "اختبار بعدي يجمع تصنيف المهام وتحليل الأخطاء وسيناريوهات النزاهة."
    - "تمرين تحقق: مخرج فيه أخطاء مزروعة، يُطلب كشفها وتصنيفها وبيان طريقة التحقق."
    - "مشروع مصغر: مسار عمل موثق لمهمة كتابية مع سجل استعمال وبيان إفصاح."
    - "تقييم أقران لملخص: هل هو أمين للمصدر؟ وهل أضاف ما ليس فيه؟"
    - "مناقشة حالة: عمل أكاديمي استُعملت فيه أداة دون إفصاح — تحليل المسؤوليات."
  common_mistakes:
    - معاملة كل المهام النصية معاملة واحدة رغم اختلاف مخاطرها.
    - الثقة في الملخص دون مقارنته بالأصل.
    - قبول استشهاد لأنه متسق الشكل ومعقول.
    - الخلط بين «الأداة ذكرت مصدرًا» و«المصدر موجود ويقول ذلك».
    - الاعتقاد بأن إعادة الصياغة تكفي لتجنب الانتحال.
    - افتراض وجود قاعدة عالمية واحدة للإفصاح بدل الرجوع إلى سياسة المؤسسة.
  remediation:
    - إذا التبس تصنيف المهام، أعد جدول الأصناف السبعة وطبّقه على خمس مهام من دراستك (المحاضرة 8.1).
    - إذا لم تكتشف الأخطاء في مختبر التحقق، راجع إجراءات التحقق الستة وحاول بلوغ 5 من 7 (المحاضرة 8.5).
    - إذا صعب عليك تقييم ملخص، طبّق قائمة الأمانة للتلخيص على ملخص أعددته سابقًا (المحاضرة 8.2).
    - اقرأ سياسة جامعتك حول استعمال أدوات الذكاء الاصطناعي، ولخّصها في خمس نقاط (المحاضرة 8.6).
  suggested_reading: [m08_apa_cite_ai, m08_cope_ai, m08_nature_ai_policy, m01_unesco_2023_genai, m07_huang_2023]
  bridge: |
    أتقنّا الآن التعامل مع **النص**. لكن الذكاء الاصطناعي التوليدي لا يقف عند الكلمات: فهو يولّد الصور
    والأصوات والفيديو، ويجمع بين الوسائط. و**المحور 9** ينتقل إلى هذا العالم: كيف تعمل نماذج الانتشار؟
    وما الفرق بين توليد الصورة وتوليد النص؟ وما مسائل الحقوق والتزييف والإثبات التي تطرحها الوسائط المولَّدة؟
instructor:
  sequence:
    - "8.1 (التصنيف) أولًا: هو الإطار الذي تُعلّق عليه بقية المحور."
    - "8.2 و8.3 و8.4 مهام عملية: يمكن اختصارها أو دمجها حسب تخصص الطلبة."
    - "8.5 (التحقق) هي **قلب المحور**: لا تختصرها إطلاقًا، وخصص لها حصة كاملة."
    - "8.6 (النزاهة) في النهاية، وابدأها بسياسة جامعتك إن وُجدت."
  timing:
    - "الحصة 1 (90 د): الأسئلة التشخيصية (10 د) + المحاضرة 8.1 (60 د) + تمرين تصنيف (20 د)."
    - "الحصة 2 (90 د): المحاضرة 8.2 (الكتابة والتلخيص والترجمة)."
    - "الحصة 3 (90 د): المحاضرة 8.3 (الاستخراج والتصنيف والجداول)."
    - "الحصة 4 (90 د): المحاضرة 8.4 (البحث والبرمجة وتحليل البيانات)."
    - "الحصة 5 (90 د): المحاضرة 8.5 مع مختبر التحقق كاملًا."
    - "الحصة 6 (90 د): المحاضرة 8.6 + بناء بيان الإفصاح + الاختبار البعدي (25 د)."
    - "في حصة قصيرة (60 د): ادمج 8.2 و8.3، ولا تمسّ 8.5 ولا 8.6."
  discussion:
    - "إذا كتب الطالب فقرة ثم حسّنها بأداة، فما الذي يجب أن يفصح عنه؟ وهل يختلف عن حالة توليد الفقرة كاملة؟"
    - "هل التحقق من كل رقم واقعي عمليًا؟ وكيف نوازن بين الصرامة والوقت المتاح؟"
    - "من يتحمل مسؤولية مرجع مختلق في مذكرة: الطالب أم الأداة أم المشرف؟"
    - "هل يغيّر تحسن الأدوات من واجب التحقق؟ ولماذا؟"
  assessment_ideas:
    - "أعطِ نصًا مولَّدًا فيه ستة أخطاء من أنواع مختلفة واطلب كشفها وتصنيفها وبيان إجراء التحقق."
    - "اطلب مقارنة ملخص بالنص الأصلي وتحديد ما أُضيف وما حُذف وما شُوّه."
    - "اطلب صياغة بيان إفصاح لعمل محدد وفق سياسة الجامعة."
    - "سؤال مقالي: «الاستخراج أسهل تحققًا من التوليد». اشرح ولماذا يهم ذلك عمليًا."
  extensions:
    - "قراءة موقف COPE من تأليف الأدوات ومقارنته بسياسة ناشر آخر."
    - "مقارنة إرشادات APA لتوثيق استعمال الأدوات بإرشادات أسلوب آخر معتمد في تخصص الطالب."
    - "قراءة دراسة Noy و Zhang (2023) ومناقشة ما تقيسه فعلًا وما لا تقيسه."
