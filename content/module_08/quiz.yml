entry:
  - id: m08-e01
    type: mcq
    bloom: understand
    prompt: "أي المهمتين أسهل تحققًا: «لخّص هذا النص» أم «استخرج الأرقام الواردة في هذا النص»؟"
    options:
      - "التلخيص، لأنه أقصر."
      - "الاستخراج، لأن لكل حقل إجابة مرجعية في المصدر يمكن المقارنة بها حرفيًا."
      - "متساويان."
      - "التلخيص، لأن الأداة تجيده أكثر."
    answer: 1
    explanation: "الاستخراج له إجابة مرجعية محددة؛ والتلخيص يُقاس بالأمانة وهي حكم أدق وأصعب."
    review: m08-l01
  - id: m08-e02
    type: tf
    bloom: understand
    prompt: "إذا كان الاستشهاد متسق الشكل ومعقول البيانات، فهذا مؤشر كافٍ على وجوده."
    answer: false
    explanation: "الاتساق الشكلي هو بالضبط ما يجيده المولّد. الوجود يُتحقق منه في قاعدة بيانات ببليوغرافية."
    review: m08-l05
  - id: m08-e03
    type: mcq
    bloom: apply
    prompt: "أعطاك مساعد حواري رقمًا إحصائيًا. ما أول خطوة تحقق؟"
    options:
      - "أسأله: هل أنت متأكد؟"
      - "أبحث عن المصدر الأولي للرقم وأصعد سلسلة النقل حتى الجهة التي أنتجته."
      - "أقارنه بمساعد آخر."
      - "أقبله إن كان معقولًا."
    answer: 1
    explanation: "سؤال النموذج ليس تحققًا؛ والتحقق يكون من خارج النص بالرجوع إلى المصدر الأولي."
    review: m08-l05
  - id: m08-e04
    type: tf
    bloom: remember
    prompt: "إعادة صياغة فقرة من مصدر بألفاظ مختلفة تكفي لتجنب الانتحال."
    answer: false
    explanation: "الانتحال نسبة أفكار غيرك إلى نفسك. إعادة الصياغة تغيّر الشكل ولا تلغي وجوب الإسناد."
    review: m08-l02
  - id: m08-e05
    type: mcq
    bloom: understand
    prompt: "من يحدد ما يجب الإفصاح عنه عند استعمال أداة في عمل أكاديمي؟"
    options:
      - "قاعدة عالمية موحدة معروفة."
      - "سياسة المؤسسة أو المجلة السارية وقت تقديم العمل."
      - "الأداة نفسها في شروط استعمالها."
      - "عرف الزملاء."
    answer: 1
    explanation: "الملزم هو السياسة السارية للجهة المستقبِلة؛ والمبادئ العامة إرشادية لا ملزمة."
    review: m08-l06

questions:
  - id: m08-q01
    type: mcq
    bloom: remember
    prompt: "ما الذي يميز **الاستخراج** عن **التوليد** تمييزًا جوهريًا؟"
    options:
      - "الاستخراج أسرع."
      - "الاستخراج له إجابة مرجعية موجودة في المصدر، والتوليد لا إجابة صحيحة واحدة له."
      - "الاستخراج يحتاج نماذج أكبر."
      - "التوليد أدق."
    answer: 1
    why_wrong:
      0: "السرعة عرض لا فارق جوهري، وقد يكون العكس."
      2: "حجم النموذج لا علاقة له بالتمييز بين الصنفين."
      3: "الدقة ليست خاصية للصنف، بل نتيجة وجود مرجع يُقاس إليه."
    explanation: "علاقة المخرج بالمصدر هي ما يحدد المخاطر وطريقة التقييم."
    review: m08-l01
  - id: m08-q02
    type: mcq
    bloom: understand
    prompt: "ما الأخطاء الثلاثة التي تُقاس بها أمانة الملخص؟"
    options:
      - "الطول والأسلوب والترتيب."
      - "الإضافة والحذف المخلّ والتشويه."
      - "الإملاء والنحو والترقيم."
      - "التكرار والغموض والإطناب."
    answer: 1
    why_wrong:
      0: "هذه معايير أسلوبية لا معايير أمانة للمصدر."
      2: "أخطاء لغوية لا علاقة لها بمطابقة المصدر."
      3: "عيوب صياغة، والملخص قد يكون سليم الصياغة وخائنًا تمامًا."
    explanation: "الأمانة أن يحوي الملخص ما في المصدر فقط، دون حذف مغيّر للمعنى ودون تبديل درجة اليقين."
    review: m08-l02
  - id: m08-q03
    type: mcq
    bloom: analyze
    prompt: "المصدر يقول «تشير النتائج الأولية إلى احتمال وجود علاقة»، والملخص يقول «أثبتت الدراسة وجود علاقة». ما نوع الخطأ؟"
    options:
      - "إضافة معلومة."
      - "تشويه برفع درجة اليقين، مع حذف مخلّ للتحفظ المنهجي."
      - "خطأ لغوي."
      - "لا خطأ، فالمعنى واحد."
    answer: 1
    why_wrong:
      0: "لم تُضف معلومة جديدة، بل بُدّلت درجة اليقين في معلومة موجودة."
      2: "الخطأ في المضمون العلمي لا في اللغة."
      3: "«احتمال» و«إثبات» ادعاءان علميان مختلفان اختلافًا جوهريًا."
    explanation: "تحويل الاحتمال إلى جزم أشيع أخطاء التلخيص وأخطرها، وهو من المواضع الأربعة التي تُفحص أولًا."
    review: m08-l02
  - id: m08-q04
    type: tf
    bloom: understand
    prompt: "أفعال التحفظ في النص العلمي («يُرجَّح»، «قد يشير») زينة أسلوبية يمكن تبسيطها في الترجمة."
    answer: false
    explanation: "هي جزء من المضمون العلمي: إسقاطها أو تقويتها يغيّر الادعاء العلمي نفسه."
    review: m08-l02
  - id: m08-q05
    type: mcq
    bloom: apply
    prompt: "تصمم مخطط استخراج. ما أخطر حقل يجب أن تحدده صراحةً؟"
    options:
      - "اسم الحقل."
      - "ما يحدث حين تكون المعلومة **غير مذكورة** في المصدر."
      - "ترتيب الحقول."
      - "صيغة المخرج."
    answer: 1
    why_wrong:
      0: "ضروري لكنه لا يمنع أشهر أنماط الفشل."
      2: "الترتيب لا أثر له على صحة المضمون."
      3: "مهم للمعالجة الآلية، لكن البنية تضبط الشكل لا المضمون."
    explanation: "النموذج يميل إلى ملء الفراغ بقيمة معقولة من معرفته العامة؛ وقاعدة null الصريحة هي العلاج."
    review: m08-l03
  - id: m08-q06
    type: mcq
    bloom: analyze
    prompt: "استخراج على 300 مستند أعطى مخرجًا بلا أي قيمة فارغة. ما التفسير الأرجح؟"
    options:
      - "جودة عالية للأداة."
      - "ملء تلقائي للحقول الغائبة، فالمستندات الواقعية ناقصة بطبعها."
      - "المستندات كانت مكتملة فعلًا."
      - "خطأ في قراءة الملف."
    answer: 1
    why_wrong:
      0: "الاكتمال البنيوي يقيس الشكل لا المضمون، ولا يدل على الجودة."
      2: "اكتمال 300 مستند واقعي في كل الحقول احتمال ضعيف جدًا."
      3: "خطأ القراءة يظهر عادةً كتشوه في البنية لا كاكتمال تام."
    explanation: "غياب أي قيمة فارغة علامة إنذار تستدعي فحص عينة تعرف يقينًا أن فيها حقولًا غائبة."
    review: m08-l03
  - id: m08-q07
    type: mcq
    bloom: evaluate
    prompt: "صنّفت أداة 100 تعليق فطابقت ترميزك في 85. لماذا لا تكفي هذه النسبة للحكم؟"
    options:
      - "لأن 85% نسبة منخفضة دائمًا."
      - "لأنها لا تصحح للاتفاق المتوقع بالصدفة؛ ففي بيانات غير متوازنة قد يتفوق مصنّف يعطي الفئة الغالبة دائمًا."
      - "لأن العينة صغيرة."
      - "لأن الترميز البشري غير موثوق."
    answer: 1
    why_wrong:
      0: "لا توجد عتبة مطلقة؛ المعنى يتوقف على توزيع الفئات."
      2: "حجم العينة مسألة أخرى لا تفسر المشكلة المطروحة."
      3: "الترميز البشري هو المرجع هنا، والسؤال عن تفسير النسبة."
    explanation: "لو كانت 90% من الحالات فئة واحدة، لحقق مصنّف ثابت 90% دون فهم. ولهذا يُذكر توزيع الفئات مع النسبة."
    review: m08-l03
  - id: m08-q08
    type: mcq
    bloom: apply
    prompt: "ما مكونات بروتوكول التحقق من مخرج مهيكل يضم مئات السجلات؟"
    options:
      - "قراءة كل السجلات يدويًا."
      - "فحص بنيوي آلي على 100% + عينة عشوائية + عينة موجّهة للحالات الحدّية + عتبة محددة مسبقًا + توثيق."
      - "الاكتفاء بفحص أول عشرة سجلات."
      - "الوثوق بالمخرج إن كانت البنية سليمة."
    answer: 1
    why_wrong:
      0: "غير ممكن عمليًا، ولهذا وُجد التحقق بالعينة."
      2: "أول السجلات ليست عينة عشوائية ولا تمثل التوزيع."
      3: "سلامة البنية لا تدل على صحة المضمون."
    explanation: "العتبة تُحدد قبل النظر في النتائج، ومعدل الخطأ يُحسب لكل حقل لا للسجل ككل."
    review: m08-l03
  - id: m08-q09
    type: mcq
    bloom: understand
    prompt: "لماذا تُعدّ البرمجة أكثر المجالات الثلاثة أمانًا في الاستعمال؟"
    options:
      - "لأن النماذج دُرّبت على شفرة أكثر من النصوص."
      - "لأنها المجال الوحيد ذو تغذية راجعة مستقلة وفورية: التنفيذ والاختبارات."
      - "لأن أخطاء الشفرة غير مهمة."
      - "لأن المبرمجين يراجعون أكثر."
    answer: 1
    why_wrong:
      0: "حجم بيانات التدريب ليس مصدر الأمان المقصود هنا."
      2: "أخطاء الشفرة قد تفسد نتائج بحث كاملة."
      3: "سلوك المستعملين ليس خاصية بنيوية للمجال."
    explanation: "لكن التنفيذ يفحص الصحة التشغيلية لا المنطقية، ولهذا تبقى قاعدة «لا تشغّل ما لا تفهم»."
    review: m08-l04
  - id: m08-q10
    type: tf
    bloom: analyze
    prompt: "إذا عملت الشفرة المولَّدة بلا رسالة خطأ فالنتيجة صحيحة."
    answer: false
    explanation: "أخطر الأخطاء ما ينفَّذ بصمت: دمج على مفتاح غير فريد، وتجميع على مستوى خاطئ، وحذف صفوف ناقصة."
    review: m08-l04
  - id: m08-q11
    type: mcq
    bloom: evaluate
    prompt: "أي الطلبين غير مقبول أكاديميًا؟"
    options:
      - "«اشرح لي هذا المفهوم شرحًا أوليًا»."
      - "«ما أهم عشر دراسات في هذا الموضوع؟»"
      - "«راجع منطق هذه الفقرة التي كتبتها»."
      - "«اشرح لي ماذا يفعل هذا السطر من الشفرة»."
    answer: 1
    why_wrong:
      0: "مقبول كمدخل أولي، بشرط الرجوع إلى مرجع معتمد وعدم الاستشهاد به."
      2: "من أفضل الاستعمالات، لأن المضمون مضمونك والأداة تعمل على نص أمامها."
      3: "استعمال تعليمي ممتاز وقابل للتحقق بالتشغيل."
    explanation: "يجمع خطرين: اختلاق مراجع، وادعاء الأهمية بلا معيار ولا مصدر. والبديل بحث ببليوغرافي بمعايير موثقة."
    review: m08-l04
  - id: m08-q12
    type: mcq
    bloom: understand
    prompt: "لماذا يكون تحليل البيانات أخطر من البرمجة رغم اشتراكهما في الشفرة؟"
    options:
      - "لأن البيانات أكبر حجمًا."
      - "لأن تغذيته الراجعة مخادعة: الشفرة تعمل والنتيجة تظهر، ولا شيء يكشف أن الافتراضات المنهجية خاطئة."
      - "لأن أدوات التحليل أقل نضجًا."
      - "لأنه يحتاج رياضيات أكثر."
    answer: 1
    why_wrong:
      0: "الحجم مسألة أداء لا مسألة صحة منهجية."
      2: "نضج الأدوات ليس مصدر الخطر المقصود."
      3: "صعوبة المجال شيء، وخداع التغذية الراجعة شيء آخر."
    explanation: "النموذج لا يعرف كيف جُمعت بياناتك ولا وحدة الرصد ولا بنية التبعية فيها، وهي معرفة تخصصية لا تُستنتج من شكل الجدول."
    review: m08-l04
  - id: m08-q13
    type: mcq
    bloom: apply
    prompt: "ما وحدة التحقق الصحيحة عند فحص نص مولَّد؟"
    options:
      - "النص كاملًا."
      - "الادعاء المفرد القابل للفحص."
      - "الفقرة."
      - "القسم."
    answer: 1
    why_wrong:
      0: "الحكم على النص ككتلة حكم بالانطباع، وهو يميل إلى القبول."
      2: "الفقرة قد تحوي خمسة ادعاءات، أربعة صحيحة تغطي على الخامس."
      3: "أكبر من الفقرة، فالمشكلة نفسها أشد."
    explanation: "ضع خطًا تحت كل جملة تحمل ادعاءً قابلًا للفحص، وافحص كل واحد وحده."
    review: m08-l05
  - id: m08-q14
    type: mcq
    bloom: analyze
    prompt: "وجدت الورقة المستشهد بها وتأكدت من مجلتها وسنتها ومؤلفيها. ما الدرجة المتبقية من التحقق؟"
    options:
      - "لا شيء، انتهى التحقق."
      - "التأكد من أنها **تقول فعلًا** ما نُسب إليها."
      - "التأكد من عدد الاستشهادات بها."
      - "التأكد من معامل تأثير المجلة."
    answer: 1
    why_wrong:
      0: "هذه الدرجة الثانية من ثلاث، وأخطرها لم يُنفَّذ بعد."
      2: "عدد الاستشهادات مؤشر تأثير لا مؤشر صحة النسبة."
      3: "معامل التأثير خاصية للمجلة لا للادعاء المنسوب."
    explanation: "النموذج يربط موضوعًا بمرجع معروف فيه دون قراءة، فيخرج استشهاد حقيقي في مكانه الخطأ."
    review: m08-l05
  - id: m08-q15
    type: mcq
    bloom: understand
    prompt: "ما جوهر **القراءة الجانبية**؟"
    options:
      - "قراءة النص سريعًا بالقفز بين الأسطر."
      - "مغادرة المصدر المجهول فورًا والبحث عنه من الخارج بدل التعمق فيه."
      - "قراءة النسخة الإنجليزية إلى جانب العربية."
      - "قراءة الحواشي قبل المتن."
    answer: 1
    why_wrong:
      0: "هذه قراءة سريعة (skimming)، وهي شيء آخر تمامًا."
      2: "المقارنة بين اللغات ليست موضوع المنهج."
      3: "تظل قراءة عمودية داخل المصدر نفسه."
    explanation: "كل ما تراه داخل الصفحة صنعه صاحبها بما فيه مظاهر الموثوقية؛ وما يقوله الآخرون عنها ليس تحت سيطرتها."
    review: m08-l05
  - id: m08-q16
    type: tf
    bloom: evaluate
    prompt: "سؤال النموذج «هل هذه المعلومة صحيحة؟» إجراء تحقق مقبول."
    answer: false
    explanation: "ليس مصدرًا مستقلًا، وإجابته تتأثر بنبرة سؤالك (المجاملة). والاستعمال المفيد الوحيد أن تسأله أين تتحقق، لا أن يحكم."
    review: m08-l05
  - id: m08-q17
    type: mcq
    bloom: apply
    prompt: "ضاق وقتك ولم تستطع التحقق من ادعاء ورد في بحثك. ما التصرف الصحيح؟"
    options:
      - "أدرجه بصيغة متحفظة مثل «يُقال إن»."
      - "احذفه."
      - "أدرجه مع علامة استفهام."
      - "أدرجه وانسبه إلى الأداة."
    answer: 1
    why_wrong:
      0: "الصيغة المتحفظة لا تصحح ادعاءً لم يُتحقق منه، بل تخفي المشكلة."
      2: "علامة الاستفهام ليست ممارسة أكاديمية، والادعاء يبقى في النص."
      3: "الأداة ليست مصدرًا يُنسب إليه ادعاء واقعي."
    explanation: "النص الأقصر الموثق أقوى علميًا من النص الأطول المشكوك فيه."
    review: m08-l05
  - id: m08-q18
    type: mcq
    bloom: understand
    prompt: "على أي أساس استبعدت المواقف الرسمية أن تكون الأداة مؤلفًا؟"
    options:
      - "ضعف جودة النص المولَّد."
      - "أن التأليف يحمل مسؤوليات (المساءلة والموافقة والإجابة وتحمل التبعات) لا تستطيع الأداة تحملها."
      - "عدم وجود حقوق ملكية للأداة."
      - "صعوبة كتابة اسمها في قائمة المؤلفين."
    answer: 1
    why_wrong:
      0: "التعليل مبني على طبيعة المسؤولية لا على جودة المخرج، فلو تحسّن لما تغيّر الحكم."
      2: "مسألة الملكية منفصلة عن معيار التأليف العلمي."
      3: "عائق شكلي لا يصلح تعليلًا لموقف أخلاقي."
    explanation: "هذا التعليل يعطيك قاعدة قابلة للتطبيق: حيثما انتقلت المسؤولية العلمية، خرج العمل عن دائرة المقبول."
    review: m08-l06
  - id: m08-q19
    type: mcq
    bloom: evaluate
    prompt: "لماذا لا يجوز بناء اتهام بالغش على نتيجة أداة كشف نصوص مولَّدة؟"
    options:
      - "لأن الأدوات غالية."
      - "لإيجابياتها الكاذبة المنحازة ضد فئات بعينها، ولعدم وجود معيار قابل للتدقيق يسمح بالدفاع."
      - "لأنها بطيئة."
      - "لأن الطلبة يرفضونها."
    answer: 1
    why_wrong:
