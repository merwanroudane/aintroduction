entry:
  - id: m11-e01
    type: mcq
    bloom: understand
    prompt: "نظام لا يستعمل الجنس ولا الأصل ولا المنطقة في قرار منح القرض. هل هذا يكفي لوصفه بالعادل؟"
    options:
      - "نعم، فالنظام لا يرى المتغيرات الحسّاسة فلا يمكن أن يميّز على أساسها."
      - "لا، فمتغيرات أخرى مرتبطة بها قد تنقل الأثر نفسه، والحذف يمنع القياس لا التمييز."
      - "نعم، بشرط أن تكون دقته عالية."
      - "لا، لأن أي نظام آلي متحيّز بطبيعته."
    answer: 1
    explanation: "الحي والمدرسة والرمز البريدي ونوع الشهادة وكلها متغيرات وكيلة تعيد بناء الانتماء. والأخطر أن حذف المتغير الحسّاس يحرمك من قياس الفجوة ومن تصحيحها ومن التدقيق عليها."
    review: m11-l02
  - id: m11-e02
    type: tf
    bloom: remember
    prompt: "إذا قال نظامان إن كليهما «عادل» وأعطيا قرارين مختلفين للشخص نفسه، فأحدهما يكذب بالضرورة."
    answer: false
    explanation: "قد يكون كلاهما محقًّا مع اختلافهما، لأن كل واحد يحقق معيار إنصاف مختلفًا. ومعايير الإنصاف الرئيسية لا تجتمع عند اختلاف المعدلات القاعدية، فاختيار المعيار هو الموقف."
    review: m11-l03
  - id: m11-e03
    type: mcq
    bloom: apply
    prompt: "مستشفى يريد تحديد المرضى المحتاجين لرعاية مكثّفة، فاستعمل تكلفة العلاج السابقة مؤشرًا على الحاجة. ما المشكلة؟"
    options:
      - "التكلفة رقم غير دقيق ويحتاج تصحيحًا للتضخم."
      - "التكلفة تقيس ما أُنفق فعلًا، وهو يتأثر بالوصول إلى الرعاية لا بالحاجة وحدها."
      - "لا مشكلة، فالتكلفة مؤشر موضوعي مسجّل."
      - "المشكلة في حجم العينة لا في المتغير."
    answer: 1
    explanation: "من لم تُتَح له الرعاية يظهر منخفض التكلفة فيُقرأ منخفض الحاجة. وهذا تحيّز القياس عبر متغير هدف بديل، وهو أخطر مصادر التحيّز وأقلها انتباهًا."
    review: m11-l02
  - id: m11-e04
    type: mcq
    bloom: understand
    prompt: "ما معنى أن يكون نظام «شفافًا»؟"
    options:
      - "أن يكون رمزه منشورًا للعموم."
      - "أن يُرفق بكل قرار تفسير يبيّن أهم العوامل المؤثرة."
      - "الشفافية طبقات: نشر الرمز، وتفسير لاحق، وقابلية تفسير بالتصميم، ومساءلة — ولكل طبقة جمهور وسؤال."
      - "أن يكون النموذج بسيطًا بما يكفي ليفهمه غير المتخصص."
    answer: 2
    explanation: "نشر الرمز يجيب عن سؤال لم يطرحه المتأثر، والتفسير اللاحق لا يثبت أن النموذج يعمل هكذا. والطبقة التي بدونها تصير البقية زينة هي المساءلة: من المسؤول، وكيف أطعن."
    review: m11-l04
  - id: m11-e05
    type: tf
    bloom: evaluate
    prompt: "من يجب أن يحدد تعريف «العدالة» في نظام يمنح منحًا دراسية هو المهندس الذي يبني النظام، لأنه الأقدر على فهم المقايضات التقنية."
    answer: false
    explanation: "اختيار معيار الإنصاف قرار قِيَمي لا تحسمه الرياضيات، ويحتاج سلطة تقرّه وتوثيقًا يبيّنه ومشاركة المتأثرين. ودور المهندس أن يُظهر المقايضة وكلفتها، لا أن يحسمها في إعداد افتراضي."
    review: m11-l06

questions:
  - id: m11-q01
    type: scenario
    bloom: analyze
    scenario: "خوارزمية لإدارة صحة السكان استعملت التكاليف الصحية السابقة مؤشرًا على الحاجة الصحية. وتبيّن أن مرضى فئة معيّنة كانوا عند درجة المخاطر نفسها أكثر مرضًا من غيرهم."
    prompt: "أين يقع الخطأ بالضبط؟"
    options:
      - "في الخوارزمية، فقد فشلت في التنبؤ بالتكاليف بدقة."
      - "في اختيار المتغير الهدف، فالتكلفة بديل عن الحاجة يتأثر بالوصول غير المتكافئ إلى الرعاية."
      - "في حجم بيانات التدريب، وكان يلزم جمع بيانات أكثر."
      - "في عدم إدراج متغير الانتماء بين المتغيرات المفسّرة."
    answer: 1
    explanation: "النموذج أدّى مهمته: تنبأ بالتكاليف تنبؤًا جيدًا. والخطأ أن جوابه عن التكاليف قُرِئ جوابًا عن الحاجة. وتصحيح المتغير الهدف رفع نسبة المرشّحين للرعاية من 17.7٪ إلى 46.5٪، وقلّص التحيّز بنسبة 84٪."
    why_wrong:
      0: "لم تفشل تقنيًا؛ دقتها في التنبؤ بالتكاليف كانت جيدة، وهذا بالضبط ما يجعل العطب غير مرئي."
      2: "بيانات أكثر عن المتغير الخطأ تعطي تقديرًا أدق للشيء الخطأ."
      3: "إدراج الانتماء ليس الحل، والحذف لم يكن سبب المشكلة أصلًا؛ المشكلة في تعريف المخرج."
    review: m11-l02
  - id: m11-q02
    type: mcq
    bloom: understand
    prompt: "لماذا لا تجتمع معايير الإنصاف الرئيسية معًا؟"
    options:
      - "لأن الخوارزميات الحالية غير كافية، وستُحل المسألة بنماذج أقوى."
      - "لأن هوية جبرية تربط معدل الخطأ بالقيمة التنبؤية بالمعدل القاعدي، فتثبيت اثنين يحدد الثالث."
      - "لأن البيانات المتاحة دائمًا ناقصة."
      - "لأن تعريفات الإنصاف غامضة ولا تقبل الصياغة الرياضية."
    answer: 1
    explanation: "الهوية FPR = [p/(1-p)] × [(1-PPV)/PPV] × TPR محاسبية لا تجريبية. فإن تساوت القيمة التنبؤية ومعدل الكشف بين فئتين مختلفتي المعدل القاعدي، اختلف معدل الإيجابي الكاذب بالضرورة الجبرية."
    why_wrong:
      0: "النتيجة رياضية لا تقنية؛ ولا تحلّها أي قدرة حسابية أو معمارية."
      2: "لا علاقة للمسألة بنقص البيانات؛ التعارض قائم حتى ببيانات تامة."
      3: "المعايير مصاغة رياضيًا بدقة، وهذا بالضبط ما أتاح البرهنة على تعارضها."
    review: m11-l03
  - id: m11-q03
    type: mcq
    bloom: apply
    prompt: "نظام فرز: الفئة أ معدلها القاعدي 0.30 وقيمتها التنبؤية 0.75 ومعدل كشفها 0.60. ما معدل الإيجابي الكاذب؟"
    options:
      - "0.0857"
      - "0.2500"
      - "0.4000"
      - "0.1800"
    answer: 0
    explanation: "بتطبيق الهوية: (0.30/0.70) × (0.25/0.75) × 0.60 = 0.4286 × 0.3333 × 0.60 = 0.0857. والهوية محاسبية، فتتحقق دائمًا وتكشف أخطاء الحساب فورًا."
    why_wrong:
      1: "هذه 1−PPV، وليست معدل الإيجابي الكاذب."
      2: "هذه 1−TPR، أي معدل السلبي الكاذب."
      3: "قيمة لا تنتج عن أي تركيب صحيح للهوية."
    review: m11-l03
  - id: m11-q04
    type: multi
    bloom: analyze
    prompt: "في المختبر، غيّرنا حجم الجوار المستعمل في بناء تفسير محلي، فتغيّرت الأوزان وانقلبت إشارة أحدها. أي الاستنتاجات صحيحة؟ (اختر كل ما ينطبق)"
    options:
      - "التفسير اللاحق يعتمد على قرارات بنائه لا على النموذج وحده."
      - "النموذج معطوب ويحتاج إعادة تدريب."
      - "عرض تفسير بلا ذكر طريقة بنائه عرض لنصف المعلومة."
      - "عدم استقرار التفسير نتيجة يجب الإبلاغ عنها لا تفصيلًا يُهمَل."
      - "التفسير اللاحق يثبت وجود علاقة سببية بين المتغير والمخرج."
    answer: [0, 2, 3]
    explanation: "النموذج والنقطة لم يتغيّرا؛ الذي تغيّر معلمة في بناء التفسير. والتقريب الخطي حول نقطة يصف الميل المحلي، فيتغير باتساع الجوار في دالّة غير خطية. ولا يثبت التفسير شيئًا سببيًا، فهو يقرّب النموذج لا العالم."
    review: m11-l04
  - id: m11-q05
    type: mcq
    bloom: evaluate
    prompt: "بطاقة نموذج تقول في خانة الحدود: «كأي نموذج إحصائي، قد يخطئ في بعض الحالات». ما تقييمك؟"
    options:
      - "صياغة مناسبة، فهي صادقة ومتواضعة."
      - "صياغة عديمة الفائدة لأنها غير قابلة للتكذيب وتنطبق على كل نموذج."
      - "صياغة كافية إذا كان الأداء العام مرتفعًا."
      - "صياغة مقبولة قانونًا لأنها تُعفي المؤسسة من المسؤولية."
    answer: 1
    explanation: "خانة الحدود يجب أن تحتوي جملًا يمكن أن تكون خاطئة، مثل: «يتجاوز معدل السلبي الكاذب 25٪ في الملفات الأقصر من صفحة، ولا نوصي باستعماله عليها». والإفصاح عن الحد يحوّله من مفاجأة إلى شرط استعمال."
    why_wrong:
      0: "التواضع اللفظي ليس إفصاحًا؛ الجملة لا تمنع أي استعمال خاطئ."
      2: "الأداء العام المرتفع يخفي فجوات الفئات، فلا يعوّض غياب الحدود."
      3: "الصياغة الفضفاضة لا تُعفي من المسؤولية، وقد تُقرأ إخفاءً لحدود معلومة."
    review: m11-l05
  - id: m11-q06
    type: tf
    bloom: understand
    prompt: "التدقيق الذاتي الداخلي يكفي للمساءلة إذا كان الفريق أمينًا ومحترفًا."
    answer: false
    explanation: "الأسباب بنيوية لا أخلاقية: تفحص ما تعرف أن تبحث عنه، وبيانات تقييمك من عالمك فقد لا تُظهر الفجوة، وتضارب المصالح قائم، ولا حافز لنشر نتيجة سلبية. فالتدقيق الذاتي للتحسين والمستقل للمساءلة."
    review: m11-l05
  - id: m11-q07
    type: mcq
    bloom: analyze
    prompt: "بعد تدقيق منشور على ثلاثة أنظمة تجارية، قِيس ما تغيّر بعد سبعة أشهر. ما الذي يجعل النتيجة دليلًا على أثر التدقيق نفسه؟"
    options:
      - "أن الشركات الثلاث أصدرت نسخًا جديدة."
      - "أن الفجوات تقلّصت عند الفئة الأسوأ حالًا."
      - "أن شركتين لم تكونا مستهدفتين بالتدقيق ظل أداؤهما متأخرًا بوضوح."
      - "أن التدقيق نُشر في مؤتمر علمي محكّم."
    answer: 2
    explanation: "المقارنة بغير المستهدفين هي ما يستبعد التفسير المنافس: لو كان التحسّن تطورًا تقنيًا عامًا في المجال، لظهر عند الجميع. وهذا منطق المقارنة المضادة نفسه من المحور 10."
    why_wrong:
      0: "إصدار نسخ جديدة وحده لا يميّز بين أثر التدقيق وتطور دوري معتاد."
      1: "تقلّص الفجوة نتيجة مهمة، لكنها لا تُنسب إلى التدقيق دون مجموعة مقارنة."
      3: "مكان النشر لا يُنشئ دليلًا على الأثر."
    review: m11-l05
  - id: m11-q08
    type: mcq
    bloom: apply
    prompt: "مؤسسة تريد نظامًا يحلّل نبرة رسائل موظفيها لقياس «الروح المعنوية». ما الموقف المهني الصحيح؟"
    options:
      - "الموافقة بشرط توثيق دقيق وأداء مفصّل بالفئات."
      - "الموافقة بشرط إعلام الموظفين بوجود النظام."
      - "الامتناع، فاستنتاج المشاعر في سياق العمل من الممارسات المحظورة، والمشكلة في وجود النظام لا في جودته."
      - "الموافقة بشرط أن تكون دقة النظام أعلى من 90٪."
    answer: 2
    explanation: "بعض الأضرار لا يعالجها تحسين النظام لأن مصدرها وجوده. والتوثيق والدقة لا يصلحان ممارسة محظورة. والموقف المهني الكامل يُرفق الامتناع ببديل مشروع: استطلاع طوعي مجهول الهوية."
    why_wrong:
      0: "التوثيق يجعل الممارسة المحظورة موثّقة، لا مشروعة."
      1: "الإعلام لا يحوّل ممارسة محظورة إلى مباحة، ولا يُنشئ موافقة حرة في علاقة عمل غير متكافئة."
      3: "الدقة العالية تزيد الضرر هنا ولا تقلّله."
    review: m11-l06
  - id: m11-q09
    type: mcq
    bloom: understand
    prompt: "ما الفكرة البنيوية في التنظيم الحديث لهذه الأنظمة؟"
    options:
      - "الالتزامات تتبع نوع التقنية المستعملة وحجم النموذج."
      - "الالتزامات تتبع الاستعمال ومستوى المخاطر، لا نوع التقنية ولا قوة النموذج."
      - "كل الأنظمة تخضع للالتزامات نفسها لضمان المساواة."
      - "الالتزامات تتبع حجم المؤسسة المشغّلة للنظام."
    answer: 1
    explanation: "التقنية نفسها قد تكون ضئيلة المخاطر في ترتيب مراجع مكتبة، وعالية المخاطر في ترتيب طلبات التحاق، وقد تقع في الممنوع في استنتاج حالة نفسية. فلا تسأل «هل نظامي خطر؟» بل «في أي استعمال، وعلى من، وبأي قرار؟»"
    why_wrong:
      0: "هذا هو بالضبط ما يتجاوزه التنظيم القائم على المخاطر."
      2: "التسوية بين نظام ترفيهي ونظام يمنح دعمًا عموميًا تسوية بين مختلفين."
      3: "حجم المؤسسة يؤثر في بعض التخفيفات الإجرائية لا في تصنيف المخاطر."
    review: m11-l06
  - id: m11-q10
    type: multi
    bloom: create
    prompt: "تصمّم سياسة مؤسسية لاستعمال نظام قراري في جامعة. أي البنود لا يجوز إغفالها؟ (اختر كل ما ينطبق)"
    options:
      - "قائمة الاستعمالات الممنوعة صراحةً، وعالية المخاطر التي تحتاج موافقة مسبقة."
      - "اسم مورّد النظام والسعر المتفاوض عليه."
      - "تحديد القرارات التي يُمنع فيها أن يكون القرار الآلي نهائيًا."
      - "مؤشرات تدقيق مع حدود تسامح بالأرقام ودورية محددة."
      - "تحديد من يملك سلطة إيقاف النظام والحالات التي يصير فيها الإيقاف إلزاميًا."
      - "سبيل إعلام المتأثر وطعنه ومدة الرد عليه."
    answer: [0, 2, 3, 4, 5]
    explanation: "الخمسة المختارة هي ما يجعل السياسة قابلة للتنفيذ والمساءلة. وبند الإيقاف مقياس جدية السياسة كلها، وهو أول ما يُحذف في الصياغات الشكلية. أما المورّد والسعر فمسألة تعاقدية لا حكامة."
    review: m11-l06
