module_number: 11
title: "أخلاقيات الذكاء الاصطناعي: الإنصاف، الشفافية، والتحيز"
short_title: أخلاقيات الذكاء الاصطناعي
title_en: "AI ethics: fairness, transparency and bias"
subtitle: من الشعار إلى المعيار — تعريفات دقيقة للإنصاف، وتعارض مُثبَت بينها، وأدوات توثيق وتدقيق تعمل فعلًا.
description: |
  هذا المحور هو **الأصعب فكريًا في المقرر**، لا لأن مفاهيمه معقّدة رياضيًا، بل لأنه يهدم توقعًا مريحًا:
  أن الأخلاقيات مجال «رأي» و«نوايا حسنة» يُكتفى فيه بالتوصية بالعدل والشفافية.

  والحقيقة أن **الإنصاف له تعريفات رياضية دقيقة**، وأن هذه التعريفات **تتعارض بينها تعارضًا مُثبَتًا**:
  فقد بُرهن أنه إذا اختلفت المعدلات القاعدية بين فئتين، **فلا يمكن** لأي نظام أن يحقق معايير الإنصاف
  الرئيسية في آن واحد. وهذا ليس نقصًا في الخوارزميات ولا في الجهد البحثي، بل **نتيجة رياضية** لا مخرج منها.

  ونتيجة ذلك أن السؤال يتحوّل تحوّلًا كاملًا: من «كيف نبني نظامًا عادلًا؟» إلى **«أي تعريف للعدالة
  نختار، ولماذا، ومن يتحمّل كلفة هذا الاختيار؟»** — وهذا سؤال **قِيَمي وسياسي** لا يجيب عنه مهندس، لكنه
  سؤال **يجب أن يُطرح صراحةً ويُوثَّق** لا أن يُترك ليُحسَم ضمنيًا في سطر من الرمز.

  ثم نفكك **التحيّز** إلى مصادره الحقيقية في كل مرحلة من مسار البيانات، ونبيّن بحالات موثّقة أن أشهر
  حالات التحيّز لم تنشأ من متغير حسّاس مُدرَج، بل من **متغير وكيل بدا محايدًا تمامًا**.

  ثم **الشفافية**: ما الفرق بين نموذج **قابل للتفسير** وتفسير **لاحق** يُلحَق بصندوق أسود؟ ولماذا يرى
  بعض الباحثين أن التفسير اللاحق في القرارات عالية الأثر **حل خاطئ للمسألة**؟

  ونختم بما يحوّل هذا كله إلى ممارسة: **بطاقات النماذج**، و**صحائف البيانات**، و**التدقيق الخارجي**،
  ثم **أطر الحكامة** الدولية وكيف تُترجم إلى إجراءات في مؤسسة أو في مذكرة بحثية.
estimated_duration: "6 حصص × 90 دقيقة"
difficulty: متقدم
keywords: [الإنصاف, التحيّز, الشفافية, القابلية للتفسير, التعارض المُثبَت, المعدل القاعدي, المتغير الوكيل, المعايرة, تكافؤ الفرص, بطاقة النموذج, صحيفة البيانات, التدقيق الخوارزمي, الحكامة]
concept_diagram: m11_concept_map
objectives:
  - {bloom: remember, text: "يعرّف التحيّز والإنصاف والمعايرة وتكافؤ الفرص والمتغير الوكيل تعريفات دقيقة."}
  - {bloom: understand, text: "يشرح لماذا تتعارض معايير الإنصاف الرئيسية رياضيًا عند اختلاف المعدلات القاعدية."}
  - {bloom: understand, text: "يفسّر كيف ينشأ التحيّز في كل مرحلة من مسار البيانات دون إدراج أي متغير حسّاس."}
  - {bloom: apply, text: "يطبق معايير الإنصاف على حالة محددة ويحسب مؤشراتها ويبيّن أثر تغيير العتبة."}
  - {bloom: analyze, text: "يحلل نظامًا قائمًا فيحدد متغيره الوكيل ومصدر تحيّزه ومن يتحمّل كلفة أخطائه."}
  - {bloom: evaluate, text: "يقيّم تفسيرًا لاحقًا لقرار نموذج ويحدد ما يثبته وما لا يثبته."}
  - {bloom: create, text: "يصمم بطاقة نموذج وصحيفة بيانات وخطة تدقيق لنظام في مجال تخصصه."}
prerequisites:
  - المحور 4 (التعلّم الآلي، والتقييم، ومقاييس الأداء).
  - المحاضرة 10.2 (التنبؤ ليس السببية).
  - المحاضرة 10.7 (المزالق المنهجية والتوثيق).
  - المحاضرة 9.5 (تحيّز النماذج التوليدية) — إن دُرِّس المحور 9.
entry:
  prior_knowledge:
    - "يعرف الطالب من المحور 4 مصفوفة الالتباس ومقاييس الأداء؛ نبني عليها مباشرة، فمعايير الإنصاف كلها مبنية منها."
    - "يعرف من المحاضرة 10.2 أن الارتباط ليس سببية؛ نستعمله هنا لفهم كيف يعمل المتغير الوكيل."
    - "يعرف من المحاضرة 10.7 قيمة التوثيق؛ ننقلها من حماية المنهج إلى حماية المتأثرين بالنظام."
    - "يعرف من المحاضرة 9.5 أن النماذج التوليدية تضخّم الصور النمطية؛ نعمّم المبدأ على كل نظام قراري."
  diagnostic_questions:
    - نظام لا يستعمل الجنس ولا الأصل ولا المنطقة في قرار منح القرض. هل هذا يكفي لوصفه بالعادل؟ ولماذا؟
    - "إذا قال لك نظامان إن «كلاهما عادل» لكنهما يعطيان قرارين مختلفين للشخص نفسه، فما الذي تستنتجه؟"
    - ما معنى أن يكون نظام «شفافًا»؟ وهل نشر رمزه يكفي؟ وهل شرح قراره يكفي؟
    - مستشفى يريد تحديد المرضى المحتاجين لرعاية مكثّفة، فاستعمل **تكلفة العلاج السابقة** مؤشرًا على الحاجة. ما المشكلة المحتملة؟
    - من يجب أن يقرر تعريف «العدالة» في نظام يمنح منحًا دراسية؟ المهندس؟ أم الإدارة؟ أم المتأثرون؟
exit:
  competencies:
    - أستطيع أن أشرح ثلاثة تعريفات للإنصاف وأحسب مؤشر كل منها من مصفوفة الالتباس.
    - أستطيع أن أبيّن بمثال عددي لماذا لا تتحقق هذه التعريفات معًا عند اختلاف المعدلات القاعدية.
    - أستطيع أن أكشف المتغير الوكيل في نظام قراري وأشرح كيف ينقل التحيّز دون ذكر أي متغير حسّاس.
    - أستطيع أن أميّز بين نموذج قابل للتفسير وتفسير لاحق، وأحدد حدود ما يثبته كل منهما.
    - أستطيع أن أكتب بطاقة نموذج وصحيفة بيانات لنظام أعمل عليه.
    - أستطيع أن أصوغ سؤال العدالة بوصفه قرارًا قِيَميًا موثّقًا لا مسألة تقنية مخفية.
  assessment_activities:
    - "اختبار بعدي يجمع التعريفات والتعارض المُثبَت ومصادر التحيّز وحدود التفسير."
    - "تمرين حسابي: من مصفوفتي التباس لفئتين، احسب معايير الإنصاف الثلاثة وبيّن التعارض."
    - "نقد حالة: نظام قراري موصوف، يُطلب كشف متغيره الوكيل ومصدر تحيّزه."
    - "نشاط شفوي: مناقشة بأدوار (مهندس، متأثر، مدير، منظّم) حول اختيار تعريف العدالة في حالة واحدة."
    - "مشروع مصغّر: بطاقة نموذج وصحيفة بيانات وخطة تدقيق لنظام من اختيار الطالب."
    - "تمرين كتابي: أعد صياغة ادعاء «هذا النظام عادل» صياغة قابلة للفحص."
  common_mistakes:
    - الاعتقاد أن حذف المتغيرات الحسّاسة يمنع التحيّز.
    - الاعتقاد أن هناك تعريفًا واحدًا صحيحًا للإنصاف يكفي السعي إليه.
    - قراءة التعارض المُثبَت بوصفه مشكلة تقنية ستُحل بخوارزميات أفضل.
    - الخلط بين نشر الرمز والشفافية، وبين التفسير اللاحق وفهم النموذج.
    - معاملة مقياس أهمية المتغيرات بوصفه تفسيرًا سببيًا لقرار فردي.
    - نسيان أن اختيار المتغير الهدف نفسه قرار أخلاقي، لا خطوة تقنية.
    - الاكتفاء بالنية الحسنة بديلًا عن قياس وتوثيق وتدقيق.
  remediation:
    - إذا التبس عليك التعارض المُثبَت، شغّل مختبر معايير الإنصاف (المحاضرة 11.3) وحاول تحقيق المعايير الثلاثة معًا؛ فالفشل العملي المتكرر يُثبّت النتيجة أكثر من البرهان.
    - إذا ظننت أن حذف المتغير الحسّاس يكفي، أعد مختبر المتغير الوكيل (المحاضرة 11.2) وراقب ما يحدث للفجوة.
    - إذا صعب التمييز بين التفسير والقابلية للتفسير، أعد المحاضرة 11.4 وطبّق جدول الأسئلة الأربعة على تفسير واحد.
    - راجع مصفوفة الالتباس في المحور 4 قبل 11.3، فكل معايير الإنصاف مبنية منها ولا تُفهم بدونها.
    - إذا بدا المحور كله نظريًا، ابدأ من المحاضرة 11.5 واكتب بطاقة نموذج لنظام تعرفه؛ فالتوثيق يُرسّخ المفاهيم بالممارسة.
  suggested_reading: [m11_barocas_hardt_narayanan, m11_chouldechova_2017, m11_kleinberg_2016_tradeoffs, m01_obermeyer_2019, m11_rudin_2019, m11_mitchell_2019_modelcards]
  bridge: |
    تناولنا حتى الآن عدالة القرار وشفافيته: **من يتأثر، وبأي معيار، وبأي تفسير**. لكن هناك سؤالًا موازيًا
    لم يُطرح بعد: **هذه الأنظمة تعمل على بيانات عن أشخاص — فمن يملكها؟ وإلى أين تذهب؟ وما الذي يُستخرج
    منها دون أن يعلم أصحابها؟** و**المحور 12** ينتقل إلى الخصوصية والأمان: ما الذي يحدث فعلًا لما تكتبه
    في نافذة محادثة، وكيف تُستنتج معلومة لم تُصرّح بها، وما الثغرات الأمنية الخاصة بهذه الأدوات،
    وما الضوابط العملية التي تحمي بياناتك وبيانات من تبحث عنهم.
instructor:
  sequence:
    - "11.1 مدخل يهدم توقع «الأخلاقيات = نوايا حسنة»؛ لا تختصره فهو ما يجعل بقية المحور مقبولًا."
    - "11.2 (مصادر التحيّز) تطبيقية وقريبة من الحدس؛ قدّمها قبل الرياضيات لتبني الدافعية."
    - "11.3 (التعريفات والتعارض) هي **عمود المحور** وأثقل حصة فيه: خصص لها حصة كاملة بمختبرها."
    - "11.4 (الشفافية) تحتاج ضبطًا: لا تتحول إلى عرض لأدوات، فالمقصود حدودها لا أسماؤها."
    - "11.5 (التوثيق والتدقيق) هي أعمل الحصص؛ اجعلها ورشة كتابة لا محاضرة."
    - "11.6 (الحكامة) تختم بالربط بالأطر الدولية؛ يمكن اختصارها إن ضاق الوقت لصالح 11.3."
  timing:
    - "الحصة 1 (90 د): الأسئلة التشخيصية (15 د) + المحاضرة 11.1 (55 د) + نقاش (20 د)."
    - "الحصة 2 (90 د): المحاضرة 11.2 مع مختبر المتغير الوكيل."
    - "الحصة 3 (90 د): المحاضرة 11.3 مع مختبر معايير الإنصاف — ولا تُختصر."
    - "الحصة 4 (90 د): المحاضرة 11.4 مع مختبر حدود التفسير."
    - "الحصة 5 (90 د): المحاضرة 11.5 كورشة كتابة بطاقة نموذج وصحيفة بيانات."
    - "الحصة 6 (90 د): المحاضرة 11.6 (45 د) + مناقشة بأدوار (20 د) + الاختبار البعدي (25 د)."
    - "في مقرر قصير: 11.2 و11.3 و11.5 هي الحد الأدنى الذي لا ينزل عنه."
  discussion:
    - "إذا كان التعارض بين معايير الإنصاف مُثبَتًا رياضيًا، فمن يملك حق اختيار المعيار؟"
    - "هل يجوز نشر نظام قراري لا يستطيع صاحبه شرح قراراته، إذا كان أداؤه أفضل من البشر؟"
    - "هل التحيّز في النظام مشكلة النظام أم مرآة لمشكلة في البيانات التي تعكس مجتمعًا؟ وما الفرق العملي بين الجوابين؟"
    - "من يجب أن يتحمّل كلفة الخطأ: المتأثر، أم المؤسسة، أم من بنى النظام؟"
    - "هل يكفي التدقيق الخارجي دون سلطة إلزام؟"
  assessment_ideas:
    - "أعطِ مصفوفتي التباس لفئتين واطلب حساب المعايير الثلاثة وتفسير استحالة اجتماعها."
    - "اعرض وصف نظام قراري فيه متغير وكيل مزروع واطلب كشفه وتسمية نوع التحيّز."
    - "اعرض تفسيرًا لاحقًا لقرار واطلب تحديد ما يثبته وما لا يثبته."
    - "اطلب كتابة بطاقة نموذج لنظام حقيقي يعرفه الطالب، وقيّم دقة خانة «الحدود»."
    - "سؤال مقالي: «حذف المتغير الحسّاس لا يجعل النظام عادلًا». اشرح بمثال عددي."
  extensions:
    - "قراءة ورقة Chouldechova (2017) كاملة وإعادة اشتقاق العلاقة بين المعايير بأنفسهم."
    - "قراءة Kleinberg وMullainathan وRaghavan (2016) ومناقشة صياغة البرهان."
    - "قراءة Rudin (2019) ومناقشة الحجة ضد التفسير اللاحق في القرارات عالية الأثر."
    - "قراءة Selbst وآخرين (2019) ومناقشة مصائد التجريد الخمسة على حالة محلية."
    - "مقارنة تصنيف المخاطر في قانون الذكاء الاصطناعي الأوروبي بإطار NIST لإدارة المخاطر."
