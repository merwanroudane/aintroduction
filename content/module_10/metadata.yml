module_number: 10
title: استخدام الذكاء الاصطناعي في الاقتصاد
short_title: الذكاء الاصطناعي والاقتصاد
title_en: "Artificial intelligence in economics"
subtitle: من التمييز بين التنبؤ والسببية إلى الطرق الحديثة والتنبؤ الآني وتحليل النصوص، ثم أثر التقنية في الإنتاجية والعمل.
description: |
  هذا المحور هو **أطول محاور المقرر وأغزرها**، وذلك مقصود: فأنت طالب اقتصاد، وهذا هو الموضع الذي تلتقي فيه
  كل المفاهيم السابقة بتخصصك.

  ونبدأ بالتمييز الذي يحكم المحور كله ويحكم استعمالك للتعلّم الآلي طول حياتك المهنية: **التنبؤ ليس
  السببية**. فالتعلّم الآلي أداة تنبؤ ممتازة، وأغلب أسئلة الاقتصاد **سببية**. وحين يُستعمل نموذج تنبؤي
  للإجابة عن سؤال سببي، تخرج نتائج **دقيقة العرض وخاطئة المعنى**.

  ثم نفتح الطرق التي بُنيت خصيصًا لهذا الجسر: **التعلّم الآلي المزدوج منزوع التحيّز**، و**الغابات السببية**
  لتقدير الأثر غير المتجانس، و**طرق الأبعاد العالية** لاختيار المتغيرات الضابطة. وهذه ليست استعراضًا:
  هي أدوات تحتاجها في مذكرتك.

  ثم **التنبؤ الآني (Nowcasting)** والبيانات البديلة، و**النص بوصفه بيانات** — وهو مجال نشط ومثمر في
  الاقتصاد له تاريخ قبل النماذج اللغوية، ومن يعرف ذلك التاريخ يستعمل الأدوات الجديدة استعمالًا أرشد.

  ثم **الأثر الاقتصادي**: الإنتاجية، ومنحنى الإنتاجية على شكل J، والأتمتة مقابل المهام الجديدة، وما
  **قِيس فعلًا** في التجارب الميدانية مقابل ما هو **توقّع**.

  ونختم بمحاضرة لا يستغني عنها باحث: **المزالق المنهجية** — تسرّب البيانات، وفرط الملاءمة، والتنقيب عن
  النتائج بأدوات التعلّم الآلي، وأزمة إعادة الإنتاج في العلوم القائمة عليه.
estimated_duration: "7 حصص × 90 دقيقة"
difficulty: متقدم
keywords: [التنبؤ, الاستدلال السببي, التعلّم الآلي المزدوج, الغابات السببية, الأثر غير المتجانس, الأبعاد العالية, التنبؤ الآني, البيانات البديلة, النص بوصفه بيانات, الإنتاجية, منحنى J, الأتمتة, المهام الجديدة, تسرّب البيانات, إعادة الإنتاج]
concept_diagram: m10_concept_map
objectives:
  - {bloom: remember, text: "يعرّف التنبؤ والاستدلال السببي والأثر غير المتجانس والتنبؤ الآني وتسرّب البيانات."}
  - {bloom: understand, text: "يشرح لماذا لا يجيب النموذج التنبؤي عن السؤال السببي مهما بلغت دقته."}
  - {bloom: understand, text: "يفسّر منطق التعلّم الآلي المزدوج وفصل مرحلة التنبؤ عن مرحلة التقدير."}
  - {bloom: apply, text: "يختار الأداة المناسبة لسؤال بحثي محدد ويبرر اختياره بطبيعة السؤال لا بحداثة الأداة."}
  - {bloom: analyze, text: "يحلل دراسة تطبيقية ويحدد هل ادعاؤها تنبؤي أم سببي وهل يسنده تصميمها."}
  - {bloom: evaluate, text: "يقيّم ادعاءً عن أثر الذكاء الاصطناعي في الاقتصاد بمستويات الأدلة ويحدد ما قِيس وما لم يُقَس."}
  - {bloom: create, text: "يصمم مسار تحليل قابلًا لإعادة الإنتاج مع ضوابط تمنع تسرّب البيانات."}
prerequisites:
  - المحور 4 (التعلّم الآلي، والتقييم، وفرط الملاءمة).
  - المحاضرة 1.4 (مستويات الأدلة).
  - المحور 8 (التحقق والنزاهة).
  - خلفية في الاقتصاد القياسي على مستوى الليسانس.
entry:
  prior_knowledge:
    - "يعرف الطالب من دراسته للاقتصاد القياسي الفرق بين التقدير والتنبؤ؛ نبني عليه ونشدّده هنا."
    - "يعرف من المحاضرة 4.5 فرط الملاءمة وتقسيم البيانات؛ نطبّقه على البيانات الاقتصادية بخصوصياتها الزمنية."
    - "يعرف من المحاضرة 1.4 مستويات الأدلة؛ نستعملها في فرز الادعاءات عن أثر الذكاء الاصطناعي."
    - "يعرف من المحور 8 منهج التحقق؛ ننقله إلى الأرقام والدراسات الاقتصادية."
  diagnostic_questions:
    - نموذج يتنبأ بأسعار المساكن بدقة 95%. هل يمكنك أن تستعمله لتقدير أثر بناء مدرسة جديدة على الأسعار؟ ولماذا؟
    - ما الفرق بين سؤال «كم سيكون معدل التضخم الشهر القادم؟» وسؤال «ما أثر رفع سعر الفائدة على التضخم؟»
    - إذا قسّمت بيانات سلسلة زمنية عشوائيًا إلى تدريب واختبار، فما المشكلة؟
    - سمعتَ أن «الذكاء الاصطناعي يرفع الإنتاجية بنسبة كذا». ما الأسئلة التي تطرحها قبل تصديق الرقم؟
exit:
  competencies:
    - أستطيع أن أحدد هل سؤالي البحثي تنبؤي أم سببي، وأختار الأداة على هذا الأساس.
    - أستطيع أن أشرح منطق التعلّم الآلي المزدوج وأعرف متى يُستعمل.
    - أستطيع أن أصمم مسار تنبؤ آني مع تقسيم زمني سليم للبيانات.
    - أستطيع أن أبني مؤشرًا من النصوص وأعرف حدود صلاحيته.
    - أستطيع أن أقيّم ادعاءً عن أثر الذكاء الاصطناعي في الإنتاجية أو العمل بمستويات الأدلة.
    - أستطيع أن أكشف تسرّب البيانات في تصميم تحليلي وأصححه.
  assessment_activities:
    - "اختبار بعدي يجمع التمييز بين التنبؤ والسببية والطرق الحديثة وتقييم الأدلة."
    - "تمرين تصنيف: عشرة أسئلة بحثية، تُصنّف تنبؤية أو سببية مع تبرير واختيار الأداة."
    - "نقد دراسة تطبيقية: هل ادعاؤها يطابق تصميمها؟"
    - "تمرين كشف التسرّب: ثلاثة تصاميم تحليلية فيها تسرّب مزروع."
    - "مشروع مصغّر: تصميم تحليل قابل لإعادة الإنتاج لسؤال من تخصص الطالب."
  common_mistakes:
    - قراءة معاملات نموذج تنبؤي على أنها آثار سببية.
    - التقسيم العشوائي لبيانات سلسلة زمنية.
    - استعمال متغيرات لا تتوفر وقت التنبؤ الفعلي.
    - الخلط بين دقة التنبؤ وصحة النموذج الاقتصادي.
    - تعميم نتائج تجربة على مهام قصيرة إلى الاقتصاد كله.
    - الخلط بين الأثر على الفرد والأثر على الاقتصاد الكلي.
  remediation:
    - إذا التبس التمييز بين التنبؤ والسببية، أعد المحاضرة 10.2 وطبّق جدول الأسئلة على خمسة أسئلة من تخصصك.
    - إذا صعب عليك فهم التعلّم الآلي المزدوج، شغّل مختبر التحيّز بالانتظام وقارن التقديرين (المحاضرة 10.3).
    - إذا لم تكتشف التسرّب في التمرين، أعد قائمة الأنماط الستة وطبّقها على تحليل سابق لك (المحاضرة 10.7).
    - راجع المحاضرة 1.4 قبل 10.6، فتقييم الأدلة هو أداة تلك المحاضرة كلها.
  suggested_reading: [m10_mullainathan_2017, m10_athey_imbens_2019, m10_korinek_2023, m10_brynjolfsson_2025_genai_work, m10_kapoor_2023_leakage]
  bridge: |
    رأينا ما تستطيع هذه الأدوات فعله في الاقتصاد، وما لا تستطيعه، وأين تخطئ. لكن السؤال الأعمق لم يُطرح
    بعد: **حين يتخذ نظام قرارًا يمسّ إنسانًا — قرض، أو توظيف، أو منحة — بأي معيار نحكم على عدالته؟**
    و**المحور 11** ينتقل إلى أخلاقيات الذكاء الاصطناعي: الإنصاف، والشفافية، والتحيّز — لا بوصفها شعارات،
    بل بتعريفات رياضية دقيقة بينها **تعارض مُثبَت** لا يمكن تجاوزه.
instructor:
  sequence:
    - "10.1 مدخل يضع الخريطة؛ يمكن اختصاره إن كانت خلفية الطلبة الاقتصادية قوية."
    - "10.2 (التنبؤ مقابل السببية) هي **عمود المحور**: لا تختصرها ولا تؤخّرها."
    - "10.3 (الطرق الحديثة) متقدمة: اضبط عمقها بحسب مستوى الطلبة في القياس."
    - "10.4 و10.5 تطبيقيتان ويمكن دمجهما في حصة واحدة عند الضرورة."
    - "10.6 (الأثر الاقتصادي) هي الأكثر إثارة للنقاش؛ اضبطها بمستويات الأدلة."
    - "10.7 (المزالق) لا تُختصر: هي ما يحمي مذكراتهم فعليًا."
  timing:
    - "الحصة 1 (90 د): الأسئلة التشخيصية (10 د) + المحاضرة 10.1 (60 د) + نقاش (20 د)."
    - "الحصة 2 (90 د): المحاضرة 10.2 مع تمرين التصنيف كاملًا."
    - "الحصة 3 (90 د): المحاضرة 10.3 مع مختبر التحيّز بالانتظام."
    - "الحصة 4 (90 د): المحاضرة 10.4 مع مختبر التقسيم الزمني."
    - "الحصة 5 (90 د): المحاضرة 10.5 مع مختبر بناء مؤشر نصي."
    - "الحصة 6 (90 د): المحاضرة 10.6 مع تمرين تقييم الأدلة."
    - "الحصة 7 (90 د): المحاضرة 10.7 + الاختبار البعدي (25 د)."
    - "في مقرر قصير: 10.2 و10.6 و10.7 هي الحد الأدنى الذي لا ينزل عنه."
  discussion:
    - "هل يغيّر التعلّم الآلي من طبيعة السؤال الاقتصادي أم من أدوات الإجابة عنه فقط؟"
    - "إذا تنبأ نموذج بالتعثر الائتماني بدقة عالية دون أن نفهم لماذا، هل يُستعمل في قرار إقراض؟"
    - "لماذا تأخر ظهور أثر تقنيات المعلومات في إحصاءات الإنتاجية؟ وهل يتكرر ذلك اليوم؟"
    - "من يستفيد من مكاسب الإنتاجية؟ وهل هذا سؤال اقتصادي أم سياسي؟"
  assessment_ideas:
    - "أعطِ ملخص دراسة واطلب تحديد هل ادعاؤها تنبؤي أم سببي وهل يسنده تصميمها."
    - "اعرض تصميم تحليل فيه تسرّب مزروع واطلب كشفه وتصحيحه."
    - "اطلب تقييم عنوان صحفي عن أثر الذكاء الاصطناعي في الوظائف بالرجوع إلى المصدر الأولي."
    - "سؤال مقالي: «دقة التنبؤ ليست صحة اقتصادية». اشرح بمثال."
  extensions:
    - "قراءة Mullainathan و Spiess (2017) كاملة ومناقشة مثال أسعار المساكن فيها."
    - "قراءة ورقة التعلّم الآلي المزدوج ومناقشة دور تقسيم العينة في نزع التحيّز."
    - "مقارنة تقديرات منظمات دولية مختلفة لأثر الذكاء الاصطناعي على العمل، وتفسير اختلافها بالمنهج."
    - "قراءة Kapoor و Narayanan (2023) وتطبيق قائمة التسرّب على ورقة منشورة في الاقتصاد."
