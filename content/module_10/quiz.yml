entry:
  - id: m10-e01
    type: mcq
    bloom: understand
    prompt: "نموذج يتنبأ بأسعار المساكن بدقة 95٪. هل يصلح لتقدير أثر بناء مدرسة جديدة على الأسعار؟"
    options:
      - "نعم، فالدقة العالية دليل على صحة النموذج."
      - "لا، فالسؤال سببي والنموذج تنبؤي، والدقة لا تسند ادعاءً سببيًا."
      - "نعم، بشرط إضافة متغير وجود المدرسة إلى النموذج."
      - "لا، لأن دقة 95٪ غير كافية لهذا النوع من الأسئلة."
    answer: 1
    explanation: "التنبؤ والسببية مسألتان مختلفتان لا درجتان. ودقة التنبؤ تُقاس خارج العينة، أما صحة التقدير السببي فتأتي من التصميم. والخيار الثالث خطأ شائع: إضافة المتغير لا تجعل معامله أثرًا."
    review: m10-l02
  - id: m10-e02
    type: tf
    bloom: remember
    prompt: "سؤال «كم سيكون معدل التضخم الشهر القادم؟» وسؤال «ما أثر رفع سعر الفائدة على التضخم؟» سؤالان من النوع نفسه يختلفان في الصعوبة."
    answer: false
    explanation: "الأول تنبؤي ويسأل عن قيمة، والثاني سببي ويسأل عن أثر تدخّل. ومعيار تقييم كل منهما مختلف تمامًا: الدقة خارج العينة في الأول، وقابلية التعرّف وصحة التصميم في الثاني."
    review: m10-l02
  - id: m10-e03
    type: mcq
    bloom: apply
    prompt: "قسّمتَ بيانات سلسلة زمنية شهرية تقسيمًا عشوائيًا إلى تدريب واختبار. ما المشكلة الأساسية؟"
    options:
      - "لا مشكلة ما دامت النسبة 70/30."
      - "حجم عينة الاختبار يصير صغيرًا جدًا."
      - "المشاهدات المتجاورة زمنيًا متشابهة، فيصير النموذج قد رأى جواب الاختبار تقريبًا."
      - "التقسيم العشوائي يغيّر ترتيب الأعمدة."
    answer: 2
    explanation: "الارتباط الذاتي يجعل لحظة t في التدريب و t+1 في الاختبار شبه متطابقتين. ويضاف إليه سبب مستقل: التغيّر البنيوي يُوزَّع على الجانبين فيتعلم النموذج نظامًا لن يراه في التشغيل الفعلي."
    review: m10-l04
  - id: m10-e04
    type: mcq
    bloom: evaluate
    prompt: "سمعتَ: «الذكاء الاصطناعي يرفع الإنتاجية بنسبة كذا». ما أول سؤال تطرحه؟"
    options:
      - "هل الرقم حديث؟"
      - "من نشر الرقم؟ هل هي جهة موثوقة؟"
      - "ما المصدر الأولي، وما التعريف الدقيق للمتغير المقيس، وما نطاق الدراسة؟"
      - "هل يتفق الرقم مع تقديرات أخرى منشورة؟"
    answer: 2
    explanation: "سمعة الناشر وحداثة الرقم واتفاقه مع غيره كلها مفيدة، لكنها لاحقة. فالرقم نفسه يتغيّر معناه بتغيّر تعريف المتغير (تعرّض؟ أثر؟ إنتاجية مهمة؟) وبتغيّر نطاق الدراسة."
    review: m10-l06
  - id: m10-e05
    type: tf
    bloom: understand
    prompt: "إذا أعطى نموذجك دقة مرتفعة ارتفاعًا مفاجئًا، فهذه علامة جيدة تستحق التسجيل في النتائج."
    answer: false
    explanation: "القفزة غير المتوقعة في الأداء هي فرضية تسرّب حتى يثبت العكس. والتسرّب لا تكشفه مقاييس الأداء لأنه يحسّنها، فيظهر نجاحًا لا عطبًا."
    review: m10-l07

questions:
  - id: m10-q01
    type: scenario
    bloom: analyze
    scenario: "نموذج تنبؤي مدرَّب على بيانات مستشفى يجد أن تناول دواء قوي جدًا من أقوى منبئات الوفاة، والنتيجة تتكرر في كل العينات بدقة عالية."
    prompt: "ما الاستنتاج الصحيح؟"
    options:
      - "الدواء يرفع خطر الوفاة، ويجب مراجعة استعماله."
      - "النموذج معطوب ويجب إعادة تدريبه ببيانات أنظف."
      - "الدواء مؤشر على شدة المرض لا سبب للوفاة، وأثره السببي قد يكون إيجابيًا قويًا."
      - "البيانات غير كافية للحكم، ويلزم رفع حجم العينة."
    answer: 2
    explanation: "الأطباء يصفون الدواء القوي للحالات الأشد، فالدواء وكيل عن شدة المرض. والنموذج أدّى مهمته بامتياز؛ والخطأ في السؤال الموجَّه إليه لا في النموذج ولا في البيانات."
    why_wrong:
      0: "هذه هي القراءة السببية الساذجة التي يحذّر منها الدرس كله: قراءة معامل نموذج تنبؤي على أنه أثر."
      1: "النموذج ليس معطوبًا، فهو يتنبأ بالوفاة تنبؤًا صحيحًا. والعطب في استعماله للإجابة عن سؤال لم يُبنَ له."
      3: "زيادة العينة لا تغيّر شيئًا هنا، فالمشكلة تحيّز بنيوي في تفسير المعامل لا عدم دقة."
    review: m10-l02
  - id: m10-q02
    type: mcq
    bloom: understand
    prompt: "ما وظيفة تقسيم العينة المتقاطع في التعلّم الآلي المزدوج؟"
    options:
      - "رفع دقة نموذجي التنبؤ في الخطوتين الأولى والثانية."
      - "منع فرط الملاءمة في مرحلة التنبؤ من تلويث تقدير معامل الأثر."
      - "تقليل زمن الحساب بتوزيع العمل على أجزاء العينة."
      - "اختيار المتغيرات الضابطة التي تدخل النموذج النهائي."
    answer: 1
    explanation: "لو حُسبت البواقي بنموذج رأى المشاهدة نفسها، لكان قد فرط ملاءمتها، فتخرج البواقي أصغر مما ينبغي بطريقة منتظمة، فيتحيّز التقدير. والتقسيم يضمن أن باقي كل مشاهدة محسوب بنموذج لم يرَها."
    why_wrong:
      0: "التقسيم لا يرفع دقة نموذجي التنبؤ، بل قد يخفضها قليلًا لأن كلًا منهما يُقدَّر على جزء من البيانات."
      2: "الفائدة ليست حسابية؛ والتقسيم المتقاطع يزيد زمن الحساب لا ينقصه."
    review: m10-l03
  - id: m10-q03
    type: multi
    bloom: apply
    prompt: "أي هذه المتغيرات يخرق شرط التوفر اللحظي في نموذج يتنبأ بتعثر قرض لحظة اتخاذ قرار المنح؟ (اختر كل ما ينطبق)"
    options:
      - "دخل المقترض المصرّح به في الملف."
      - "عدد مكالمات قسم التحصيل."
      - "مدة القرض المطلوبة."
      - "التصنيف النهائي للمخاطرة الذي يُحدَّد بعد دراسة الملف."
      - "إجمالي مشتريات المقترض للسنة الجارية غير المكتملة."
    answer: [1, 3, 4]
    explanation: "مكالمات التحصيل تقع بعد ظهور التعثر، والتصنيف النهائي يُحدَّد بعد لحظة القرار المدروسة، والمجموع السنوي لسنة لم تكتمل يحمل معلومة من بعد لحظة التنبؤ. أما الدخل المصرّح به ومدة القرض فمتاحان في الملف لحظة القرار."
    review: m10-l04
  - id: m10-q04
    type: mcq
    bloom: analyze
    prompt: "طالب بنى مؤشر نبرة من أرشيف صحيفة، فوجد قفزة حادة سنة معيّنة وفسّرها اقتصاديًا. ما أول ما كان عليه فحصه؟"
    options:
      - "هل القاموس المستعمل مناسب للسياق الاقتصادي؟"
      - "عدد النصوص ومتوسط طولها عبر الزمن، وهل تغيّرت سياسة النشر."
      - "هل ترتبط القفزة بمؤشرات اقتصادية أخرى في الفترة نفسها."
      - "هل تظهر القفزة نفسها في صحيفة ثانية."
    answer: 1
    explanation: "القفزة قد تكون في المجموعة لا في الاقتصاد: تغيّر نظام النشر يرفع عدد النصوص فيرتفع أي مؤشر يقوم على العدّ المطلق. وفحص عدد النصوص وطولها يستغرق دقائق ويسبق كل تحليل."
    why_wrong:
      0: "ملاءمة القاموس مسألة حقيقية ومهمة، لكنها لا تفسّر قفزة في سنة بعينها ما دام القاموس ثابتًا عبر الفترة كلها."
      2: "هذا تحقق خارجي مفيد، لكنه يأتي بعد التأكد من أن القفزة ليست أثرًا لتغيّر في المجموعة نفسها."
      3: "مقارنة بمصدر ثانٍ فحص جيد، لكن فحص المجموعة نفسها أسرع وأقرب إلى السبب الأرجح."
    review: m10-l05
  - id: m10-q05
    type: scenario
    bloom: evaluate
    scenario: "دراسة تجد ارتفاعًا بنحو 14٪ في عدد المسائل المحلولة في الساعة لدى موظفي دعم عملاء أتيح لهم مساعد توليدي، ونحو 34٪ لدى الأقل خبرة."
    prompt: "أي الصياغات التالية مسنودة بهذا التصميم؟"
    options:
      - "الذكاء الاصطناعي يرفع الإنتاجية بنسبة 14٪."
      - "في مركز دعم عملاء، ارتفع عدد المسائل المحلولة في الساعة بنحو 14٪ في المتوسط، وبنحو 34٪ لدى الأقل خبرة."
      - "الذكاء الاصطناعي سيرفع الناتج المحلي الإجمالي بنسبة 14٪."
      - "الذكاء الاصطناعي يقلّص الفجوة بين العمال المهرة وغير المهرة في الاقتصاد."
    answer: 1
    explanation: "الرقم صحيح في نطاقه: نوع عمل محدد، ومقياس محدد، وفترة وأداة محددتان. والصياغة المسنودة تنقل النطاق في الجملة نفسها."
    why_wrong:
      0: "تعميم من مستوى المهمة إلى «الإنتاجية» مطلقةً، ومن مقياس واحد إلى كل أنواع العمل."
      2: "قفزة من مستوى المهمة إلى المستوى الكلي، وهو انتقال لا يجيزه أي تصميم من هذا النوع."
      3: "النمط موثّق داخل مهن محددة، أما التفاوت الكلي فيعتمد على توزيع الوصول والعائد لا على أداء الأداة."
    review: m10-l06
  - id: m10-q06
    type: tf
    bloom: understand
    prompt: "التعلّم الآلي المزدوج يعالج مشكلة المُربِكات غير الملحوظة."
    answer: false
    explanation: "يعالج تحيّز الانتظام وفرط الملاءمة في وجود ضوابط كثيرة، ويفترض أن الضوابط تحتوي كل المُربِكات. وهو يحل مشكلة «كثرة المتغيرات الضابطة» لا مشكلة «غياب متغير ضابط»، وهما مشكلتان مختلفتان."
    review: m10-l03
  - id: m10-q07
    type: mcq
    bloom: analyze
    prompt: "تقدير كلي منشور يقول إن مكاسب الإنتاجية الكلية لا تتجاوز أقل من واحد في المئة عبر عشر سنوات، بينما تجد تجارب ميدانية مكاسب بعشرات في المئة على مهام بعينها. كيف تُقرأ الفجوة؟"
    options:
      - "أحد الرقمين خاطئ، ويرجّح الترجيح بينهما بحسب سمعة الدورية."
      - "الرقمان يقيسان شيئين مختلفين، فالمهام المتأثرة جزء من العمل والوظائف المتأثرة جزء من الاقتصاد."
      - "التقدير الكلي متشائم لأنه لا يأخذ التقنيات القادمة في الحسبان."
      - "التجارب الميدانية متفائلة لأنها أُجريت في شركات متقدمة."
    answer: 1
    explanation: "الانتقال بين المستويات ليس جمعًا: المهمة التي تتحسن 30٪ قد تمثل جزءًا صغيرًا من وقت العامل، وكثير من النشاط في مهن لا تمسّها هذه الأدوات، والمكاسب تصطدم بقيود التنظيم والتنسيق."
    why_wrong:
      0: "لا تناقض يستدعي ترجيحًا، والترجيح بسمعة الدورية ليس معيارًا منهجيًا أصلًا."
      2: "هذه حجة يمكن مناقشتها، لكنها لا تفسّر الفجوة البنيوية بين مستوى المهمة والمستوى الكلي."
      3: "خصوصية سياق التجربة اعتبار حقيقي في التعميم، لكنه لا يفسّر رتبة الفجوة بين المستويين."
    review: m10-l06
  - id: m10-q08
    type: mcq
    bloom: create
    prompt: "تصمّم مسار تنبؤ بتعثر مؤسسات لها عدة قروض لكل منها، على بيانات 2016–2025. ما التقسيم الصحيح؟"
    options:
      - "عشوائي على مستوى القرض، 70/30."
      - "عشوائي على مستوى المؤسسة، مع إبقاء كل قروض المؤسسة في جانب واحد."
      - "زمني وعلى مستوى المؤسسة معًا، مع فجوة أمان تساوي أفق التنبؤ."
      - "زمني على مستوى القرض، بلا فجوة."
    answer: 2
    explanation: "يجتمع هنا خطران: تكرار السجلات (قروض المؤسسة الواحدة على الجانبين) والتسرّب الزمني. فيلزم التقسيم على مستوى المؤسسة وزمنيًا معًا، مع فجوة تساوي أفق التنبؤ وإلا تسرّبت فترة التداخل."
    why_wrong:
      0: "يجمع الخطأين معًا: تكرار السجلات وتسرّب زمني."
      1: "يعالج تكرار السجلات ويترك التسرّب الزمني قائمًا."
      3: "يعالج الزمن ويترك قروض المؤسسة الواحدة موزّعة على الجانبين، ثم يهمل فجوة الأمان."
    review: m10-l07
  - id: m10-q09
    type: mcq
    bloom: evaluate
    prompt: "زميل جرّب ثلاثين نموذجًا واختار الأفضل أداءً على عينة الاختبار، فحصل على دقة 91٪. ما تقييمك للرقم؟"
    options:
      - "رقم سليم ما دامت عينة الاختبار منفصلة عن التدريب."
      - "رقم متفائل بالضرورة، لأن أخذ أقصى ثلاثين قيمة على عينة محدودة منحاز نحو الأعلى بالبناء."
      - "رقم غير مقبول، ويجب حذف النتيجة كلها."
      - "رقم سليم بشرط أن تكون النماذج الثلاثون من عائلة واحدة."
    answer: 1
    explanation: "بالاختيار على أساس الأداء على عينة الاختبار، صارت جزءًا من التدريب عبر يد الباحث. والعلاج ثلاث عينات: تدريب، وتثبيت للاختيار، واختبار يُفتح مرة واحدة. والعلاج الأمين للنتيجة القائمة هو الإبلاغ عن الإجراء وعرض الرقم حدًا أعلى متفائلًا."
    why_wrong:
      0: "الانفصال عن التدريب لا يكفي: المعلومة تسرّبت عبر قرار الاختيار لا عبر الخوارزمية."
      2: "الحذف ليس العلاج المنهجي؛ فالإبلاغ الأمين يحوّل الخطأ إلى حدّ معروف في النتيجة."
      3: "عائلة النماذج لا تغيّر شيئًا، فالتحيّز يأتي من عدد المحاولات لا من تشابهها."
    review: m10-l07
  - id: m10-q10
    type: multi
    bloom: apply
    prompt: "مذكرة تبني مؤشرًا نصيًا من صحيفة واحدة بقاموس مشاعر عام مترجم، بالعدّ المطلق وبلا تحقق. أي هذه إصلاحات صحيحة؟ (اختر كل ما ينطبق)"
    options:
      - "التطبيع بعدد الكلمات أو عدد المقالات."
      - "الاكتفاء بزيادة حجم الأرشيف المستعمل."
      - "تصنيف عيّنة يدويًا وفق دليل مكتوب، وتقرير نسبة الاتفاق."
      - "إضافة مصادر مختلفة التوجه، مع تقرير النتيجة لكل مصدر."
      - "بناء قائمة كلمات مخصّصة للسياق والتحقق منها."
    answer: [0, 2, 3, 4]
    explanation: "التطبيع يعالج أثر حجم المجموعة، والتصنيف اليدوي هو التحقق البشري، وتعدد المصادر يعالج التوجه التحريري، والقائمة المخصّصة تعالج خصوصية السياق. أما زيادة حجم الأرشيف فلا تصلح شيئًا من العيوب الأربعة، وقد تفاقم مشكلة تغيّر تركيبة المجموعة عبر الزمن."
    review: m10-l05
