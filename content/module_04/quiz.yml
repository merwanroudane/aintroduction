entry:
  - id: m04-e01
    type: mcq
    bloom: understand
    prompt: "ما العلاقة الصحيحة بين الذكاء الاصطناعي (AI) والتعلم الآلي (ML) والتعلم العميق (DL)؟"
    options:
      - "ثلاثة حقول منفصلة لا علاقة بينها."
      - "DL ⊂ ML ⊂ AI (علاقة تضمين)."
      - "AI ⊂ ML ⊂ DL."
      - "AI و ML مترادفان و DL شيء مختلف."
    answer: 1
    explanation: "علاقة تضمين: كل تعلم عميق تعلم آلي، وكل تعلم آلي ذكاء اصطناعي، والعكس غير صحيح."
    review: m04-l01
  - id: m04-e02
    type: mcq
    bloom: understand
    prompt: "لديك ألف صورة لقطط وكلاب **دون أي تسمية**. ما الذي تستطيع أن تفعله؟"
    options:
      - "تدريب مصنّف موجَّه مباشرة."
      - "اكتشاف مجموعات متشابهة في الصور (تجميع) دون معرفة أي مجموعة قطط وأيها كلاب."
      - "لا شيء إطلاقًا."
      - "حساب دقة النموذج."
    answer: 1
    explanation: "بلا أوسمة يمكن التعلم غير الموجَّه: اكتشاف البنية لا التصنيف إلى فئات مسماة."
    review: m04-l02
  - id: m04-e03
    type: tf
    bloom: understand
    prompt: "نموذج يجيب إجابة صحيحة عن كل مثال في بيانات التدريب هو بالضرورة نموذج جيد."
    answer: false
    explanation: "قد يكون حفظ البيانات (إفراط في التوافق) وفشل في التعميم على بيانات جديدة."
    review: m04-l05
  - id: m04-e04
    type: mcq
    bloom: apply
    prompt: "مرض يصيب 1% من الناس، ونظام يقول «سليم» لكل شخص. ما دقته الإجمالية؟ وما قيمته؟"
    options:
      - "دقة 1% وهو سيئ."
      - "دقة 99% وهو عديم القيمة لأنه لا يكتشف أي مريض (استدعاء 0%)."
      - "دقة 50% وهو متوسط."
      - "لا يمكن حساب الدقة."
    answer: 1
    explanation: "مفارقة الدقة: رقم عالٍ بلا أي فائدة. قارن دائمًا بخط الأساس الساذج."
    review: m04-l06
  - id: m04-e05
    type: mcq
    bloom: remember
    prompt: "ما المقصود بـ«المعامل الفائق» (Hyperparameter)؟"
    options:
      - "معامل يتعلمه النموذج من البيانات."
      - "إعداد يحدده المصمم قبل التدريب، مثل معدل التعلم وعدد الطبقات."
      - "أكبر وزن في الشبكة."
      - "نوع من البيانات."
    answer: 1
    explanation: "المعاملات يتعلمها النموذج، والمعاملات الفائقة يحددها المصمم وتُضبط على مجموعة التحقق."
    review: m04-l03

questions:
  - id: m04-q01
    type: mcq
    bloom: understand
    prompt: "أي مما يلي مثال على ذكاء اصطناعي **ليس** تعلمًا آليًا؟"
    options:
      - "شبكة تصنّف صور الأشعة."
      - "خوارزمية A* تحسب أقصر مسار وفق قواعد ودالة تقديرية."
      - "نموذج يتنبأ بسعر شقة من بيانات صفقات سابقة."
      - "نموذج لغوي يولّد نصًا."
    answer: 1
    explanation: "البحث في فضاء الحالات لا يستنتج قواعده من بيانات ولا يتحسن بازدياد الخبرة."
    review: m04-l01
  - id: m04-q02
    type: mcq
    bloom: understand
    prompt: "ما الفرق الجوهري بين النموذج التمييزي والنموذج التوليدي؟"
    options:
      - "التوليدي أسرع."
      - "التمييزي يتعلم الحدود بين الفئات، والتوليدي يتعلم بنية البيانات فيستطيع إنتاج أمثلة جديدة."
      - "التمييزي للصور والتوليدي للنصوص."
      - "لا فرق."
    answer: 1
    explanation: "التمييزي يقدّر P(y|x)، والتوليدي يقدّر P(x) أو P(x,y) فيولّد أمثلة."
    review: m04-l01
  - id: m04-q03
    type: scenario
    bloom: apply
    scenario: "فريق يريد تدريب نموذج لغوي على مليون وثيقة قانونية غير موسومة، بإخفاء كلمات وطلب التنبؤ بها."
    prompt: "ما نمط التعلم المستعمل؟"
    options: ["موجَّه", "غير موجَّه", "ذاتي الإشراف", "معزز"]
    answer: 2
    explanation: "الإشارة التعليمية مشتقة من البيانات نفسها دون وسم بشري = تعلم ذاتي الإشراف."
    why_wrong: {1: "غير الموجَّه يكتشف بنية (تجميع، تقليل أبعاد) ولا يولّد هدفًا للتنبؤ من البيانات."}
    review: m04-l02
  - id: m04-q04
    type: mcq
    bloom: understand
    prompt: "لماذا يُقال إن التعلم الذاتي الإشراف غيّر اقتصاد بناء النماذج؟"
    options:
      - "لأنه لا يحتاج إلى حوسبة."
      - "لأنه نقل القيد من الوسم البشري البطيء والمكلف إلى الحوسبة القابلة للتوسع، فأمكن التدرب على بيانات هائلة."
      - "لأنه يلغي الحاجة إلى البيانات."
      - "لأنه أدق دائمًا من التعلم الموجَّه."
    answer: 1
    explanation: "الوسم مورد بشري نادر؛ والحوسبة مورد قابل للشراء والتوسع."
    review: m04-l02
  - id: m04-q05
    type: multi
    bloom: analyze
    prompt: "أي الحالات التالية يُعد فيها التقسيم العشوائي للبيانات **خاطئًا**؟ (اختر كل ما ينطبق)"
    options:
      - "بيانات زمنية للتنبؤ بالمستقبل."
      - "عشر صور لكل مريض في مجموعة بيانات طبية."
      - "بيانات فيها فئة نادرة جدًا."
      - "بيانات مستقلة متوازنة الفئات."
    answer: [0, 1, 2]
    explanation: "الزمنية تحتاج تقسيمًا زمنيًا، والمجمّعة تقسيمًا حسب المجموعة، والنادرة تقسيمًا طبقيًا."
    review: m04-l03
  - id: m04-q06
    type: scenario
    bloom: analyze
    scenario: "نموذج للتنبؤ بتخلف العميل عن السداد يستعمل سمة «عدد مكالمات قسم التحصيل»، وحقق أداءً ممتازًا في التطوير ثم فشل في الواقع."
    prompt: "ما التشخيص؟"
    options:
      - "معدل تعلم خاطئ."
      - "تسرب بيانات زمني: السمة لا توجد إلا **بعد** وقوع التخلف، فلن تكون متاحة وقت التنبؤ."
      - "بيانات كثيرة جدًا."
      - "النموذج بسيط جدًا."
    answer: 1
    explanation: "السؤال الواقي: هل ستتوفر هذه المعلومة فعلًا في اللحظة التي أستعمل فيها النموذج؟"
    review: m04-l03
  - id: m04-q07
    type: mcq
    bloom: understand
    prompt: "شبكة بعشر طبقات كلها بدوال تنشيط خطية. ما قدرتها التمثيلية؟"
    options:
      - "أقوى بعشر مرات من طبقة واحدة."
      - "تعادل تمامًا طبقة واحدة، لأن تركيب الدوال الخطية دالة خطية."
      - "لا تعمل إطلاقًا."
      - "تعادل شبكة بعشرين طبقة."
    answer: 1
    explanation: "W₂(W₁x+b₁)+b₂ = W'x+b'. اللاخطية شرط وجود للتعلم العميق لا تحسين اختياري."
    review: m04-l04
  - id: m04-q08
    type: mcq
    bloom: apply
    prompt: "شبكة: 10 مدخلات ← طبقة خفية بـ8 وحدات ← 3 مخرجات. كم معاملًا فيها (مع الانحيازات)؟"
    options: ["104", "115", "80", "88"]
    answer: 1
    explanation: "بين المدخلات والطبقة الخفية: 10×8 أوزان + 8 انحيازات = 88. وبين الخفية والمخرج: 8×3 + 3 = 27. المجموع 115."
    why_wrong:
      0: "نسيان بعض الانحيازات (104 = 80 + 24، أي الأوزان وحدها + بعض الانحيازات)."
      2: "حساب أوزان الطبقة الأولى فقط (10×8) دون بقية الشبكة."
      3: "التوقف عند الطبقة الأولى كاملة (88) ونسيان طبقة المخرج."
    review: m04-l04
  - id: m04-q09
    type: mcq
    bloom: understand
    prompt: "ما أثر معدل تعلم كبير جدًا في النزول التدريجي؟"
    options:
      - "تقارب أسرع دائمًا."
      - "الخطوات تتجاوز القاع فتتذبذب الخسارة أو تتباعد، لأن الميل يدل على الاتجاه لا على المسافة الآمنة."
      - "لا أثر له."
      - "يمنع الإفراط في التوافق."
    answer: 1
    explanation: "الميل تقريب محلي صالح لخطوة صغيرة؛ الخطوة الكبيرة تقفز عبر القاع."
    review: m04-l05
  - id: m04-q10
    type: scenario
    bloom: analyze
    scenario: "نموذج خطؤه على بيانات التدريب 1% وعلى بيانات الاختبار 24%."
    prompt: "ما التشخيص وما أول علاج تجربه؟"
    options:
      - "نقص توافق؛ زد التعقيد."
      - "إفراط في التوافق؛ ابدأ بالتحقق من التسرب وصحة التقسيم، ثم زيادة البيانات، ثم التنظيم."
      - "النموذج ممتاز."
      - "معدل التعلم صغير؛ ارفعه."
    answer: 1
    explanation: "فجوة كبيرة بين التدريب والاختبار = إفراط في التوافق، وقد تكون عرضًا لخطأ منهجي أيضًا."
    review: m04-l05
  - id: m04-q11
    type: scenario
    bloom: evaluate
    scenario: "نظام كشف احتيال على 10,000 معاملة فيها 200 احتيالية: TP=150، FN=50، FP=300، TN=9500. ونموذج ساذج يقول «سليمة» للجميع."
    prompt: "أي مقارنة هي الصحيحة؟"
    options:
      - "النموذج أفضل لأن دقته 96.5% أعلى من الساذج."
      - "الساذج أعلى دقة إجمالية (98%) لكن استدعاؤه 0%؛ فالدقة مضللة هنا، والمقياسان ذوا المعنى هما الاستدعاء (75%) والدقة الإيجابية (33%)."
      - "الاثنان متساويان."
      - "لا يمكن المقارنة."
    answer: 1
    explanation: "هذا البرهان المباشر على أن الدقة الإجمالية مقياس مضلل في البيانات غير المتوازنة."
    review: m04-l06
  - id: m04-q12
    type: multi
    bloom: evaluate
    prompt: "لماذا يُعد اختيار عتبة القرار قرارًا قيميًا لا تقنيًا؟ (اختر كل ما ينطبق)"
    options:
      - "لأن الرياضيات تعطي المقايضة ولا تعطي نقطة التوقف."
      - "لأن نوعي الخطأ يصيبان أشخاصًا مختلفين بكلف مختلفة."
      - "لأن تحديدها يتطلب حكمًا على كلفة كل خطأ وعلى من تقع."
      - "لأن العتبة تُحسب تلقائيًا من دالة الخسارة دائمًا."
    answer: [0, 1, 2]
    explanation: "دور عالم البيانات عرض المقايضة بأرقام ملموسة، لا حسمها وحده."
    why_wrong: {3: "العتبة اختيار لاحق للتدريب، وليست ناتجًا آليًا لدالة الخسارة."}
    review: m04-l06
