module_number: 4
title: "مقارنة بين الذكاء الاصطناعي، التعلم الآلي، والتعلم العميق"
short_title: AI و ML و DL
title_en: "AI vs Machine Learning vs Deep Learning"
subtitle: "المحور التقني الأساسي: العلاقات، وأنماط التعلم، ومفردات التعلم الآلي، وكيف تتعلم الشبكات، وكيف نقيّمها."
description: |
  هذا هو **المحور التقني الأساسي** في المقرر. فكل ما سبق (التعريفات، والتاريخ، والأنواع) كان يمهّد لسؤال واحد:
  **كيف تعمل هذه الأنظمة فعلًا؟** وكل ما سيأتي (النماذج اللغوية، وهندسة الأوامر، والتطبيقات الاقتصادية، والتحيز)
  يفترض المفردات التي نبنيها هنا.

  نبدأ بتصحيح أشهر خلط في الحقل: **الذكاء الاصطناعي والتعلم الآلي والتعلم العميق ليست مترادفات ولا فروعًا متوازية،
  بل علاقة تضمين**. ثم ننتقل إلى **أنماط التعلم** الخمسة، ونخصص للتعلم الذاتي الإشراف مكانة خاصة لأنه أساس النماذج
  اللغوية الحديثة. ثم نبني **مفردات التعلم الآلي** التي سيستعملها الطالب في كل ما تبقى: البيانات، والسمة، والوسم،
  والمعاملات، والخسارة، والتعميم.

  والنصف الثاني من المحور تقني أعمق لكنه يبقى في متناول المبتدئ: من **البيرسبترون** إلى الشبكات العميقة، ثم
  **كيف يحدث التعلم** بالخسارة والنزول التدريجي، وأخيرًا **كيف نقيّم النموذج** بمقاييس تناسب المهمة. وفي كل خطوة
  نربط الرياضيات بالحدس: المعادلة تأتي بعد الفكرة لا قبلها، وتوضع في «تعمق تقني» يستطيع الأستاذ تخطيه في حصة قصيرة.
estimated_duration: "6 حصص × 90 دقيقة"
difficulty: متوسط
keywords: [الذكاء الاصطناعي, التعلم الآلي, التعلم العميق, الذكاء التوليدي, أنماط التعلم, التعلم الموجَّه, التعلم غير الموجَّه, التعلم الذاتي الإشراف, التعلم المعزز, السمة, الوسم, المعاملات, الخسارة, النزول التدريجي, الإفراط في التوافق, التعميم, الدقة, الاستدعاء]
concept_diagram: m04_concept_map
objectives:
  - {bloom: remember, text: "يعرّف المصطلحات الأساسية: بيانات، سمة، وسم، نموذج، معاملات، معاملات فائقة، خسارة، استدلال."}
  - {bloom: understand, text: "يشرح علاقة التضمين بين الذكاء الاصطناعي والتعلم الآلي والتعلم العميق ويحدد موقع الذكاء التوليدي والنماذج التأسيسية منها."}
  - {bloom: understand, text: "يفسّر أنماط التعلم الخمسة ويحدد نمط التعلم المناسب لمسألة معينة."}
  - {bloom: apply, text: "يطبق تقسيم البيانات إلى تدريب وتحقق واختبار، ويحسب مقاييس التقييم المناسبة للمهمة."}
  - {bloom: analyze, text: "يحلل منحنيات الخطأ لتشخيص الإفراط في التوافق أو نقصه، ويقترح علاجًا."}
  - {bloom: evaluate, text: "يقيّم مدى ملاءمة مقياس تقييم لمهمة معينة، وبخاصة في البيانات غير المتوازنة."}
  - {bloom: create, text: "يصمم مخطط عمل كاملًا لمسألة تعلم آلي من تحديد المهمة إلى التقييم والنشر والمراقبة."}
prerequisites:
  - "المحاضرة 1.2 (وظائف الذكاء الاصطناعي: التنبؤ والتصنيف والتوليد)."
  - المحاضرة 2.4 (تعلّم التمثيلات والعوامل الثلاثة).
  - "رياضيات المرحلة الثانوية: الدوال، والمشتقة بمعناها الحدسي (الميل)، والنسب المئوية."
entry:
  prior_knowledge:
    - "يعرف الطالب من المحاضرة 1.2 الفرق بين التصنيف والانحدار والتوليد؛ يبني هذا المحور عليه المفردات الكاملة ومقاييس التقييم."
    - "يعرف من المحاضرة 2.3 أن التعلم الآلي يستنتج القواعد من البيانات بدل أن يكتبها الخبير؛ نفصّل هنا كيف يحدث ذلك رياضيًا."
    - "يعرف من المحاضرة 2.4 أن الشبكات العميقة تتعلم التمثيلات بنفسها؛ نشرح هنا آلية النزول التدريجي التي تجعل ذلك ممكنًا."
    - "يعرف من دراسته الثانوية معنى الدالة والميل؛ نستعمله مدخلًا بديهيًا إلى النزول التدريجي."
  diagnostic_questions:
    - ارسم بكلماتك العلاقة بين الذكاء الاصطناعي والتعلم الآلي والتعلم العميق. هل هي دوائر متداخلة أم متقاطعة أم منفصلة؟
    - إذا أعطيتك ألف صورة لقطط وكلاب دون أي تسمية، وطلبت منك أن «تتعلم» شيئًا منها، ماذا تستطيع أن تفعل؟
    - نموذج يجيب إجابة صحيحة عن كل سؤال في كتابك المدرسي ويفشل في الامتحان. ما المشكلة في رأيك؟
    - نظام يكشف مرضًا نادرًا يصيب 1% من الناس وحقق «دقة 99%». هل هذا إنجاز؟ فكر جيدًا قبل الإجابة.
exit:
  competencies:
    - أستطيع أن أشرح علاقة التضمين بين AI و ML و DL وأضع الذكاء التوليدي والنماذج التأسيسية في موقعها.
    - أستطيع أن أحدد نمط التعلم المناسب لمسألة معطاة وأبرر اختياري.
    - أستطيع أن أستعمل مفردات التعلم الآلي استعمالًا دقيقًا في وصف أي نظام.
    - أستطيع أن أشرح كيف يتعلم النموذج بالخسارة والنزول التدريجي شرحًا حدسيًا ورياضيًا مبسطًا.
    - أستطيع أن أشخّص الإفراط في التوافق ونقصه من منحنيات الخطأ وأقترح علاجًا.
    - أستطيع أن أختار مقياس تقييم مناسبًا للمهمة وأشرح لماذا لا تكفي الدقة الإجمالية.
  assessment_activities:
    - "اختبار بعدي يجمع أسئلة مفاهيمية وحسابية وسيناريوهات."
    - "تمرين حسابي: مصفوفة ارتباك تُحسب منها الدقة والاستدعاء و F1 يدويًا."
    - "نشاط مختبري: ضبط تعقيد النموذج حتى الوصول إلى أفضل توازن، مع تقرير من فقرة."
    - "مشروع مصغر: تصميم مخطط عمل كامل لمسألة من اختيار الطالب دون كتابة شيفرة."
    - "تقييم أقران لخريطة مفاهيمية تربط المفردات الثمانية عشر للمحور."
  common_mistakes:
    - اعتبار الذكاء الاصطناعي والتعلم الآلي مترادفين، أو اعتبار التعلم العميق بديلًا عن التعلم الآلي لا جزءًا منه.
    - الخلط بين المعاملات (يتعلمها النموذج) والمعاملات الفائقة (يحددها المصمم).
    - تقييم النموذج على بيانات التدريب نفسها والاطمئنان إلى النتيجة.
    - الاعتماد على الدقة الإجمالية في بيانات غير متوازنة.
    - الخلط بين الخسارة (ما يُحسّنه النموذج) والمقياس (ما يهم المستخدم).
    - تصور النزول التدريجي بحثًا عن «الحل الصحيح» بدل تقليل تدريجي للخطأ.
  remediation:
    - إذا بقيت علاقة التضمين غامضة، أعد رسم الدوائر المتداخلة بنفسك وضع خمسة أنظمة في مواضعها الصحيحة (المحاضرة 4.1).
    - إذا اختلطت أنماط التعلم، استعمل مختبر تصنيف المسائل حتى تبلغ 8 من 10 (المحاضرة 4.2).
    - إذا لم تتضح فكرة الإفراط في التوافق، شغّل مختبر التعقيد وراقب منحنيي التدريب والاختبار (المحاضرة 4.5).
    - إذا صعبت مقاييس التقييم، أعد حساب مصفوفة الارتباك يدويًا لمثال المرض النادر (المحاضرة 4.6).
    - شاهد سلسلة 3Blue1Brown عن النزول التدريجي والانتشار العكسي، ثم أعد قراءة التعمق التقني في المحاضرة 4.5.
  suggested_reading: [m04_goodfellow_2016, m04_james_islr, m04_lecun_2015, m04_google_mlcc, m04_mitchell_1997]
  bridge: |
    بنينا في هذا المحور مفردات التعلم الآلي كاملة: أنماط التعلم، والبيانات والسمات والأوزان، والخسارة والنزول
    التدريجي، والتعميم والتقييم. وهذه المفردات هي المفتاح المباشر للمحور التالي. فالنماذج اللغوية الكبيرة ليست
    استثناءً من هذه المبادئ، بل تطبيق لها على نطاق هائل: تعلم ذاتي الإشراف على نصوص ضخمة، وخسارة هي التنبؤ بالرمز
    التالي، ومعاملات بالمليارات. **المحور 7** يأخذ هذه اللبنات ويبني بها المحوّل ودورة حياة النموذج اللغوي.
instructor:
  sequence:
    - "لا تبدأ بالتعريفات: ابدأ بسؤال «أعطوني أمثلة لأنظمة تتعلم من البيانات»، ثم صنّفوا الأمثلة معًا إلى موجَّه وغير موجَّه ومعزز. هذا يقلب ترتيب العرض ويجعل التصنيف اكتشافًا لا إملاءً."
    - "4.1 (الخريطة) ثم 4.2 (الأنماط) ثم 4.3 (المفردات والمخطط) قبل أي رياضيات."
    - "4.4 (البيرسبترون إلى الشبكات) و4.5 (كيف يحدث التعلم) تقنيتان: استعمل المختبرات قبل المعادلات."
    - "4.6 (التقييم) يمكن تقديمها على 4.4 و4.5 مع المجموعات غير التقنية، لأنها الأكثر فائدة عملية وأقلها رياضيات."
  timing:
    - "الحصة 1 (90 د): النشاط الافتتاحي (15 د) + المحاضرة 4.1 (60 د) + بطاقة خروج (15 د)."
    - "الحصة 2 (90 د): المحاضرة 4.2 مع مختبر تصنيف المسائل."
    - "الحصة 3 (90 د): المحاضرة 4.3 مع تمرين تقسيم البيانات."
    - "الحصة 4 (90 د): المحاضرة 4.4 مع مختبر البيرسبترون."
    - "الحصة 5 (90 د): المحاضرة 4.5 مع مختبري النزول التدريجي والتعقيد."
    - "الحصة 6 (90 د): المحاضرة 4.6 مع مختبر العتبة + الاختبار البعدي (25 د)."
    - "في حصة قصيرة (60 د): ادمج 4.4 و4.5 في «كيف تتعلم الشبكة» واكتفِ بالتعمق التقني الأول."
  discussion:
    - "إذا كان النموذج يحفظ بيانات التدريب حرفيًا ويعطي 100% عليها، فما الذي ينقصه ليكون مفيدًا؟"
    - "هل يمكن أن يكون نموذج أدق ومع ذلك أسوأ للاستعمال؟ اذكر حالة."
    - "من يقرر ما هو «الخطأ»؟ دالة الخسارة اختيار بشري: ما أثر اختيارها على من يتضرر من أخطاء النظام؟"
    - "لماذا يُعد التعلم الذاتي الإشراف تغييرًا جذريًا في اقتصاد بناء النماذج؟"
  assessment_ideas:
    - "أعطِ مصفوفة ارتباك لمسألة طبية واطلب حساب المقاييس ثم توصية بالعتبة المناسبة مع التبرير."
    - "سؤال مقالي: «الدقة العالية على مجموعة الاختبار لا تكفي». ناقش بثلاث حجج من المحور."
    - "اطلب تصميم تقسيم بيانات لمسألة تنبؤ زمني (وهي حالة لا يصح فيها التقسيم العشوائي) واسأل عن السبب."
    - "تمرين تصحيح: نص فيه ستة أخطاء مفاهيمية في استعمال المصطلحات، يُطلب تصحيحها."
  extensions:
    - "قراءة Zhang وزملائه (2016) عن إعادة التفكير في التعميم، ومناقشة كيف تحفظ الشبكات بيانات عشوائية ومع ذلك تعمّم."
    - "مبرهنة التقريب الشامل (Hornik et al., 1989): ماذا تقول بالضبط؟ ولماذا لا تعني أن التدريب سيجد الحل؟"
    - "مقارنة الغابات العشوائية (Breiman, 2001) والتعزيز التدريجي (Friedman, 2001) بالشبكات العميقة على البيانات الجدولية."
