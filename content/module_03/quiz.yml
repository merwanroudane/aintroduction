entry:
  - id: m03-e01
    type: tf
    bloom: remember
    prompt: "توجد اليوم أنظمة ذكاء اصطناعي عام (AGI) قيد الاستعمال الفعلي."
    answer: false
    explanation: "كل الأنظمة المتحققة اليوم ضيقة النطاق؛ والذكاء العام مفهوم محل نقاش لا تعريف ولا مقياس متفق عليهما."
    review: m03-l01
  - id: m03-e02
    type: mcq
    bloom: understand
    prompt: "نظام منظم حرارة يشغّل التدفئة تلقائيًا دون سؤالك. ما الوصف الأدق؟"
    options:
      - "نظام ذكي جدًا لأنه يقرر بنفسه."
      - "نظام ضيق النطاق لكنه عالي الاستقلالية."
      - "نظام واسع النطاق منخفض الاستقلالية."
      - "ليس نظام ذكاء اصطناعي إطلاقًا."
    answer: 1
    explanation: "النطاق والاستقلالية بعدان مستقلان: مهمة واحدة بسيطة مع تنفيذ تلقائي دون موافقة."
    review: m03-l01
  - id: m03-e03
    type: tf
    bloom: understand
    prompt: "إذا تفوق نظام على البشر في عشر مهام مختلفة، فهو بالضرورة ذكاء اصطناعي عام."
    answer: false
    explanation: "تعدد المهام لا يعني القدرة على التعميم إلى مجالات جديدة نوعيًا ولا نقل الخبرة بينها."
    review: m03-l01
  - id: m03-e04
    type: mcq
    bloom: remember
    prompt: "ما المقصود بأن نظامًا «يعمّم» (Generalizes)؟"
    options:
      - "أنه يعمل على حواسيب كثيرة."
      - "أنه ينجح في حالات جديدة لم ترد في بيانات تدريبه."
      - "أنه يستهلك طاقة أقل."
      - "أنه يعطي إجابات عامة غامضة."
    answer: 1
    explanation: "التعميم هو النجاح خارج توزيع بيانات التدريب، وهو جوهر النقاش حول الذكاء العام."
    review: m03-l04
  - id: m03-e05
    type: mcq
    bloom: understand
    prompt: "أي التصنيفات التالية يوجّه قرارًا عمليًا بشأن استعمال نظام؟"
    options:
      - "تصنيفه بأنه «ذو ذاكرة محدودة»."
      - "تصنيفه حسب مستوى المخاطر والاستقلالية، لأن ذلك يحدد أين تلزم الرقابة البشرية."
      - "تصنيفه بأنه «تفاعلي»."
      - "تصنيفه حسب لون واجهته."
    answer: 1
    explanation: "معيار التصنيف الجيد: هل يغيّر ما ستفعله؟ تصنيف المخاطر والاستقلالية يفعل ذلك."
    review: m03-l03

questions:
  - id: m03-q01
    type: mcq
    bloom: remember
    prompt: "أي الفئات الثلاث متحقق فعليًا اليوم؟"
    options: ["الذكاء العام (AGI)", "الذكاء الفائق (ASI)", "الذكاء الضيق (ANI)", "الثلاثة معًا"]
    answer: 2
    explanation: "كل الأنظمة الموجودة ضيقة النطاق، وإن اتسع نطاق النماذج التأسيسية؛ والفئتان الأخريان مفهومان لا واقع."
    review: m03-l01
  - id: m03-q02
    type: mcq
    bloom: understand
    prompt: "ما الخاصية الأخطر في الأنظمة الضيقة النطاق؟"
    options:
      - "أنها بطيئة."
      - "أنها تفشل خارج نطاقها **دون أن تدرك أنها خارج نطاقها**، فتجيب بثقة."
      - "أنها تحتاج إلى إنترنت."
      - "أنها مكلفة."
    answer: 1
    explanation: "الهشاشة مع غياب الإشارة إلى عدم اليقين: الخبير البشري يقول «لست متأكدًا»، والنظام لا يفعل تلقائيًا."
    review: m03-l01
  - id: m03-q03
    type: scenario
    bloom: analyze
    scenario: "نظامان: الأول مساعد حواري يجيب في مجالات كثيرة لكنه لا ينفذ شيئًا دون طلبك. الثاني نظام بسيط يتحكم في جرعة دواء في مستشفى ويعمل تلقائيًا."
    prompt: "أيهما يستدعي ضوابط رقابية أشد، ولماذا؟"
    options:
      - "الأول لأنه أوسع نطاقًا وأذكى."
      - "الثاني لأن الخطر يتناسب مع الاستقلالية وحجم الأثر لا مع اتساع النطاق."
      - "كلاهما بالدرجة نفسها لأن الذكاء واحد."
      - "لا يحتاج أي منهما إلى ضوابط."
    answer: 1
    explanation: "نظام بسيط عالي الاستقلالية ذو أثر صحي غير قابل للعكس أخطر من نموذج واسع لا ينفذ شيئًا."
    why_wrong: {0: "اتساع النطاق ليس مقياس الخطر؛ المقياس هو الاستقلالية وطبيعة الأثر."}
    review: m03-l01
  - id: m03-q04
    type: mcq
    bloom: understand
    prompt: "لماذا يقترح إطار «مستويات AGI» (Morris et al., 2023) بعدين بدل عتبة واحدة؟"
    options:
      - "لتعقيد المسألة بلا فائدة."
      - "لأن الوصف ببعدي الأداء والعمومية يحوّل سؤالًا ثنائيًا خلافيًا إلى قياس متدرج أدق."
      - "لأن الذكاء العام تحقق فعلًا."
      - "لأن العمومية لا تهم."
    answer: 1
    explanation: "الإطار ينظّم الخلاف ولا يلغيه، ويفصل أيضًا بين القدرة والاستقلالية."
    review: m03-l02
  - id: m03-q05
    type: mcq
    bloom: understand
    prompt: "ما جوهر اقتراح Chollet (2019) في قياس الذكاء؟"
    options:
      - "قياس عدد المعاملات في النموذج."
      - "قياس **كفاءة اكتساب مهارة جديدة** من أمثلة قليلة، لا الأداء في مهارات مكتسبة مسبقًا."
      - "قياس سرعة الاستجابة."
      - "قياس رضا المستخدمين."
    answer: 1
    explanation: "الأداء في مهارة محددة يقيس نتيجة تدريب مكثف عليها، لا القدرة على التعلم الجديد."
    review: m03-l02
  - id: m03-q06
    type: multi
    bloom: analyze
    prompt: "ما الاعتراضات المنهجية التي وُجّهت إلى ادعاءات «بوادر الذكاء العام»؟ (اختر كل ما ينطبق)"
    options:
      - "المنهج استكشافي يعتمد أمثلة مختارة لا عينة تمثيلية."
      - "احتمال تسرب بيانات الاختبار إلى بيانات التدريب."
      - "هشاشة الأداء عند تعديلات بسيطة على صياغة المهمة."
      - "أن النماذج اللغوية لا تستطيع إنتاج نص مفهوم أصلًا."
    answer: [0, 1, 2]
    explanation: "ثلاثة اعتراضات منهجية موثقة؛ والرابع ادعاء خاطئ لا يقول به أحد."
    review: m03-l02
  - id: m03-q07
    type: mcq
    bloom: evaluate
    prompt: "استطلاع لآلاف الباحثين أظهر تباينًا واسعًا في تقديرات توقيت قدرات مستقبلية. ما الاستنتاج الأدق؟"
    options:
      - "الذكاء العام قريب جدًا."
      - "الذكاء العام مستحيل."
      - "لا يوجد إجماع علمي؛ والتباين الواسع ليس دليل قرب ولا بعد، وآراء الخبراء ليست بيانات تجريبية."
      - "الاستطلاعات لا قيمة لها إطلاقًا."
    answer: 2
    explanation: "التباين مؤشر على غياب الإجماع؛ وقد بيّن الاستطلاع نفسه أن صياغة السؤال تغيّر التقديرات."
    review: m03-l02
  - id: m03-q08
    type: mcq
    bloom: understand
    prompt: "ما الوضع المعرفي للتصنيف الرباعي (تفاعلية، ذاكرة محدودة، نظرية عقل، وعي ذاتي)؟"
    options:
      - "معيار تقني دولي معتمد."
      - "تصنيف تعليمي تبسيطي شاع في الكتابات التعريفية، وفئتاه الأخيرتان افتراضيتان."
      - "تصنيف قانوني في قانون الذكاء الاصطناعي الأوروبي."
      - "تصنيف لأنواع العتاد."
    answer: 1
    explanation: "ليس معيارًا رسميًا ولا يوجّه قرارًا عمليًا؛ وفائدته تمهيدية مفاهيمية."
    review: m03-l03
  - id: m03-q09
    type: scenario
    bloom: evaluate
    scenario: "أظهر نموذج لغوي نجاحًا في اختبار «المعتقد الخاطئ» الكلاسيكي، ثم انخفض أداؤه بشدة حين عُدّلت تفاصيل القصة تعديلًا لا يغير منطقها."
    prompt: "ما التفسير المنهجي الأرجح؟"
    options:
      - "النموذج يمتلك نظرية عقل كاملة."
      - "النجاح الأصلي قد يعتمد على أنماط نصية مألوفة جدًا في بيانات التدريب لا على استدلال متين عن الحالات الذهنية."
      - "الاختبار خاطئ تمامًا ولا معنى له."
      - "النموذج تعب من كثرة الأسئلة."
    answer: 1
    explanation: "الهشاشة أمام التعديلات البسيطة + انتشار هذه القصص في النصوص = مؤشران على الاسترجاع لا الاستدلال."
    review: m03-l03
  - id: m03-q10
    type: multi
    bloom: analyze
    prompt: "أي العبارات التالية تصف **الاستقلالية** لا الذكاء؟ (اختر كل ما ينطبق)"
    options:
      - "«ينفذ النظام عملية الشراء ويرسل التأكيد دون مراجعة.»"
      - "«يعمل الروبوت ساعات دون أي تدخل من المشغّل.»"
      - "«ينجح النظام في مهام من مجالات مختلفة نوعيًا لم يُدرَّب عليها.»"
      - "«ينقل النظام التصنيف تلقائيًا إلى المجلد المناسب.»"
    answer: [0, 1, 3]
    explanation: "الثالثة تصف التعميم (وهو أقرب إلى الذكاء)؛ والباقي يصف مقدار ما يُنفَّذ دون موافقة بشرية."
    review: m03-l04
  - id: m03-q11
    type: scenario
    bloom: evaluate
    scenario: "وكيل ذكي يقرأ بريد قسم جامعي، ويستطيع: تلخيص الرسائل، وحجز مواعيد في تقويم الأستاذ، وإرسال ردود باسم القسم، وحذف رسائل."
    prompt: "ما التصميم الرقابي الأنسب؟"
    options:
      - "أتمتة كل الأفعال لتوفير الوقت."
      - "تصنيف الأفعال حسب قابلية العكس: التلخيص تلقائي، والإرسال والحجز بموافقة صريحة، والحذف ممنوع أو بموافقة موثقة، مع سجل تدقيق."
      - "منع الوكيل من كل شيء."
      - "الاعتماد على ذكاء الوكيل في تقدير ما يناسب."
    answer: 1
    explanation: "قاعدة قابلية العكس: كلما صعب التراجع عن الفعل، ارتفع مستوى الموافقة المطلوب."
    review: m03-l04
  - id: m03-q12
    type: mcq
    bloom: create
    prompt: "أي صياغة هي الأدق لوصف وكيل ينجز حجوزات سفر كاملة دون تدخل؟"
    options:
      - "«وكيل ذكي جدًا يقترب من الذكاء العام.»"
      - "«وكيل ضيق النطاق (حجوزات السفر) عالي الوكالة والاستقلالية، لم تُقدَّم بيانات عن دقته أو سلوكه في الحالات الاستثنائية.»"
      - "«نظام واعٍ يفهم رغبات المسافر.»"
      - "«برنامج عادي لا علاقة له بالذكاء الاصطناعي.»"
    answer: 1
    explanation: "الصياغة الدقيقة تفصل النطاق عن الوكالة عن الاستقلالية، وتذكر ما لم يُقدَّم من أدلة."
    review: m03-l04
