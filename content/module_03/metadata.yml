module_number: 3
title: "أنواع الذكاء الاصطناعي: الضيق، العام، والفائق"
short_title: أنواع الذكاء الاصطناعي
title_en: "Types of AI: Narrow, General and Super"
subtitle: تصنيف حسب القدرة، وتمييز مفاهيم كثيرًا ما تُخلط، وفصل الواقع المتحقق عن النقاش النظري.
description: |
  يعالج هذا المحور التصنيف الأشهر في أدبيات الذكاء الاصطناعي: **الضيق (ANI)** و**العام (AGI)** و**الفائق (ASI)**.
  وهو تصنيف مفيد تعليميًا لكنه محفوف بسوء الفهم، لأن الإعلام يقدّمه غالبًا سلمًا زمنيًا حتميًا: الضيق اليوم،
  فالعام غدًا، فالفائق بعده. وهذه قراءة لا يدعمها الدليل، وهي حالة من **مغالطة الاستمرارية** التي درسناها في المحور 2.

  الموقف العلمي الذي يتبناه المقرر واضح: **الأنظمة المتحققة اليوم كلها ضيقة**، وإن اتسع نطاق النماذج التأسيسية
  حتى صار وصف «الضيق» أقل دقة مما كان. أما **الذكاء العام** فمفهوم لا يوجد له تعريف واحد متفق عليه ولا مقياس
  معتمد، والنقاش حوله بين باحثين جادين مفتوح. وأما **الذكاء الفائق** فمفهوم نظري بالكامل، يُبحث تحليليًا في
  أدبيات المخاطر، وليس وصفًا لواقع.

  ولا يقف المحور عند هذا التصنيف. فالأهم منه تعليميًا هو **تفكيك مفاهيم تُخلط باستمرار**: القدرة، والذكاء،
  والاستقلالية، والوكالة، والتكيف، والتعميم. فحين يقول الطالب «هذا النظام ذكي جدًا»، يكون غالبًا قد خلط بين
  أربعة مفاهيم في عبارة واحدة. وتفكيكها هو ما يسمح بقراءة دقيقة لأي نظام، وهو ما يجعل عبارة **«الوكيل الذكي
  ليس ذكاءً عامًا»** مفهومة لا مجرد شعار.
estimated_duration: "4 حصص × 90 دقيقة"
difficulty: مبتدئ
keywords: [الذكاء الضيق, ANI, الذكاء العام, AGI, الذكاء الفائق, ASI, الآلات التفاعلية, الذاكرة المحدودة, نظرية العقل, الوعي الذاتي, الاستقلالية, الوكالة, التعميم, التكيف, مستويات AGI]
concept_diagram: m03_concept_map
objectives:
  - {bloom: remember, text: "يعرّف الذكاء الضيق والعام والفائق ويحدد أيها متحقق اليوم."}
  - {bloom: understand, text: "يشرح لماذا يُعد الذكاء العام والفائق مفهومين محل نقاش لا واقعًا موصوفًا."}
  - {bloom: understand, text: "يشرح التصنيف التعليمي الرباعي (تفاعلية، ذاكرة محدودة، نظرية عقل، وعي ذاتي) ويحدد طبيعته غير الرسمية."}
  - {bloom: apply, text: "يصنّف أنظمة واقعية حسب اتساع نطاقها ومستوى استقلاليتها."}
  - {bloom: analyze, text: "يفكك عبارة عن نظام إلى مفاهيمها الدقيقة: قدرة، ذكاء، استقلالية، وكالة، تكيف، تعميم."}
  - {bloom: evaluate, text: "يقيّم ادعاءً بأن نظامًا ما «يقترب من الذكاء العام» في ضوء غياب تعريف ومقياس متفق عليهما."}
prerequisites:
  - المحاضرة 1.1 (تعريفات الذكاء الاصطناعي وقدرات الذكاء).
  - المحاضرة 2.5 (النماذج التأسيسية ومغالطة الاستمرارية).
entry:
  prior_knowledge:
    - "يعرف الطالب من المحاضرة 1.1 أن الذكاء حزمة قدرات لا قدرة واحدة؛ يبني هذا المحور على ذلك ليفسر لماذا يصعب تعريف «الذكاء العام»."
    - "يعرف من المحاضرة 1.5 أن الأنظمة قوية في نطاقات محددة؛ يضع هذا المحور لذلك مصطلحًا دقيقًا (ANI) وحدودًا واضحة."
    - "يعرف من المحاضرة 2.5 مغالطة الاستمرارية؛ يطبقها هنا مباشرة على سلّم ANI → AGI → ASI."
  diagnostic_questions:
    - هل تعتقد أن نظامًا يكتب نصوصًا مقنعة في أي موضوع يمتلك «ذكاءً عامًا»؟ ولماذا؟
    - ما الفرق في رأيك بين نظام «مستقل» ونظام «ذكي»؟ اذكر مثالًا لنظام مستقل وغير ذكي.
    - إذا تفوق نظام على البشر في عشر مهام مختلفة، هل يصبح ذكاءً عامًا؟ ما الذي ينقصه؟
    - كيف نقيس «الذكاء العام» في آلة؟ اقترح مقياسًا واحدًا، ثم اذكر عيبًا فيه.
exit:
  competencies:
    - أستطيع أن أعرّف ANI و AGI و ASI وأن أحدد أيها متحقق وأيها محل نقاش.
    - أستطيع أن أشرح لماذا لا يوجد تعريف ولا مقياس متفق عليهما للذكاء العام.
    - أستطيع أن أميز بين القدرة والذكاء والاستقلالية والوكالة والتكيف والتعميم.
    - أستطيع أن أشرح لماذا الوكيل الذكي ليس ذكاءً عامًا.
    - أستطيع أن أقيّم ادعاءً إعلاميًا عن «اقتراب الذكاء العام» تقييمًا منهجيًا.
  assessment_activities:
    - "اختبار بعدي يتضمن أسئلة سيناريو عن تصنيف أنظمة واقعية."
    - "نشاط تفكيك عبارات: تُعطى خمس جمل إعلامية وتُفكك إلى مفاهيمها الدقيقة."
    - "ورقة رأي قصيرة (نصف صفحة): «هل التصنيف الرباعي مفيد تعليميًا رغم عدم رسميته؟»"
    - "تقييم أقران لجدول مقارنة بين الوكيل الذكي والذكاء العام يعدّه كل طالب."
    - "مناظرة منظمة حول استطلاعات آراء الباحثين في توقيت الذكاء العام."
  common_mistakes:
    - قراءة ANI و AGI و ASI بوصفها مراحل زمنية حتمية متتابعة.
    - اعتبار التصنيف الرباعي (تفاعلية / ذاكرة محدودة / نظرية عقل / وعي ذاتي) تصنيفًا تقنيًا رسميًا.
    - الخلط بين الاستقلالية والذكاء، فكل نظام مستقل يُظن ذكيًا والعكس.
    - الاستدلال بتفوق نظام في مهام متعددة على امتلاكه ذكاءً عامًا.
    - الخلط بين الوكيل الذكي (Agent) والذكاء الاصطناعي العام (AGI).
  remediation:
    - إذا بقي الفرق بين ANI و AGI غامضًا، أعد جدول «ما ينقص للانتقال» في المحاضرة 3.1 واملأه بمثال من عندك.
    - إذا اختلطت عليك المفاهيم الستة، استعمل مختبر «فكّك العبارة» حتى تبلغ 8 من 10.
    - إذا صعب عليك نقد التصنيف الرباعي، اقرأ المحاضرة 3.3 وحدد لكل فئة سؤالًا لا تستطيع الإجابة عنه تجريبيًا.
    - اقرأ ملخص ورقة مستويات AGI (Morris et al., 2023) وحدد بعدين استعملهما المؤلفون لتصنيف الأنظمة.
  suggested_reading: [m03_morris_2023, m03_chollet_2019, m03_mitchell_book_2019, m03_grace_2024, m01_mitchell_2021]
  bridge: |
    ميّزنا في هذا المحور بين اتساع النطاق ومستوى الاستقلالية، وبين الذكاء والقدرة والوكالة. وكل هذه التمييزات
    تفترض فهمًا لآلية عمل الأنظمة نفسها: كيف تتعلم؟ وما الفرق بين التعلم الآلي والتعلم العميق؟ ومن أين تأتي
    قدرة النماذج الحديثة على التعميم؟ هذا هو موضوع **المحور 4**، وهو المحور التقني الأساسي في المقرر، وفيه
    نبني المفردات التي ستخدمنا في كل ما تبقى.
instructor:
  sequence:
    - "ابدأ بالأسئلة التشخيصية، وخصوصًا سؤال قياس الذكاء العام: صعوبته هي الدرس."
    - "3.1 (التصنيف حسب القدرة) ثم 3.2 (نقاش AGI) ثم 3.3 (التصنيف الرباعي) ثم 3.4 (المفاهيم الستة)."
    - "يمكن تقديم 3.4 على 3.3 مع المجموعات التقنية، لأن المفاهيم الستة أكثر فائدة عملية."
    - "احرص على الحياد في 3.2: اعرض مواقف الباحثين المختلفة بأدلتها دون ترجيح شخصي."
  timing:
    - "الحصة 1 (90 د): الأسئلة التشخيصية (10 د) + المحاضرة 3.1 (65 د) + نشاط تصنيف سريع (15 د)."
    - "الحصة 2 (90 د): المحاضرة 3.2 مع مناظرة منظمة (25 د)."
    - "الحصة 3 (90 د): المحاضرة 3.3 مع نقد التصنيف الرباعي."
    - "الحصة 4 (90 د): المحاضرة 3.4 + المختبر + الاختبار البعدي (20 د)."
    - "في حصة قصيرة (60 د): ادمج 3.1 و3.3، واحتفظ بـ3.4 كاملة لأنها الأكثر فائدة عملية."
  discussion:
    - "إذا لم يوجد تعريف متفق عليه للذكاء العام، فهل السؤال «متى نبلغه؟» سؤال علمي أصلًا؟"
    - "نظام يتفوق على البشر في 50 اختبارًا مختلفًا: ما الذي ما زال ينقصه ليوصف بالذكاء العام؟"
    - "هل يمكن أن يكون نظام شديد الاستقلالية ومحدود الذكاء؟ وما مخاطر هذه التركيبة تحديدًا؟"
    - "لماذا يُصر باحثون على مفهوم «مستويات» بدل عتبة واحدة للذكاء العام؟"
  assessment_ideas:
    - "اطلب جدولًا يقارن الوكيل الذكي بالذكاء العام في خمسة أبعاد، مع مثال لكل بعد."
    - "سؤال مقالي: «التصنيف الرباعي تعليمي لا تقني». ناقش مع بيان فائدته وحدوده."
    - "تمرين تصحيح لغوي ومفاهيمي: خمس عبارات إعلامية تُعاد صياغتها صياغة دقيقة."
  extensions:
    - "قراءة ورقة Morris وزملائه (2023) عن مستويات AGI ومناقشة بعدي الأداء والعمومية."
    - "قراءة Chollet (2019) ومناقشة اقتراحه قياس الذكاء بكفاءة اكتساب المهارة لا بالأداء في مهام محددة."
    - "مقارنة مستويات القيادة الذاتية في معيار SAE J3016 بمستويات استقلالية أنظمة الذكاء الاصطناعي عمومًا."
